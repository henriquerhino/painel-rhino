<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel RHINO · Consulting Framework</title>
<style>
:root{
  --preto:#000000; --carvao:#0d0d0d; --grafite:#161616; --linha:#242424;
  --cinza:#E6E8E9; --cinza-fraco:#8a8d8f; --verde:#44CF17; --verde-fundo:#122b06;
  --vermelho:#e24b4a; --vermelho-fundo:#2a0f0f; --ambar:#EF9F27; --ambar-fundo:#2b1d05;
  --mono:"Courier New",Courier,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--preto);color:var(--cinza);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:14px}
button{cursor:pointer}
a{color:var(--verde)}
.mono{font-family:var(--mono)}
.rotulo{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cinza-fraco)}
.quadrado{display:inline-block;width:9px;height:9px;background:var(--verde);margin-right:9px;vertical-align:1px;flex:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--verde)} .neg{color:var(--vermelho)} .aviso{color:var(--ambar)}
.oculto{display:none !important}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.caixa-login{width:100%;max-width:360px;border:1px solid var(--linha);background:var(--carvao);padding:34px 30px}
.caixa-login h1{font-size:20px;font-weight:600;margin:14px 0 4px}
.caixa-login p{font-size:13px;color:var(--cinza-fraco);margin-bottom:22px}
.campo{margin-bottom:12px}
.campo label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cinza-fraco);margin-bottom:5px}
input,select{width:100%;background:var(--grafite);border:1px solid var(--linha);color:var(--cinza);padding:9px 11px;border-radius:0}
input:focus,select:focus{outline:none;border-color:var(--verde)}
.btn{background:var(--verde);color:#000;border:none;padding:10px 18px;font-weight:600;font-size:13px;letter-spacing:.02em}
.btn:hover{filter:brightness(1.12)}
.btn-vazio{background:transparent;color:var(--cinza);border:1px solid var(--linha);padding:8px 14px;font-size:13px}
.btn-vazio:hover{border-color:var(--verde);color:var(--verde)}
.erro{background:var(--vermelho-fundo);border:1px solid var(--vermelho);color:#f5b0b0;padding:9px 12px;font-size:13px;margin-top:12px}

/* topo */
header{border-bottom:1px solid var(--linha);background:var(--carvao);position:sticky;top:0;z-index:20}
.topo{max-width:1180px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto}
.marca img{height:26px;width:auto;display:block}
.marca .nome{font-weight:600;font-size:15px;letter-spacing:-.01em}
.controles{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--linha)}
.seg button{background:transparent;border:none;color:var(--cinza-fraco);padding:6px 13px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.seg button.on{background:var(--verde);color:#000;font-weight:700}
header select{width:auto;padding:6px 10px;font-family:var(--mono);font-size:12px}

nav{border-bottom:1px solid var(--linha);background:var(--preto);overflow-x:auto}
.abas{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:2px}
.abas button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--cinza-fraco);padding:12px 15px;font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}
.abas button.on{color:var(--verde);border-bottom-color:var(--verde)}
.abas button:hover{color:var(--cinza)}

main{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
section h2{font-size:13px;font-family:var(--mono);letter-spacing:.13em;text-transform:uppercase;font-weight:400;color:var(--cinza);display:flex;align-items:center;margin:30px 0 13px}
section h2:first-child{margin-top:0}

.grade{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}

.kpi{background:var(--carvao);border:1px solid var(--linha);padding:15px 16px}
.kpi .t{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza-fraco);margin-bottom:7px}
.kpi .v{font-family:var(--mono);font-size:25px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--cinza-fraco);margin-top:5px}
.kpi.destaque{border-color:var(--verde)}

.cartao{background:var(--carvao);border:1px solid var(--linha);padding:16px}
.linha-fina{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--grafite);border-left:3px solid var(--verde);padding:11px 14px;font-size:13px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza-fraco);text-align:left;padding:8px 9px;border-bottom:1px solid var(--linha);font-weight:400;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid #141414;vertical-align:middle}
tbody tr:hover{background:var(--grafite)}
td.d,th.d{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rolagem{overflow-x:auto}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--linha);color:var(--cinza-fraco)}
.tag.ok{color:var(--verde);border-color:#1e4a0c;background:var(--verde-fundo)}
.tag.mal{color:var(--vermelho);border-color:#4a1414;background:var(--vermelho-fundo)}
.tag.av{color:var(--ambar);border-color:#4a3410;background:var(--ambar-fundo)}
.x{background:transparent;border:none;color:#4a4a4a;font-size:15px;padding:0 5px}
.x:hover{color:var(--vermelho)}
.mini{width:auto;min-width:56px;padding:4px 6px;font-size:12px;font-family:var(--mono)}

.alerta{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-left:3px solid var(--linha);background:var(--grafite);margin-bottom:7px;font-size:13px}
.alerta.a{border-left-color:var(--ambar)} .alerta.r{border-left-color:var(--vermelho)} .alerta.v{border-left-color:var(--verde)}

.barra{height:7px;background:var(--grafite);overflow:hidden;margin-top:9px}
.barra i{display:block;height:100%;background:var(--verde)}

.form-linha{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.form-linha .campo{margin:0;flex:1;min-width:118px}
.vazio{text-align:center;color:var(--cinza-fraco);padding:28px 14px;font-size:13px}
.grafico{position:relative;height:250px}
.nota{font-size:12px;color:var(--cinza-fraco);margin-top:9px;line-height:1.6}
footer{border-top:1px solid var(--linha);padding:18px 20px;text-align:center}
footer .rotulo{font-size:10px}
@media(max-width:640px){ .kpi .v{font-size:21px} main{padding:18px 14px 70px} .topo{padding:11px 14px} .abas{padding:0 14px} }
</style>
</head>
<body>

<div id="login">
  <div class="caixa-login">
    <div class="rotulo"><span class="quadrado"></span>Consulting Framework</div>
    <h1>Painel financeiro</h1>
    <p>Entre para ver e lançar os números.</p>
    <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username"></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password"></div>
    <button class="btn" id="btEntrar" style="width:100%;margin-top:8px">Entrar</button>
    <div id="erroLogin" class="erro oculto"></div>
  </div>
</div>

<div id="app" class="oculto">
<header>
  <div class="topo">
    <div class="marca">
      <img id="logoTopo" class="oculto" alt="">
      <span class="quadrado" id="quadTopo"></span>
      <span class="nome" id="nomeNegocio">Painel RHINO</span>
    </div>
    <div class="controles">
      <div class="seg" id="segEscopo">
        <button data-e="tudo" class="on">Tudo</button>
        <button data-e="empresa">Empresa</button>
        <button data-e="pessoal">Pessoal</button>
      </div>
      <select id="selMes" aria-label="Mês"></select>
      <button class="btn-vazio" id="btSair">Sair</button>
    </div>
  </div>
</header>

<nav><div class="abas" id="abas">
  <button data-a="dash" class="on">Dashboard</button>
  <button data-a="receb">Recebíveis</button>
  <button data-a="renov">Renovações</button>
  <button data-a="ment">Mentorados</button>
  <button data-a="lanc">Lançamentos</button>
  <button data-a="fixos">Fixos</button>
  <button data-a="cart">Cartões</button>
  <button data-a="conf">Configurações</button>
</div></nav>

<main>
  <section id="v-dash"></section>
  <section id="v-receb" class="oculto"></section>
  <section id="v-renov" class="oculto"></section>
  <section id="v-ment" class="oculto"></section>
  <section id="v-lanc" class="oculto"></section>
  <section id="v-fixos" class="oculto"></section>
  <section id="v-cart" class="oculto"></section>
  <section id="v-conf" class="oculto"></section>
</main>

<footer><div class="rotulo" id="rodape">Consulting Framework · RHINO</div></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const SUPABASE_URL = 'https://fcwxkelokmqwmivjembv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eo9wQ05w390iA0V13ACSqg_Lihy643Q';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESC = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const HOJE = new Date();
let ESCOPO='tudo', MES=HOJE.getMonth(), ANO=HOJE.getFullYear(), ABA='dash';
let D = { config:{}, produtos:[], mentorados:[], contratos:[], parcelas:[], lancamentos:[], recorrencias:[], cartoes:[], parcelamentos:[], assinaturas:[], metas:[] };
const graficos = {};

/* ---------- utilitários ---------- */
const rs = v => 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const rsc = v => 'R$ ' + Math.round(Number(v)||0).toLocaleString('pt-BR');
const dt = s => { if(!s) return ''; const [a,m,d]=String(s).slice(0,10).split('-'); return `${d}/${m}/${a}`; };
const iso = d => d.toISOString().slice(0,10);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* para nomes usados dentro de onclick: apóstrofo vira \' e não quebra a string */
const escJS = s => String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chave = (a,m) => `${a}-${String(m+1).padStart(2,'0')}`;
const noMes = (s,a,m) => { if(!s) return false; const [y,mm]=String(s).slice(0,10).split('-').map(Number); return y===a && mm===m+1; };
const somaMes = (d,n) => { const x=new Date(d.getFullYear(), d.getMonth()+n, 1); return x; };
const diffMeses = (a,b) => (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
const dObj = s => { const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); };
const prod = id => D.produtos.find(p=>p.id===id);
const nomeProd = id => prod(id)?.nome || '—';
const passaEscopo = e => ESCOPO==='tudo' || e===ESCOPO;
const diasAtraso = venc => Math.floor((HOJE - dObj(venc)) / 86400000);

function toast(msg, erro){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText=`position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:${erro?'#2a0f0f':'#122b06'};border:1px solid ${erro?'#e24b4a':'#44CF17'};color:${erro?'#f5b0b0':'#c7f0b0'};padding:10px 18px;font-size:13px;z-index:99;font-family:var(--mono)`;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

/* ---------- login ---------- */
document.getElementById('btEntrar').onclick = entrar;
document.getElementById('senha').onkeydown = e => { if(e.key==='Enter') entrar(); };
document.getElementById('email').onkeydown = e => { if(e.key==='Enter') document.getElementById('senha').focus(); };

async function entrar(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('senha').value;
  const cx=document.getElementById('erroLogin');
  cx.classList.add('oculto');
  if(!email || !password){ cx.textContent='Preencha e-mail e senha.'; cx.classList.remove('oculto'); return; }
  const {error} = await sb.auth.signInWithPassword({email,password});
  if(error){ cx.textContent = error.message.includes('Invalid') ? 'E-mail ou senha incorretos.' : error.message; cx.classList.remove('oculto'); return; }
  iniciar();
}
document.getElementById('btSair').onclick = async()=>{ await sb.auth.signOut(); location.reload(); };

sb.auth.getSession().then(({data})=>{ if(data.session) iniciar(); });

async function iniciar(){
  document.getElementById('login').classList.add('oculto');
  document.getElementById('app').classList.remove('oculto');
  montarSeletorMes();
  await carregar();
}

/* ---------- carga ---------- */
async function carregar(){
  const [cfg,pr,me,co,pa,la,re,ca,pc,as,mt] = await Promise.all([
    sb.from('config').select('*').eq('id',1).single(),
    sb.from('produtos').select('*').order('ordem'),
    sb.from('mentorados').select('*').order('nome'),
    sb.from('contratos').select('*'),
    sb.from('parcelas').select('*'),
    sb.from('lancamentos').select('*'),
    sb.from('recorrencias').select('*').order('dia'),
    sb.from('cartoes').select('*').order('nome'),
    sb.from('parcelamentos').select('*'),
    sb.from('assinaturas').select('*'),
    sb.from('metas').select('*')
  ]);
  if(cfg.error){ toast('Erro ao carregar. Rode o supabase-schema-v2.sql primeiro.',true); return; }
  D.config=cfg.data||{}; D.produtos=pr.data||[]; D.mentorados=me.data||[]; D.contratos=co.data||[];
  D.parcelas=pa.data||[]; D.lancamentos=la.data||[]; D.recorrencias=re.data||[]; D.cartoes=ca.data||[];
  D.parcelamentos=pc.data||[]; D.assinaturas=as.data||[]; D.metas=mt.data||[];
  aplicarMarca();
  desenhar();
}

function aplicarMarca(){
  const c=D.config;
  if(c.cor_primaria) document.documentElement.style.setProperty('--verde', c.cor_primaria);
  if(c.cor_fundo){ document.documentElement.style.setProperty('--preto', c.cor_fundo); }
  document.getElementById('nomeNegocio').textContent = c.negocio || 'Painel RHINO';
  document.getElementById('rodape').textContent = c.assinatura || 'Consulting Framework · RHINO';
  const img=document.getElementById('logoTopo');
  if(c.logo_url){ img.src=c.logo_url; img.classList.remove('oculto'); document.getElementById('quadTopo').classList.add('oculto'); }
  else { img.classList.add('oculto'); document.getElementById('quadTopo').classList.remove('oculto'); }
}

/* ---------- navegação ---------- */
function montarSeletorMes(){
  const s=document.getElementById('selMes'); s.innerHTML='';
  for(let i=-13;i<=4;i++){
    const d=new Date(HOJE.getFullYear(), HOJE.getMonth()+i, 1);
    const o=document.createElement('option');
    o.value=`${d.getFullYear()}-${d.getMonth()}`;
    o.textContent=`${MESES[d.getMonth()]} ${d.getFullYear()}`;
    if(i===0) o.selected=true;
    s.appendChild(o);
  }
  s.onchange=()=>{ const [a,m]=s.value.split('-').map(Number); ANO=a; MES=m; desenhar(); };
}
document.getElementById('segEscopo').onclick = e => {
  const b=e.target.closest('button'); if(!b) return;
  ESCOPO=b.dataset.e;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===b));
  desenhar();
};
document.getElementById('abas').onclick = e => {
  const b=e.target.closest('button'); if(!b) return;
  ABA=b.dataset.a;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===b));
  ['dash','receb','renov','ment','lanc','fixos','cart','conf'].forEach(k=>
    document.getElementById('v-'+k).classList.toggle('oculto', k!==ABA));
  desenhar();
};
function irPara(a){ document.querySelector(`#abas button[data-a="${a}"]`).click(); window.scrollTo(0,0); }

/* ---------- cálculos ---------- */
function mrrPorProduto(){
  const r={};
  D.contratos.filter(c=>c.status==='ativo').forEach(c=>{
    const m = Math.max(1, c.meses||1);
    r[c.produto_id] = (r[c.produto_id]||0) + Number(c.valor_total)/m;
  });
  return r;
}
function contratoAtivoNoMes(c,a,m){
  const ini=dObj(c.data_inicio), fim=dObj(c.data_fim), ref=new Date(a,m,1), refFim=new Date(a,m+1,0);
  return c.status!=='cancelado' && ini<=refFim && fim>=ref;
}
/* receita reconhecida (competência) */
function competenciaMes(a,m){
  let t=0; const porProd={};
  D.contratos.forEach(c=>{
    if(!contratoAtivoNoMes(c,a,m)) return;
    const v = Number(c.valor_total)/Math.max(1,c.meses||1);
    t+=v; porProd[c.produto_id]=(porProd[c.produto_id]||0)+v;
  });
  D.lancamentos.filter(l=>l.tipo==='entrada' && noMes(l.competencia||l.data,a,m)).forEach(l=>{
    t+=Number(l.valor); porProd[l.produto_id]=(porProd[l.produto_id]||0)+Number(l.valor);
  });
  return {total:t, porProd};
}
/* caixa recebido */
function caixaMes(a,m){
  let t=0; const porProd={};
  D.parcelas.filter(p=>p.pago && noMes(p.data_pagamento||p.vencimento,a,m)).forEach(p=>{
    const c=D.contratos.find(x=>x.id===p.contrato_id); if(!c) return;
    t+=Number(p.valor); porProd[c.produto_id]=(porProd[c.produto_id]||0)+Number(p.valor);
  });
  D.lancamentos.filter(l=>l.tipo==='entrada' && l.pago && noMes(l.data,a,m)).forEach(l=>{
    t+=Number(l.valor); porProd[l.produto_id]=(porProd[l.produto_id]||0)+Number(l.valor);
  });
  return {total:t, porProd};
}
function despesasMes(a,m,escopo){
  return D.lancamentos.filter(l=>l.tipo==='despesa' && noMes(l.data,a,m) && (!escopo||l.escopo===escopo))
    .reduce((s,l)=>s+Number(l.valor),0);
}
function aPagarMes(a,m,escopo){
  return D.lancamentos.filter(l=>l.tipo==='despesa' && !l.pago && noMes(l.data,a,m) && (!escopo||l.escopo===escopo))
    .reduce((s,l)=>s+Number(l.valor),0);
}
/* fatura de cartão projetada por competência */
function faturaMes(a,m,escopo){
  const ref=new Date(a,m,1); let t=0;
  D.parcelamentos.forEach(p=>{
    if(escopo && p.escopo!==escopo) return;
    const ini=dObj(p.primeira_competencia);
    const n=diffMeses(ini,ref);
    if(n>=0 && n < p.total_parcelas) t+=Number(p.valor_parcela);
  });
  D.assinaturas.filter(x=>x.ativo!==false && (!escopo||x.escopo===escopo)).forEach(x=>t+=Number(x.valor));
  return t;
}
function impostoMes(){
  const c=D.config;
  return (Number(c.base_declarada)||0) * (Number(c.aliquota)||0)/100;
}
function parcelasAbertas(){
  return D.parcelas.filter(p=>!p.pago).map(p=>{
    const c=D.contratos.find(x=>x.id===p.contrato_id);
    const me=c?D.mentorados.find(x=>x.id===c.mentorado_id):null;
    return {...p, contrato:c, mentorado:me, atraso:diasAtraso(p.vencimento)};
  }).filter(p=>p.contrato && p.contrato.status!=='cancelado')
    .sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
}
function renovacoes(){
  return D.contratos.filter(c=>c.status==='ativo' || c.status==='concluido').map(c=>{
    const me=D.mentorados.find(x=>x.id===c.mentorado_id);
    const dias=Math.floor((dObj(c.data_fim)-HOJE)/86400000);
    return {...c, mentorado:me, dias};
  }).filter(c=>c.mentorado && c.mentorado.status!=='cancelado' && c.dias<=90 && c.dias>=-180)
    .sort((a,b)=>a.dias-b.dias);
}

function desenhar(){
  if(ABA==='dash') verDash();
  if(ABA==='receb') verRecebiveis();

  if(ABA==='ment') verMentorados();
  if(ABA==='lanc') verLancamentos();
  if(ABA==='fixos') verFixos();
  if(ABA==='cart') verCartoes();

}

      ${kpi('Receita por competência', rsc(cx.total), 'o que foi ganho no mês')}
      ${kpi('Lucro da empresa', rsc(lucro), 'já com imposto e pró-labore', false, lucro>=0?'pos':'neg')}
    </div>
    <div class="grade g4" style="margin-top:12px">
      ${kpi('A receber no mês', rsc(aReceber), `${abertas.filter(p=>noMes(p.vencimento,ANO,MES)).length} parcelas`)}
      ${kpi('Em atraso', rsc(atrasadas.reduce((s,p)=>s+Number(p.valor),0)), `${atrasadas.length} parcelas vencidas`, false, atrasadas.length?'neg':'')}
      ${kpi('Imposto provisionado', rsc(imposto), `${D.config.aliquota}% sobre ${rsc(D.config.base_declarada)}`)}
      ${kpi('Despesa da empresa', rsc(despEmp+fatEmp), 'inclui ferramentas no cartão')}

    <div class="cartao">

        <span class="num" style="font-size:24px">${rsc(ca.total)}</span>
        <span class="rotulo">meta ${rsc(metaMes)} · ${pct.toFixed(0)}%</span>
      </div>
      <div class="barra"><i style="width:${pct}%"></i></div>
    </div>

    <div class="cartao"><div class="grafico"><canvas id="gFluxo" role="img" aria-label="Comparação mensal entre caixa recebido e receita por competência"></canvas></div></div>

    <h2><span class="quadrado"></span>Receita por produto · competência</h2>
    <div class="cartao"><div class="grafico"><canvas id="gProd" role="img" aria-label="Receita do mês distribuída por produto"></canvas></div></div>`;
  }

    <div class="grade g4">

      ${kpi('Despesa pessoal', rsc(despPes), 'fora do cartão')}
      ${kpi('Fatura de cartão', rsc(fatPes), 'projetada para o mês')}

function kpi(t,v,s,destaque,cor){
  return `<div class="kpi${destaque?' destaque':''}"><div class="t">${t}</div><div class="v ${cor||''}">${v}</div><div class="s">${s||''}</div></div>`;
}

function montarAlertas(){
  const av=[];
  const abertas=parcelasAbertas();
  const atr=abertas.filter(p=>p.atraso>0);
  if(atr.length){
    const v=atr.reduce((s,p)=>s+Number(p.valor),0);
    av.push(['r',`<strong>${atr.length} parcelas em atraso</strong>, somando ${rs(v)}. A mais antiga está há ${Math.max(...atr.map(p=>p.atraso))} dias vencida.`]);
  }
  const ren=renovacoes();
  const venc=ren.filter(c=>c.dias<0);
  const prox=ren.filter(c=>c.dias>=0 && c.dias<=30);
  if(venc.length) av.push(['r',`<strong>${venc.length} contratos já venceram</strong> e continuam marcados como ativos. Renovar ou dar baixa.`]);
  if(prox.length) av.push(['a',`<strong>${prox.length} contratos vencem em até 30 dias</strong>, somando ${rs(prox.reduce((s,c)=>s+Number(c.valor_total)/Math.max(1,c.meses),0))} de MRR em risco.`]);

  // recarga de parcelamento
  const novos=D.parcelamentos.filter(p=>noMes(p.primeira_competencia,ANO,MES));
  if(novos.length){
    const v=novos.reduce((s,p)=>s+Number(p.valor_parcela),0);
    const comp=novos.reduce((s,p)=>s+Number(p.valor_parcela)*p.total_parcelas,0);
    av.push(['r',`<strong>Recarga de parcelamento:</strong> ${novos.length} compras novas parceladas neste mês, ${rs(v)} por mês e ${rs(comp)} de compromisso futuro criado.`]);
  } else {
    av.push(['v',`<strong>Nenhum parcelamento novo neste mês.</strong> É assim que a fatura cai sozinha.`]);
  }

  // repasse trimestral
  const meses=(D.config.repasse_meses||'1,4,7,10').split(',').map(x=>Number(x.trim())-1);
  if(meses.includes(MES)) av.push(['a',`<strong>Mês de repasse da sociedade.</strong> Calcular o resultado do trimestre e acertar com o Jefferson.`]);

  // runway
  const custoFixo = D.recorrencias.filter(r=>r.ativo!==false && r.tipo==='despesa' && r.escopo==='empresa').reduce((s,r)=>s+Number(r.valor),0) + faturaMes(ANO,MES,'empresa') + impostoMes();
  const caixa=Number(D.config.saldo_caixa)||0;
  if(caixa>0 && custoFixo>0){
    const meses_=caixa/custoFixo;
    if(meses_<3) av.push(['a',`<strong>Reserva de ${meses_.toFixed(1)} mês(es) de operação.</strong> O alvo definido é ${rs(D.config.reserva_alvo)}.`]);
  } else if(!caixa){
    av.push(['a',`Saldo de caixa não informado. Preencha em Configurações para acompanhar a reserva.`]);
  }

  const sem=D.mentorados.filter(m=>m.status==='ativo' && m.calls_contratadas>0 && m.calls_feitas<m.calls_contratadas).length;
  if(sem) av.push(['a',`<strong>${sem} mentorados com calls pendentes</strong> dentro do contrato.`]);

  return av.length ? av.map(([t,x])=>`<div class="alerta ${t}"><div>${x}</div></div>`).join('') : `<div class="vazio">Nada exigindo atenção neste mês.</div>`;
}

function graficoFluxo(){
  const labels=[], caixa=[], comp=[];
  for(let i=-5;i<=0;i++){
    const d=new Date(ANO,MES+i,1);
    labels.push(`${MESC[d.getMonth()]}/${String(d.getFullYear()).slice(2)}`);
    caixa.push(caixaMes(d.getFullYear(),d.getMonth()).total);
    comp.push(competenciaMes(d.getFullYear(),d.getMonth()).total);
  }
  desenhaGrafico('gFluxo','bar',{labels,datasets:[
    {label:'Caixa',data:caixa,backgroundColor:D.config.cor_primaria||'#44CF17',borderRadius:3,maxBarThickness:24},
    {label:'Competência',data:comp,type:'line',borderColor:'#8a8d8f',borderWidth:2,borderDash:[5,4],pointRadius:4,pointBackgroundColor:'#8a8d8f',fill:false}
  ]});
}
function graficoProduto(porProd){
  const ids=Object.keys(porProd).filter(k=>porProd[k]>0);
  if(!ids.length){ document.getElementById('gProd').closest('.cartao').innerHTML='<div class="vazio">Sem receita reconhecida neste mês.</div>'; return; }
  desenhaGrafico('gProd','doughnut',{
    labels: ids.map(i=>nomeProd(i)),
    datasets:[{data: ids.map(i=>porProd[i]), backgroundColor: ids.map(i=>prod(i)?.cor||'#44CF17'), borderColor:'#0d0d0d', borderWidth:2}]
  }, true);
}
function desenhaGrafico(id,tipo,data,legenda){
  const el=document.getElementById(id); if(!el) return;
  if(graficos[id]) graficos[id].destroy();
  graficos[id]=new Chart(el,{type:tipo,data,options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:!!legenda,position:'bottom',labels:{color:'#8a8d8f',font:{family:'Courier New',size:11},boxWidth:10,padding:14}},
      tooltip:{callbacks:{label:c=>` ${c.dataset.label||c.label}: ${rsc(c.parsed.y ?? c.parsed)}`}}},
    scales: tipo==='doughnut' ? {} : {
      x:{grid:{display:false},ticks:{color:'#8a8d8f',font:{family:'Courier New',size:11}}},
      y:{beginAtZero:true,grid:{color:'#1c1c1c'},ticks:{color:'#8a8d8f',font:{family:'Courier New',size:11},callback:v=>'R$ '+Math.round(v/1000)+'k'}}
    }
  }});
}

/* ---------- recebíveis ---------- */
function verRecebiveis(){
  const ab=parcelasAbertas();
  const faixa = (min,max) => ab.filter(p=> p.atraso>=min && (max===null || p.atraso<=max));
  const aVencer=ab.filter(p=>p.atraso<=0);
  const f1=faixa(1,30), f2=faixa(31,60), f3=faixa(61,null);
  const soma=a=>a.reduce((s,p)=>s+Number(p.valor),0);

  let h=`<h2><span class="quadrado"></span>Recebíveis em aberto</h2>
  <div class="grade g4">
    ${kpi('A vencer', rsc(soma(aVencer)), `${aVencer.length} parcelas`)}
    ${kpi('1 a 30 dias', rsc(soma(f1)), `${f1.length} parcelas`, false, f1.length?'aviso':'')}
    ${kpi('31 a 60 dias', rsc(soma(f2)), `${f2.length} parcelas`, false, f2.length?'aviso':'')}
    ${kpi('Mais de 60 dias', rsc(soma(f3)), `${f3.length} parcelas`, false, f3.length?'neg':'')}
  </div>
  <h2><span class="quadrado"></span>Detalhe</h2>`;

  if(!ab.length){ h+=`<div class="vazio">Nenhuma parcela em aberto. Tudo recebido.</div>`; document.getElementById('v-receb').innerHTML=h; return; }

  h+=`<div class="cartao rolagem"><table><thead><tr>
    <th>Mentorado</th><th>Produto</th><th>Parcela</th><th>Vencimento</th><th>Situação</th><th class="d">Valor</th><th></th>
  </tr></thead><tbody>`;
  ab.forEach(p=>{
    const tag = p.atraso>60 ? '<span class="tag mal">60+ dias</span>' :
                p.atraso>30 ? '<span class="tag mal">31-60 dias</span>' :
                p.atraso>0  ? `<span class="tag av">${p.atraso} dias</span>` :
                              '<span class="tag">a vencer</span>';
    h+=`<tr>
      <td>${esc(p.mentorado?.nome||'—')}</td>
      <td class="rotulo" style="font-size:10px">${esc(nomeProd(p.contrato.produto_id))}</td>
      <td class="num">${p.numero}/${p.contrato.meses}</td>
      <td class="num">${dt(p.vencimento)}</td>
      <td>${tag}</td>
      <td class="d">${rs(p.valor)}</td>
      <td><button class="btn-vazio" style="padding:3px 9px;font-size:11px" onclick="baixarParcela('${p.id}')">Baixar</button></td>
    </tr>`;
  });
  h+=`</tbody></table></div>
  <p class="nota">Baixar marca a parcela como recebida na data de hoje e ela entra no caixa do mês.</p>`;
  document.getElementById('v-receb').innerHTML=h;
}
async function baixarParcela(id){
  const {error}=await sb.from('parcelas').update({pago:true,data_pagamento:iso(HOJE)}).eq('id',id);
  if(error) return toast('Não foi possível baixar: '+error.message,true);
  const p=D.parcelas.find(x=>x.id===id); if(p){p.pago=true;p.data_pagamento=iso(HOJE);}
  toast('Parcela baixada.'); desenhar();
}

async function marcarContrato(id,status){
  const {error}=await sb.from('contratos').update({status}).eq('id',id);
  if(error) return toast('Não foi possível salvar: '+error.message,true);
  const c=D.contratos.find(x=>x.id===id); if(c) c.status=status;
  if(status==='cancelado'){
    const m=D.mentorados.find(x=>x.id===c.mentorado_id);
    if(m){ await sb.from('mentorados').update({status:'cancelado'}).eq('id',m.id); m.status='cancelado'; }
  }
  toast(status==='renovado'?'Contrato marcado como renovado.':'Contrato encerrado.');
  desenhar();
}

async function novoMentorado(){
  const nome=document.getElementById('mNome').value.trim();
  const produto_id=document.getElementById('mProd').value;
  const instagram=document.getElementById('mIg').value.trim()||null;
  const valor=Number(document.getElementById('mValor').value)||0;
  const meses=Math.max(1,Number(document.getElementById('mMeses').value)||1);
  const ini=document.getElementById('mIni').value;
  const calls=Number(document.getElementById('mCalls').value)||0;
  if(!nome) return toast('Informe o nome do mentorado.',true);
  if(!valor) return toast('Informe o valor do contrato.',true);
  if(!ini) return toast('Informe a data de início.',true);

  const {data:m,error:e1}=await sb.from('mentorados')
    .insert({nome,produto_id,instagram,calls_contratadas:calls}).select().single();
  if(e1) return toast('Erro ao salvar: '+e1.message,true);

  const di=dObj(ini), df=new Date(di.getFullYear(), di.getMonth()+meses, di.getDate());
  const {data:c,error:e2}=await sb.from('contratos')
    .insert({mentorado_id:m.id,produto_id,valor_total:valor,meses,data_inicio:ini,data_fim:iso(df)}).select().single();
  if(e2) return toast('Erro no contrato: '+e2.message,true);

  const parcelas=[];
  for(let i=0;i<meses;i++){
    const v=new Date(di.getFullYear(), di.getMonth()+i, di.getDate());
    parcelas.push({contrato_id:c.id,numero:i+1,valor:+(valor/meses).toFixed(2),vencimento:iso(v),pago:false});
  }
  const {data:ps}=await sb.from('parcelas').insert(parcelas).select();
  D.mentorados.push(m); D.contratos.push(c); D.parcelas.push(...(ps||[]));
  ['mNome','mIg','mValor'].forEach(i=>document.getElementById(i).value='');
  toast(`${nome} adicionado com ${meses} parcelas.`);
  desenhar();
}

/* ---------- lançamentos ---------- */
function verLancamentos(){
  const lst=D.lancamentos.filter(l=>noMes(l.data,ANO,MES) && passaEscopo(l.escopo))
    .sort((a,b)=>b.data.localeCompare(a.data));
  const ent=lst.filter(l=>l.tipo==='entrada').reduce((s,l)=>s+Number(l.valor),0);
  const des=lst.filter(l=>l.tipo==='despesa').reduce((s,l)=>s+Number(l.valor),0);

  let h=`<h2><span class="quadrado"></span>Novo lançamento</h2>
  <div class="cartao"><div class="form-linha">
    <div class="campo"><label>Data</label><input id="lData" type="date" value="${iso(HOJE)}"></div>
    <div class="campo"><label>Tipo</label><select id="lTipo"><option value="despesa">Despesa</option><option value="entrada">Entrada</option></select></div>
    <div class="campo"><label>Categoria</label><input id="lCat" placeholder="Ferramentas"></div>
    <div class="campo"><label>Descrição</label><input id="lDesc"></div>
    <div class="campo"><label>Escopo</label><select id="lEsc"><option value="empresa">Empresa</option><option value="pessoal">Pessoal</option></select></div>
    <div class="campo"><label>Produto</label><select id="lProd"><option value="">—</option>${D.produtos.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>
    <div class="campo"><label>Valor</label><input id="lValor" type="number" step="0.01"></div>
    <div class="campo"><label>Pago</label><select id="lPago"><option value="true">Sim</option><option value="false">Não</option></select></div>
    <button class="btn" onclick="novoLancamento()">Adicionar</button>
  </div></div>

  <h2><span class="quadrado"></span>${MESES[MES]} ${ANO} · entradas ${rsc(ent)} · saídas ${rsc(des)}</h2>`;
  if(!lst.length){ h+=`<div class="vazio">Nenhum lançamento neste mês e escopo.</div>`; document.getElementById('v-lanc').innerHTML=h; return; }

  h+=`<div class="cartao rolagem"><table><thead><tr>
    <th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Produto</th><th>Escopo</th><th>Situação</th><th class="d">Valor</th><th></th>
  </tr></thead><tbody>`;
  lst.forEach(l=>{
    h+=`<tr>
      <td class="num">${dt(l.data)}</td>
      <td>${l.tipo==='entrada'?'<span class="tag ok">entrada</span>':'<span class="tag">saída</span>'}</td>
      <td>${esc(l.categoria)}</td>
      <td>${esc(l.descricao||'')}</td>
      <td class="rotulo" style="font-size:10px">${l.produto_id?esc(nomeProd(l.produto_id)):'—'}</td>
      <td class="rotulo" style="font-size:10px">${l.escopo}</td>
      <td><button class="tag ${l.pago?'ok':'av'}" style="cursor:pointer" onclick="alternarPago('${l.id}',${!l.pago})">${l.pago?'pago':'a pagar'}</button></td>
      <td class="d ${l.tipo==='entrada'?'pos':''}">${l.tipo==='entrada'?'+':'−'}${rs(l.valor)}</td>
      <td><button class="x" onclick="remover('lancamentos','${l.id}','este lançamento')" aria-label="Remover">✕</button></td>
    </tr>`;
  });
  h+=`</tbody></table></div>`;
  document.getElementById('v-lanc').innerHTML=h;
}
async function novoLancamento(){
  const r={
    data:document.getElementById('lData').value,
    competencia:document.getElementById('lData').value,
    tipo:document.getElementById('lTipo').value,
    categoria:document.getElementById('lCat').value.trim(),
    descricao:document.getElementById('lDesc').value.trim()||null,
    escopo:document.getElementById('lEsc').value,
    produto_id:document.getElementById('lProd').value||null,
    valor:Number(document.getElementById('lValor').value)||0,
    pago:document.getElementById('lPago').value==='true'
  };
  if(!r.data) return toast('Informe a data.',true);
  if(!r.categoria) return toast('Informe a categoria.',true);
  if(!r.valor) return toast('Informe o valor.',true);
  const {data,error}=await sb.from('lancamentos').insert(r).select().single();
  if(error) return toast('Erro ao salvar: '+error.message,true);
  D.lancamentos.push(data);
  ['lCat','lDesc','lValor'].forEach(i=>document.getElementById(i).value='');
  toast('Lançamento adicionado.'); desenhar();
}
async function alternarPago(id,valor){
  const {error}=await sb.from('lancamentos').update({pago:valor}).eq('id',id);
  if(error) return toast('Erro: '+error.message,true);
  const l=D.lancamentos.find(x=>x.id===id); if(l) l.pago=valor;
  desenhar();
}

/* ---------- fixos ---------- */
function verFixos(){
  const lst=D.recorrencias.filter(r=>passaEscopo(r.escopo));
  const jaGerados=new Set(D.lancamentos.filter(l=>noMes(l.data,ANO,MES) && l.recorrencia_id).map(l=>l.recorrencia_id));
  const pend=lst.filter(r=>r.ativo!==false && !jaGerados.has(r.id));
  const totalPend=pend.reduce((s,r)=>s+Number(r.valor),0);

  let h=`<h2><span class="quadrado"></span>Fixos de ${MESES[MES]}</h2>`;
  if(pend.length) h+=`<div class="linha-fina" style="margin-bottom:12px">
    <span><strong>${pend.length} fixos ainda não lançados</strong> em ${MESES[MES]}, somando ${rs(totalPend)}.</span>
    <button class="btn" onclick="gerarFixos()">Gerar lançamentos do mês</button>
  </div>`;
  else h+=`<div class="linha-fina" style="margin-bottom:12px"><span>Todos os fixos de ${MESES[MES]} já foram lançados.</span></div>`;

  h+=`<div class="cartao"><div class="form-linha">
    <div class="campo"><label>Descrição</label><input id="fDesc"></div>
    <div class="campo"><label>Categoria</label><input id="fCat"></div>
    <div class="campo"><label>Valor</label><input id="fValor" type="number" step="0.01"></div>
    <div class="campo"><label>Dia</label><input id="fDia" type="number" value="5" min="1" max="28"></div>
    <div class="campo"><label>Escopo</label><select id="fEsc"><option value="empresa">Empresa</option><option value="pessoal">Pessoal</option></select></div>
    <div class="campo"><label>Produto</label><select id="fProd"><option value="">—</option>${D.produtos.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>
    <button class="btn" onclick="novoFixo()">Adicionar fixo</button>
  </div></div>

  <h2><span class="quadrado"></span>Cadastrados</h2>
  <div class="cartao rolagem"><table><thead><tr>
    <th>Descrição</th><th>Categoria</th><th>Produto</th><th>Escopo</th><th>Dia</th><th class="d">Valor</th><th>Este mês</th><th></th>
  </tr></thead><tbody>`;
  lst.forEach(r=>{
    h+=`<tr>
      <td>${esc(r.descricao)}</td>
      <td>${esc(r.categoria)}</td>
      <td class="rotulo" style="font-size:10px">${r.produto_id?esc(nomeProd(r.produto_id)):'—'}</td>
      <td class="rotulo" style="font-size:10px">${r.escopo}</td>
      <td class="num">${r.dia}</td>
      <td class="d">${rs(r.valor)}</td>
      <td>${jaGerados.has(r.id)?'<span class="tag ok">lançado</span>':'<span class="tag av">pendente</span>'}</td>
      <td><button class="x" onclick="remover('recorrencias','${r.id}','${escJS(r.descricao)}')" aria-label="Remover">✕</button></td>
    </tr>`;
  });
  h+=`</tbody></table></div>`;
  document.getElementById('v-fixos').innerHTML=h;
}
async function novoFixo(){
  const r={
    descricao:document.getElementById('fDesc').value.trim(),
    categoria:document.getElementById('fCat').value.trim(),
    valor:Number(document.getElementById('fValor').value)||0,
    dia:Number(document.getElementById('fDia').value)||5,
    escopo:document.getElementById('fEsc').value,
    produto_id:document.getElementById('fProd').value||null,
    tipo:'despesa'
  };
  if(!r.descricao) return toast('Informe a descrição.',true);
  if(!r.valor) return toast('Informe o valor.',true);
  const {data,error}=await sb.from('recorrencias').insert(r).select().single();
  if(error) return toast('Erro: '+error.message,true);
  D.recorrencias.push(data);
  ['fDesc','fCat','fValor'].forEach(i=>document.getElementById(i).value='');
  toast('Fixo cadastrado.'); desenhar();
}
async function gerarFixos(){
  const jaGerados=new Set(D.lancamentos.filter(l=>noMes(l.data,ANO,MES) && l.recorrencia_id).map(l=>l.recorrencia_id));
  const pend=D.recorrencias.filter(r=>r.ativo!==false && !jaGerados.has(r.id));
  if(!pend.length) return toast('Nada pendente para gerar.');
  const novos=pend.map(r=>({
    data: iso(new Date(ANO,MES,Math.min(r.dia,28))),
    competencia: iso(new Date(ANO,MES,1)),
    tipo:r.tipo, categoria:r.categoria, descricao:r.descricao,
    valor:r.valor, escopo:r.escopo, produto_id:r.produto_id, pago:false, recorrencia_id:r.id
  }));
  const {data,error}=await sb.from('lancamentos').insert(novos).select();
  if(error) return toast('Erro ao gerar: '+error.message,true);
  D.lancamentos.push(...data);
  toast(`${data.length} fixos lançados em ${MESES[MES]}.`); desenhar();
}

/* ---------- cartões ---------- */
function verCartoes(){
  const ref=new Date(ANO,MES,1);
  const ativos=D.parcelamentos.map(p=>{
    const ini=dObj(p.primeira_competencia);
    const n=diffMeses(ini,ref)+1;
    const fim=new Date(ini.getFullYear(), ini.getMonth()+p.total_parcelas-1, 1);
    return {...p, atual:n, fim, viva: n>=1 && n<=p.total_parcelas};
  });
  const vivos=ativos.filter(p=>p.viva && passaEscopo(p.escopo));
  const totalParcela=vivos.reduce((s,p)=>s+Number(p.valor_parcela),0);
  const compromisso=vivos.reduce((s,p)=>s+Number(p.valor_parcela)*(p.total_parcelas-p.atual+1),0);
  const assin=D.assinaturas.filter(a=>a.ativo!==false && passaEscopo(a.escopo));
  const totalAssin=assin.reduce((s,a)=>s+Number(a.valor),0);

  // data de liberdade
  const fins=ativos.filter(p=>passaEscopo(p.escopo)).map(p=>p.fim).sort((a,b)=>a-b);
  const liberdade=fins.length?fins[fins.length-1]:null;

  const novos=D.parcelamentos.filter(p=>noMes(p.primeira_competencia,ANO,MES) && passaEscopo(p.escopo));
  const compNovo=novos.reduce((s,p)=>s+Number(p.valor_parcela)*p.total_parcelas,0);

  let h=`<h2><span class="quadrado"></span>Cartões · ${MESES[MES]} ${ANO}</h2>
  <div class="grade g4">
    ${kpi('Fatura projetada', rsc(totalParcela+totalAssin), `${vivos.length} parcelamentos + ${assin.length} assinaturas`, true)}
    ${kpi('Só parcelas', rsc(totalParcela), totalParcela+totalAssin>0?`${Math.round(totalParcela/(totalParcela+totalAssin)*100)}% da fatura`:'—')}
    ${kpi('Dívida restante', rsc(compromisso), 'tudo que ainda falta pagar')}
    ${kpi('Livre de parcelas em', liberdade?`${MESC[liberdade.getMonth()]}/${String(liberdade.getFullYear()).slice(2)}`:'—', 'se não parcelar mais nada')}
  </div>`;

  if(novos.length){
    h+=`<div class="alerta r" style="margin-top:12px"><div><strong>Recarga neste mês:</strong> ${novos.length} compras novas parceladas, criando ${rs(compNovo)} de compromisso futuro. Cada uma dessas adia a data de liberdade.</div></div>`;
  } else {
    h+=`<div class="alerta v" style="margin-top:12px"><div><strong>Zero parcelamento novo neste mês.</strong> Mantendo assim, a fatura cai sozinha até a data acima.</div></div>`;
  }

  h+=`<h2><span class="quadrado"></span>Projeção dos próximos 12 meses</h2>
  <div class="cartao"><div class="grafico"><canvas id="gCartao" role="img" aria-label="Projeção da fatura de cartão nos próximos 12 meses"></canvas></div></div>

  <h2><span class="quadrado"></span>Parcelamentos em aberto</h2>`;

  if(!vivos.length){ h+=`<div class="vazio">Nenhum parcelamento em aberto neste escopo.</div>`; }
  else {
    h+=`<div class="cartao rolagem"><table><thead><tr>
      <th>Compra</th><th>Cartão</th><th>Categoria</th><th>Parcela</th><th>Quita em</th><th class="d">Por mês</th><th class="d">Falta</th><th></th>
    </tr></thead><tbody>`;
    vivos.sort((a,b)=>Number(b.valor_parcela)-Number(a.valor_parcela)).forEach(p=>{
      const cartao=D.cartoes.find(c=>c.id===p.cartao_id);
      const falta=Number(p.valor_parcela)*(p.total_parcelas-p.atual+1);
      h+=`<tr>
        <td>${esc(p.descricao)}</td>
        <td class="rotulo" style="font-size:10px">${esc(cartao?.nome||'—')}</td>
        <td class="rotulo" style="font-size:10px">${esc(p.categoria||'—')}</td>
        <td class="num">${p.atual}/${p.total_parcelas}</td>
        <td class="num">${MESC[p.fim.getMonth()]}/${String(p.fim.getFullYear()).slice(2)}</td>
        <td class="d">${rs(p.valor_parcela)}</td>
        <td class="d">${rs(falta)}</td>
        <td><button class="x" onclick="remover('parcelamentos','${p.id}','${escJS(p.descricao)}')" aria-label="Remover">✕</button></td>
      </tr>`;
    });
    h+=`</tbody></table></div>`;
  }

  h+=`<h2><span class="quadrado"></span>Novo parcelamento</h2>
  <div class="cartao"><div class="form-linha">
    <div class="campo"><label>Cartão</label><select id="pCartao">${D.cartoes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
    <div class="campo"><label>Descrição</label><input id="pDesc"></div>
    <div class="campo"><label>Categoria</label><input id="pCat" placeholder="Compras"></div>
    <div class="campo"><label>Valor da parcela</label><input id="pValor" type="number" step="0.01"></div>
    <div class="campo"><label>Total de parcelas</label><input id="pTotal" type="number" value="10"></div>
    <div class="campo"><label>1ª parcela em</label><input id="pIni" type="month" value="${chave(ANO,MES)}"></div>
    <div class="campo"><label>Escopo</label><select id="pEsc"><option value="pessoal">Pessoal</option><option value="empresa">Empresa</option></select></div>
    <button class="btn" onclick="novoParcelamento()">Adicionar</button>
  </div></div>

  <h2><span class="quadrado"></span>Assinaturas · ${rsc(totalAssin)} por mês</h2>`;
  if(!assin.length){ h+=`<div class="vazio">Nenhuma assinatura cadastrada.</div>`; }
  else {
    h+=`<div class="cartao rolagem"><table><thead><tr>
      <th>Assinatura</th><th>Cartão</th><th>Escopo</th><th>Produto</th><th class="d">Mensal</th><th class="d">Ano</th><th></th>
    </tr></thead><tbody>`;
    assin.sort((a,b)=>Number(b.valor)-Number(a.valor)).forEach(a=>{
      const cartao=D.cartoes.find(c=>c.id===a.cartao_id);
      h+=`<tr>
        <td>${esc(a.descricao)}</td>
        <td class="rotulo" style="font-size:10px">${esc(cartao?.nome||'—')}</td>
        <td class="rotulo" style="font-size:10px">${a.escopo}</td>
        <td class="rotulo" style="font-size:10px">${a.produto_id?esc(nomeProd(a.produto_id)):'—'}</td>
        <td class="d">${rs(a.valor)}</td>
        <td class="d">${rsc(Number(a.valor)*12)}</td>
        <td><button class="x" onclick="remover('assinaturas','${a.id}','${escJS(a.descricao)}')" aria-label="Remover">✕</button></td>
      </tr>`;
    });
    h+=`</tbody></table></div>
    <p class="nota">Revise esta lista uma vez por trimestre. É onde assinatura esquecida se acumula.</p>`;
  }

  document.getElementById('v-cart').innerHTML=h;
  graficoCartao();
}
function graficoCartao(){
  const labels=[], parc=[], assinat=[];
  const totalAssin=D.assinaturas.filter(a=>a.ativo!==false && passaEscopo(a.escopo)).reduce((s,a)=>s+Number(a.valor),0);
  for(let i=0;i<12;i++){
    const d=new Date(ANO,MES+i,1);
    labels.push(`${MESC[d.getMonth()]}/${String(d.getFullYear()).slice(2)}`);
    let t=0;
    D.parcelamentos.forEach(p=>{
      if(!passaEscopo(p.escopo)) return;
      const n=diffMeses(dObj(p.primeira_competencia), d);
      if(n>=0 && n<p.total_parcelas) t+=Number(p.valor_parcela);
    });
    parc.push(t); assinat.push(totalAssin);
  }
  const el=document.getElementById('gCartao'); if(!el) return;
  if(graficos.gCartao) graficos.gCartao.destroy();
  graficos.gCartao=new Chart(el,{type:'bar',data:{labels,datasets:[
    {label:'Parcelas',data:parc,backgroundColor:D.config.cor_primaria||'#44CF17',borderRadius:3,maxBarThickness:26},
    {label:'Assinaturas',data:assinat,backgroundColor:'#4a4a4a',borderRadius:3,maxBarThickness:26}
  ]},options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:true,position:'bottom',labels:{color:'#8a8d8f',font:{family:'Courier New',size:11},boxWidth:10,padding:14}},
      tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${rsc(c.parsed.y)}`}}},
    scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#8a8d8f',font:{family:'Courier New',size:10},autoSkip:false,maxRotation:45}},
      y:{stacked:true,beginAtZero:true,grid:{color:'#1c1c1c'},ticks:{color:'#8a8d8f',font:{family:'Courier New',size:11},callback:v=>'R$ '+Math.round(v/1000)+'k'}}}
  }});
}
async function novoParcelamento(){
  const mes=document.getElementById('pIni').value;
  const r={
    cartao_id:document.getElementById('pCartao').value,
    descricao:document.getElementById('pDesc').value.trim(),
    categoria:document.getElementById('pCat').value.trim()||'Outros',
    valor_parcela:Number(document.getElementById('pValor').value)||0,
    total_parcelas:Math.max(1,Number(document.getElementById('pTotal').value)||1),
    primeira_competencia: mes ? mes+'-01' : null,
    escopo:document.getElementById('pEsc').value
  };
  if(!r.descricao) return toast('Informe a descrição da compra.',true);
  if(!r.valor_parcela) return toast('Informe o valor da parcela.',true);
  if(!r.primeira_competencia) return toast('Informe o mês da primeira parcela.',true);
  const {data,error}=await sb.from('parcelamentos').insert(r).select().single();
  if(error) return toast('Erro: '+error.message,true);
  D.parcelamentos.push(data);
  ['pDesc','pCat','pValor'].forEach(i=>document.getElementById(i).value='');
  toast('Parcelamento cadastrado.'); desenhar();
}

}
async function salvarConfig(){
  const r={
    negocio:document.getElementById('cNome').value.trim()||'Painel RHINO',
    razao_social:document.getElementById('cRazao').value.trim(),
    logo_url:document.getElementById('cLogo').value.trim()||null,
    cor_primaria:document.getElementById('cCor').value,
    cor_fundo:document.getElementById('cFundo').value,
    assinatura:document.getElementById('cAssin').value.trim(),
    prolabore:Number(document.getElementById('cProl').value)||0,
    aliquota:Number(document.getElementById('cAliq').value)||0,
    base_declarada:Number(document.getElementById('cBase').value)||0,
    meta_mensal:Number(document.getElementById('cMeta').value)||0,
    saldo_caixa:Number(document.getElementById('cCaixa').value)||0,
    reserva_alvo:Number(document.getElementById('cReserva').value)||0,
    repasse_meses:document.getElementById('cRepasse').value.trim()||'1,4,7,10'
  };
  const {error}=await sb.from('config').update(r).eq('id',1);
  if(error) return toast('Erro ao salvar: '+error.message,true);
  D.config={...D.config,...r};
  aplicarMarca(); toast('Configurações salvas.'); desenhar();
}

/* ---------- genéricos ---------- */
async function salvarCampo(tabela,id,campo,valor){
  const {error}=await sb.from(tabela).update({[campo]:valor}).eq('id',id);
  if(error) return toast('Erro ao salvar: '+error.message,true);
  const item=D[tabela]?.find(x=>x.id===id); if(item) item[campo]=valor;
  toast('Salvo.');
}
async function remover(tabela,id,rotulo){
  if(!confirm(`Remover ${rotulo}? Isso não pode ser desfeito.`)) return;
  const {error}=await sb.from(tabela).delete().eq('id',id);
  if(error) return toast('Erro ao remover: '+error.message,true);
  D[tabela]=D[tabela].filter(x=>x.id!==id);
  if(tabela==='mentorados'){
    D.contratos=D.contratos.filter(c=>c.mentorado_id!==id);
  }
  toast('Removido.'); desenhar();
}
