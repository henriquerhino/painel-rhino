<script>
const SUPABASE_URL='https://fcwxkelokmqwmivjembv.supabase.co';
const SUPABASE_KEY='sb_publishable_eo9wQ05w390iA0V13ACSqg_Lihy643Q';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const CORES=['#44CF17','#4E9AE8','#7F77DD','#F5A623','#f0605f','#1baf7a','#D4537E','#8a8d8f','#eb6834','#4a3aa7','#c9a227','#2fb2c9'];

let IA={estado:'ocioso',itens:[],erro:''}, HIST_ABERTO=null, DESP_ABERTO=null, CART_ABERTO=null, PRINTS=[], LIDAS=[];
const G={};

const rs=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const rsc=v=>'R$ '+Math.round(Number(v)||0).toLocaleString('pt-BR');
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(m,e){const t=document.createElement('div');t.textContent=m;
t.style.cssText=`position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:${e?'#2e1010':'#123006'};border:1px solid ${e?'#f0605f':'#44CF17'};color:${e?'#ffc4c4':'#c7f0b0'};padding:11px 20px;font-size:13.5px;z-index:99;max-width:90vw`;
document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}

/* ================= LEITURA DA PLANILHA ================= */
function csvParse(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r')f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
/* "R$ 16.375,48" -> 16375.48 · "-R$ 5.308,55" -> -5308.55 · " R$ - " -> 0 · "cancelado" -> 0 */
function brl(s){
  if(s==null)return 0;let t=String(s).trim();if(!t)return 0;
  const neg=t.startsWith('-');
  t=t.replace(/R\$/g,'').replace(/\s/g,'');
  if(/[a-zA-Z]/.test(t))return 0;
  const m=t.replace(/[^\d,.-]/g,'');
  if(!m||/^[-.,]+$/.test(m))return 0;
  const v=parseFloat(m.replace(/\./g,'').replace(',','.'));
  if(isNaN(v))return 0;
  return neg?-Math.abs(v):Math.abs(v);
}
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const idx=(rows,pref,de=0)=>{const p=norm(pref);for(let i=de;i<rows.length;i++)if(norm(rows[i][0]).startsWith(p))return i;return -1;};
const lin=(rows,pref,de=0)=>{const i=idx(rows,pref,de);return i<0?null:rows[i].slice(1,13).map(brl);};
const vazio12=()=>Array(12).fill(0);

function interpretar(a1,a2,cores1){
  // FATURAMENTO: a linha TOTAL do bloco RECEITAS da aba 1 e a unica fonte.
  // As linhas por produto so abrem o total. A aba 2 entra apenas no previsto (a receber).
  const iR=idx(a1,'receitas');
  const consultoria=lin(a1,'recebimento consultoria')||vazio12();
  const mentoria=lin(a1,'recebimento mentoria')||vazio12();
  const framework=lin(a1,'recebimento framework')||vazio12();
  const total=lin(a1,'total',iR+1)||consultoria.map((v,i)=>v+mentoria[i]+framework[i]);
  const iM=idx(a2,'mentoria rhino'), iF=idx(a2,'mentoria framework');
  const a2m={total:iM>=0?(lin(a2,'total',iM)||vazio12()):vazio12()};
  const a2f={total:iF>=0?(lin(a2,'total',iF)||vazio12()):vazio12()};
  const divergencia=total.map((t,i)=>Math.abs(t-(consultoria[i]+mentoria[i]+framework[i]))>1);

  // despesas: blocos entre "DESPESAS" e "TOTAL DAS DESPESAS"
  const iD=idx(a1,'despesas'), iT=idx(a1,'total das despesas');
  const blocos=[];let bloco=null;
  for(let i=iD+1;i<iT;i++){
    const row=a1[i], label=String(row[0]||'').trim();
    const nums=row.slice(1,13).map(brl);
    const temValor=row.slice(1,13).some(c=>/\d/.test(String(c||'')));
    if(/^total$/i.test(label)){if(bloco){bloco.total=nums;blocos.push(bloco);bloco=null;}continue;}
    if(!label)continue;
    if(!temValor){bloco={nome:label,itens:[]};continue;}
    if(!bloco)bloco={nome:'Extras e provisões',itens:[]};
    const cr=cores1?(cores1[i]||[]):null;
    // pago = celula pintada de verde; sem pintura = a pagar; null = sem informacao de cor
    const pago=cr?nums.map((v,k)=>v>0?(cr[k+1]==='verde'):null):nums.map(()=>null);
    bloco.itens.push({nome:label,valores:nums,pago});
  }
  if(bloco){bloco.total=bloco.itens.reduce((a,it)=>a.map((v,i)=>v+it.valores[i]),vazio12());blocos.push(bloco);}
  const despTotal=lin(a1,'total das despesas')||vazio12();

  const meta={objetivo:lin(a1,'objetivo')||vazio12(), realizado:lin(a1,'realizado')||vazio12(),
    saldo:lin(a1,'saldo')||vazio12(), caixa:lin(a1,'caixa',idx(a1,'objetivo'))||vazio12(),
    caixaRes:lin(a1,'caixa + resultado')||vazio12()};

  // balanco: colunas comecam em fevereiro
  const iB=idx(a1,'balanco');
  const bal={pagas:vazio12(),aPagar:vazio12()};
  if(iB>=0){
    const cab=a1[iB].slice(1).map(norm);
    const mapa=cab.map(c=>MESES.findIndex(m=>norm(m)===c));
    const pegar=pref=>{const i=idx(a1,pref,iB);if(i<0)return vazio12();const out=vazio12();
      a1[i].slice(1).forEach((c,k)=>{if(mapa[k]>=0)out[mapa[k]]=brl(c);});return out;};
    bal.pagas=pegar('despesas pagas'); bal.aPagar=pegar('saldo a pagar');
  }
  return {rec:{consultoria,mentoria,framework,total,divergencia,
               previsto:{mentoria:a2m.total,framework:a2f.total}},
          desp:{blocos,total:despTotal}, meta, bal, lidoEm:new Date()};
}

/* Classifica a cor de fundo de uma celula: verde = pago, sem pintura = a pagar. */
function corCelula(bg){
  if(!bg) return 'nenhum';
  const r=bg.red||0, g=bg.green||0, b=bg.blue||0;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  if(max>0.95&&d<0.04) return 'nenhum';                 // branco ou quase
  if(d<0.04) return 'outro';                            // cinza
  let h=max===r?60*(((g-b)/d)%6):max===g?60*((b-r)/d+2):60*((r-g)/d+4);
  if(h<0)h+=360;
  return (h>=70&&h<=170)?'verde':'outro';               // faixa do verde, do limão ao verde-água
}
/* Com chave da API do Google: valores e cores numa chamada so. Sem chave: CSV, sem cores. */
async function lerPlanilha(){
  const c=D.config; if(!c.planilha_id) throw new Error('Informe o ID da planilha em Configurações.');
  const aba1=c.aba_resultado||'Planilha financeira - RESULTADO', aba2=c.aba_mentorados||'FRAMEWORK';
  if(c.sheets_api_key){
    const campos='sheets(properties.title,data(rowData.values(formattedValue,effectiveFormat.backgroundColor)))';
    const u=`https://sheets.googleapis.com/v4/spreadsheets/${c.planilha_id}?includeGridData=true`
      +`&ranges=${encodeURIComponent("'"+aba1+"'!A1:M200")}&ranges=${encodeURIComponent("'"+aba2+"'!A1:M200")}`
      +`&fields=${encodeURIComponent(campos)}&key=${encodeURIComponent(c.sheets_api_key)}`;
    const r=await fetch(u);
    if(!r.ok){const t=await r.text().catch(()=>'');
      throw new Error(r.status===403?'A chave da API foi recusada. Confira se a Google Sheets API está ativada e se a chave permite o endereço do painel.':`Google Sheets API respondeu ${r.status}. ${t.slice(0,120)}`);}
    const j=await r.json();
    const grade=s=>{const rows=[],cores=[];(s?.data?.[0]?.rowData||[]).forEach(rd=>{
      const vals=rd.values||[];rows.push(vals.map(v=>v.formattedValue??''));cores.push(vals.map(v=>corCelula(v.effectiveFormat?.backgroundColor)));});
      return {rows,cores};};
    const s1=(j.sheets||[]).find(s=>s.properties?.title===aba1)||j.sheets?.[0], s2=(j.sheets||[]).find(s=>s.properties?.title===aba2)||j.sheets?.[1];
    const g1=grade(s1), g2=grade(s2);
    P=interpretar(g1.rows,g2.rows,g1.cores); P.comCores=true; return;
  }
  const url=aba=>`https://docs.google.com/spreadsheets/d/${c.planilha_id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(aba)}&_=${Date.now()}`;
  const [r1,r2]=await Promise.all([fetch(url(aba1)),fetch(url(aba2))]);
  if(!r1.ok||!r2.ok) throw new Error('A planilha não respondeu. Ela precisa estar compartilhada como "qualquer pessoa com o link pode ver".');
  P=interpretar(csvParse(await r1.text()),csvParse(await r2.text()),null); P.comCores=false;
}

/* Pago e a pagar do mes. Com cores: soma das celulas verdes e das sem pintura. Sem cores: linhas do balanco. */
function pagamentos(m){
  if(!P) return {pago:0,aPagar:0,fonte:'nenhuma',itensAPagar:[]};
  if(P.comCores){
    let pago=0,aPagar=0;const itens=[];
    P.desp.blocos.forEach(b=>b.itens.forEach(i=>{const v=i.valores[m];if(!(v>0))return;
      if(i.pago[m]===true)pago+=v;else{aPagar+=v;itens.push({nome:i.nome,bloco:b.nome,valor:v});}}));
    itens.sort((a,b)=>b.valor-a.valor);
    return {pago,aPagar,fonte:'cores',itensAPagar:itens};
  }
  return {pago:P.bal.pagas[m],aPagar:P.bal.aPagar[m],fonte:'balanco',itensAPagar:[]};
}

/* semanas de segunda a domingo que tocam o mes; recebido vem das fotos diarias */
function semanas(a,m){
  const ini=new Date(a,m,1), fim=new Date(a,m+1,0), meta=metaMes(m), diasMes=fim.getDate();
  const fotos=D.fotos_diarias.filter(f=>f.ano_mes===chave(a,m)).sort((x,y)=>x.data.localeCompare(y.data));
  const valorEm=d=>{const s=iso(d);let v=0;for(const f of fotos){if(f.data<=s)v=+f.total;else break;}return v;};
  const out=[];let s=new Date(ini);s.setDate(s.getDate()-((s.getDay()+6)%7)); // segunda da 1a semana
  let n=1;
  while(s<=fim){
    const e=new Date(s);e.setDate(e.getDate()+6);
    const si=new Date(s<ini?ini:s), ei=new Date(e>fim?fim:e);   // recorte dentro do mes (copias, nao referencias)
    const dias=Math.round((ei-si)/86400000)+1;
    const alvo=meta*dias/diasMes;
    const antes=new Date(si);antes.setDate(antes.getDate()-1);
    const recebido=Math.max(0,valorEm(ei)-(antes<ini?0:valorEm(antes)));
    const status=ei<HOJE&&iso(ei)!==iso(HOJE)?'fechada':(si>HOJE?'futura':'aberta');
    out.push({n,ini:si,fim:ei,dias,alvo,recebido,pct:alvo?recebido/alvo*100:0,status});
    s.setDate(s.getDate()+7);n++;
  }
  let acum=0;out.forEach(w=>{acum+=w.recebido;w.acum=acum;w.pctAcum=meta?acum/meta*100:0;});
  return out;
}

/* ================= AGENTE ================= */
function agenteLocal(){
  const A=[];if(!P)return A;const m=MES, r=recMes(m), desp=despMes(m), res=r.total-desp, meta=metaMes(m);
  const mesAtual=m===HOJE.getMonth(), hoje=HOJE.getDate(), ult=new Date(ANO,m+1,0).getDate();
  A.push([res>=0?'bom':'critico',`<strong>Resultado de ${MESES[m]}: ${rs(res)}.</strong> Entrou ${rs(r.total)} e saiu ${rs(desp)}. Margem de ${r.total?(res/r.total*100).toFixed(1):'0'}%.`]);
  if(meta>0&&mesAtual&&hoje>3){const proj=r.total/hoje*ult;
    A.push([proj<meta*0.95?'atencao':'bom',proj<meta*0.95
      ?`<strong>Ritmo abaixo da meta.</strong> No passo atual o mês fecha em ${rsc(proj)}. Faltam ${rsc(Math.max(0,meta-r.total))} em ${Math.max(1,ult-hoje)} dias.`
      :`<strong>Ritmo acima da meta.</strong> No passo atual o mês fecha em ${rsc(proj)}.`]);}
  const aRec=aReceberMes(m);
  if(aRec>0) A.push(['info',`<strong>${rs(aRec)} previstos na aba 2 ainda não entraram.</strong> Se entrarem, ${MESES[m]} fecha em ${rsc(r.total+aRec)}${meta?`, ${((r.total+aRec)/meta*100).toFixed(0)}% da meta`:''}.`]);
  if(m>0){const pd=despMes(m-1);if(pd&&desp>pd*1.15)A.push(['atencao',`<strong>Despesa subiu ${((desp/pd-1)*100).toFixed(0)}% sobre ${MESES[m-1]}</strong>, de ${rsc(pd)} para ${rsc(desp)}.`]);
    P.desp.blocos.forEach(b=>{const a=b.total[m-1],c=b.total[m];if(a>0&&c>a*1.25&&c-a>1500)A.push(['atencao',`<strong>${esc(b.nome)} cresceu ${rsc(c-a)}</strong> de ${MESES[m-1]} para ${MESES[m]}.`]);});}
  const blocos=P.desp.blocos.map(b=>[b.nome,b.total[m]]).sort((a,b)=>b[1]-a[1]);
  if(blocos.length&&desp)A.push(['info',`<strong>Maior bloco: ${esc(blocos[0][0])}, ${rs(blocos[0][1])}</strong>, ${(blocos[0][1]/desp*100).toFixed(0)}% do mês.`]);
  const pg=pagamentos(m), ap=pg.aPagar;
  if(ap>0)A.push(['atencao',`<strong>${rs(ap)} ainda a pagar</strong> em ${MESES[m]}${pg.itensAPagar.length?`: ${pg.itensAPagar.slice(0,3).map(i=>`${esc(i.nome)} (${rsc(i.valor)})`).join(', ')}${pg.itensAPagar.length>3?` e mais ${pg.itensAPagar.length-3}`:''}`:''}.`]);
  if(ap<0)A.push(['info',`<strong>Pagou ${rs(-ap)} a mais do que a despesa do mês.</strong> Provavelmente conta de mês anterior. Vale conferir na planilha.`]);
  if(pg.fonte==='cores'&&Math.abs(pg.aPagar-P.bal.aPagar[m])>1)A.push(['info',`<strong>Cores e balanço discordam.</strong> Pelas células sem pintura faltam ${rsc(pg.aPagar)}; a linha SALDO A PAGAR diz ${rsc(P.bal.aPagar[m])}. Uma das duas não foi atualizada.`]);
  if(P.rec.divergencia[m])A.push(['atencao',`<strong>A soma dos três produtos não bate com a linha TOTAL da planilha</strong> em ${MESES[m]}. O painel usa a linha TOTAL. Vale conferir a fórmula.`]);
  const custo=desp||1, reserva=totalInvestido()+(+D.config.caixa_empresa||0);
  if(reserva>0){const mm=reserva/custo;A.push([mm<3?'atencao':'bom',`<strong>Reserva real de ${mm.toFixed(1)} mês(es)</strong>: ${rsc(reserva)} contra ${rsc(custo)} de custo. Alvo de 3 meses seria ${rsc(custo*3)}.`]);}
  const imp=(+D.config.base_declarada||0)*(+D.config.aliquota||0)/100;
  if(imp>0)A.push(['info',`<strong>Provisionar ${rs(imp)} de imposto</strong>, ${D.config.aliquota}% sobre ${rsc(D.config.base_declarada)}.`]);
  return A;
}
function dadosParaIA(){

    meta:metaMes(m),semanas:semanas(ANO,m).map(w=>({semana:w.n,status:w.status,recebido:Math.round(w.recebido),alvo:Math.round(w.alvo)})),
    ano:MESC.map((x,i)=>({mes:x,recebido:Math.round(P.rec.total[i]),despesa:Math.round(P.desp.total[i]),resultado:Math.round(P.rec.total[i]-P.desp.total[i])})).slice(0,Math.max(m,HOJE.getMonth())+1),
    a_pagar:Math.round(pagamentos(m).aPagar),itens_a_pagar:pagamentos(m).itensAPagar.slice(0,8).map(i=>({item:i.nome,valor:Math.round(i.valor)})),caixa_acumulado_planilha:Math.round(P.meta.caixaRes[m]),
    reserva_real:{investimentos:Math.round(totalInvestido()),conta:Math.round(+D.config.caixa_empresa||0)},

async function rodarIA(){
  const url=D.config.agente_url;if(!url)return toast('Configure a URL do agente em Configurações.',true);
  if(!P)return toast('Sem planilha não há o que analisar.',true);
  IA={estado:'rodando',itens:[],erro:''};verDash();const dados=dadosParaIA();
  try{const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token||SUPABASE_KEY}`},
      body:JSON.stringify({modo:'analise',mes:`${MESES[MES]} ${ANO}`,dados,automaticos:agenteLocal().map(([n,t])=>t.replace(/<[^>]+>/g,''))})});
    const j=await r.json();if(j.erro)throw new Error(j.erro);
    const itens=j.apontamentos||[];IA={estado:'pronto',itens,erro:''};
    const {data,error}=await sb.from('analises').insert({ano_mes:chave(ANO,MES),apontamentos:itens,contexto:dados,modelo:'claude'}).select().single();
    if(error)toast('Análise pronta, mas não salvou no histórico: '+error.message,true);else D.analises.unshift(data);
  }catch(e){IA={estado:'erro',itens:[],erro:String(e.message||e)};}
  verDash();
}
const quando=s=>{const d=new Date(s);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} às ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const blocoApont=l=>(l||[]).map(i=>`<div class="alerta ${esc(i.nivel||'info')}"><div><strong>${esc(i.titulo||'')}</strong><br>${esc(i.texto||'')}${i.acao?`<span class="acao"><b>Ação:</b> ${esc(i.acao)}</span>`:''}</div></div>`).join('');
function renderAgente(){

  if(atual){h+=`<div class="rotulo" style="margin-bottom:9px">Análise de ${atual.q}${atual.id?` · <button class="x" style="font-size:12px" onclick="apagarAnalise('${atual.id}')">✕</button>`:''}</div>${blocoApont(atual.itens)}<p class="nota">Gerada por IA sobre os números da planilha. Confira antes de decidir.</p>`;}

    pinta('gCart','doughnut',{labels:cartoes.map(x=>x.nome),datasets:[{data:cartoes.map(x=>x.v),backgroundColor:cartoes.map((_,k)=>CORES[k%CORES.length]),borderColor:'#0e0e0e',borderWidth:2}]});
    pinta('gCartAno','bar',{labels:MESC,datasets:[{label:'Cartões',data:b.total,backgroundColor:'#f0605f',borderRadius:3,maxBarThickness:28}]});}
  const z=document.getElementById('zona');if(z){z.ondragover=e=>{e.preventDefault();z.classList.add('ativo')};z.ondragleave=()=>z.classList.remove('ativo');z.ondrop=e=>{e.preventDefault();z.classList.remove('ativo');carregarPrints(e.dataTransfer.files)};}
  desenhaMinis();
}
function faturaProj(id,a,m){const ref=new Date(a,m,1);let t=0;
  D.parcelamentos.filter(p=>p.cartao_id===id).forEach(p=>{const n=dif(dObj(p.primeira_competencia),ref);if(n>=0&&n<p.total_parcelas)t+=+p.valor_parcela;});
  D.assinaturas.filter(x=>x.cartao_id===id&&x.ativo!==false).forEach(x=>t+=+x.valor);return t;}
function carregarPrints(files){const arr=[...files].filter(f=>f.type.startsWith('image/')).slice(0,8);if(!arr.length)return toast('Escolha imagens.',true);
  PRINTS=[];let lidos=0;arr.forEach(f=>{const r=new FileReader();r.onload=()=>{PRINTS.push({tipo:f.type,dados:String(r.result).split(',')[1],url:r.result});
    if(++lidos===arr.length){desenhaMinis();const b=document.getElementById('btLer');if(b){b.disabled=false;b.textContent=`Ler ${PRINTS.length} print(s) com IA`;}}};r.readAsDataURL(f);});}
function desenhaMinis(){const el=document.getElementById('minis');if(el)el.innerHTML=PRINTS.map(p=>`<img src="${p.url}" alt="">`).join('');}
async function lerPrints(){
  if(!PRINTS.length)return toast('Escolha os prints primeiro.',true);const url=D.config.agente_url;if(!url)return toast('Configure a URL do agente.',true);
  const b=document.getElementById('btLer');b.disabled=true;b.innerHTML='<span class="girando"></span>Lendo';
  try{const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token||SUPABASE_KEY}`},body:JSON.stringify({modo:'fatura',mes:`${MESES[MES]} ${ANO}`,imagens:PRINTS.map(p=>({tipo:p.tipo,dados:p.dados}))})});
    const j=await r.json();if(j.erro)throw new Error(j.erro);mostrarLidas(j.linhas||[]);
  }catch(e){document.getElementById('resultadoImp').innerHTML=`<div class="alerta critico" style="margin-top:14px"><div><strong>Não consegui ler.</strong><br>${esc(String(e.message||e))}</div></div>`;}
  b.disabled=false;b.textContent=`Ler ${PRINTS.length} print(s) com IA`;
}
function mostrarLidas(linhas){
  LIDAS=linhas.filter(l=>+l.valor>0);const el=document.getElementById('resultadoImp');
  if(!LIDAS.length){el.innerHTML='<div class="vazio">A IA não encontrou linhas legíveis.</div>';return;}
  const parc=LIDAS.filter(l=>l.parcela_total>1).length, ass=LIDAS.length-parc, tot=LIDAS.reduce((s,l)=>s+ +l.valor,0);
  el.innerHTML=`<h2 style="margin-top:22px"><span class="q"></span>${LIDAS.length} linhas lidas · ${rs(tot)} · confira antes de salvar</h2>
  <table><thead><tr><th>Descrição</th><th>Categoria</th><th class="d">Parcela</th><th class="d">Valor</th><th>Vira</th></tr></thead><tbody>
  ${LIDAS.map((l,i)=>`<tr><td><input class="ed nm" value="${esc(l.descricao)}" onchange="LIDAS[${i}].descricao=this.value"></td><td><input class="ed" value="${esc(l.categoria||'Outros')}" onchange="LIDAS[${i}].categoria=this.value"></td>
    <td class="d">${l.parcela_total>1?`<input class="ed n" style="width:34px" type="number" value="${l.parcela_atual||1}" onchange="LIDAS[${i}].parcela_atual=+this.value">/<input class="ed n" style="width:34px" type="number" value="${l.parcela_total}" onchange="LIDAS[${i}].parcela_total=+this.value">`:'—'}</td>
    <td class="d"><input class="ed n lim" type="number" step="0.01" value="${l.valor}" onchange="LIDAS[${i}].valor=+this.value"></td><td>${l.parcela_total>1?'<span class="tag al">parcelamento</span>':'<span class="tag">avulso / assinatura</span>'}</td></tr>`).join('')}</tbody></table>
  <div style="margin-top:14px"><button class="btn" onclick="salvarLidas()">Salvar ${parc} parcelamentos e ${ass} assinaturas</button> <button class="btnv" onclick="LIDAS=[];document.getElementById('resultadoImp').innerHTML=''">Descartar</button></div>
  <p class="nota">O total da fatura continua vindo da planilha. O que a IA lê serve para enxergar o que é parcela antiga e em que mês cada cartão fica livre.</p>`;
}
async function salvarLidas(){
  const cartao_id=document.getElementById('impCart').value;if(!cartao_id)return toast('Cadastre um cartão primeiro.',true);
  const parc=LIDAS.filter(l=>l.parcela_total>1).map(l=>{const at=Math.max(1,+l.parcela_atual||1);return {cartao_id,descricao:l.descricao||'Compra',categoria:l.categoria||'Outros',valor_parcela:+l.valor,total_parcelas:+l.parcela_total,primeira_competencia:iso(new Date(ANO,MES-(at-1),1)),escopo:'pessoal'};});
  const ass=LIDAS.filter(l=>!(l.parcela_total>1)).map(l=>({cartao_id,descricao:l.descricao||'Lançamento',valor:+l.valor,escopo:'pessoal',ativo:true}));
  if(parc.length){const{data,error}=await sb.from('parcelamentos').insert(parc).select();if(error)return toast('Erro: '+error.message,true);D.parcelamentos.push(...data);}
  if(ass.length){const{data,error}=await sb.from('assinaturas').insert(ass).select();if(error)return toast('Erro: '+error.message,true);D.assinaturas.push(...data);}
  LIDAS=[];PRINTS=[];toast(`${parc.length+ass.length} linhas salvas.`);desenhar();
}
async function novoCartao(){const nome=document.getElementById('kNome').value.trim();if(!nome)return toast('Informe o nome.',true);
  const {data,error}=await sb.from('cartoes').insert({nome,escopo:'pessoal',dia_vencimento:10}).select().single();if(error)return toast('Erro: '+error.message,true);
  D.cartoes.push(data);toast('Cartão adicionado.');desenhar();}

/* ================= INVESTIMENTOS ================= */
const eCaixa=i=>/caixa|conta|corrente/i.test(i.tipo||'');
const somaCaixa=()=>D.investimentos.filter(eCaixa).reduce((s,i)=>s+ +i.valor,0)+(+D.config.caixa_empresa||0);
const somaInvestido=()=>D.investimentos.filter(i=>!eCaixa(i)).reduce((s,i)=>s+ +i.valor,0);
function verInvestimentos(){
  const t=somaInvestido(), caixa=somaCaixa(), total=t+caixa;
  let h=`<h2><span class="q"></span>Reserva</h2>
  <div class="grade g3">${hero('Caixa em conta',rsc(caixa),'carteiras tipo Caixa mais o saldo informado','b')}${hero('Total investido',rsc(t),'tudo que não é caixa','')}${hero('Reserva total',rsc(total),'caixa mais investido','big')}</div>
  <h2><span class="q"></span>Evolução mês a mês</h2>
  <div class="cartao"><div class="grafico"><canvas id="gInv" role="img" aria-label="Evolução da reserva"></canvas></div>
    <div class="formlinha" style="margin-top:14px"><button class="btn" onclick="registrarSnapshot()">Registrar posição de ${MESES[MES]}</button><span class="nota" style="margin:0">Uma vez por mês, para o gráfico crescer.</span></div></div>
  <h2><span class="q"></span>Por banco · tudo editável</h2>
  <div class="cartao"><table><thead><tr><th>Banco</th><th>Tipo</th><th class="d">Valor</th><th class="d">%</th><th>Atualizado</th><th></th></tr></thead><tbody>`;
  [...D.investimentos].sort((a,b)=>+b.valor-+a.valor).forEach(i=>{h+=`<tr>
    <td><input class="ed nm" value="${esc(i.banco)}" onchange="up('investimentos','${i.id}','banco',this.value)"></td>
    <td><select class="ed" onchange="up('investimentos','${i.id}','tipo',this.value)">${['Caixa','Reserva','Investimento'].map(x=>`<option value="${x}"${(i.tipo||'')===x?' selected':''}>${x}</option>`).join('')}${['Caixa','Reserva','Investimento'].includes(i.tipo)?'':`<option value="${esc(i.tipo||'')}" selected>${esc(i.tipo||'')}</option>`}</select></td>
    <td class="d"><input class="ed n" style="width:120px" type="number" step="0.01" value="${i.valor}" onchange="upNum('investimentos','${i.id}','valor',this.value)"></td>
    <td class="d">${total?(+i.valor/total*100).toFixed(1):0}%</td>
    <td><input class="ed dt" type="date" value="${String(i.atualizado_em||'').slice(0,10)}" onchange="up('investimentos','${i.id}','atualizado_em',this.value)"></td>
    <td><button class="x" onclick="del('investimentos','${i.id}')">✕</button></td></tr>`;});
  h+=`</tbody></table></div>
  <h2><span class="q"></span>Nova carteira</h2>
  <div class="cartao"><div class="formlinha"><div class="campo"><label>Banco</label><input id="iBanco"></div><div class="campo"><label>Tipo</label><select id="iTipo"><option>Caixa</option><option selected>Reserva</option><option>Investimento</option></select></div><div class="campo"><label>Valor</label><input id="iValor" type="number" step="0.01"></div><button class="btn" onclick="novoInvestimento()">Adicionar</button></div></div>`;
  document.getElementById('v-inv').innerHTML=h;
  const hist=[...D.investimentos_hist].sort((a,b)=>a.ano_mes.localeCompare(b.ano_mes)).slice(-12);
  if(hist.length){const lb=hist.map(x=>{const[a,m]=x.ano_mes.split('-');return `${MESC[+m-1]}/${a.slice(2)}`});
    pinta('gInv','line',{labels:lb,datasets:[{label:'Reserva total',data:hist.map(x=>+x.caixa+ +x.investido+ +x.reserva),borderColor:'#44CF17',backgroundColor:'rgba(68,207,23,.10)',borderWidth:2,fill:true,pointRadius:4,pointBackgroundColor:'#44CF17',tension:.2},{label:'Caixa',data:hist.map(x=>+x.caixa),borderColor:'#4E9AE8',borderWidth:2,fill:false,pointRadius:4,pointBackgroundColor:'#4E9AE8',tension:.2}]},{plugins:{legend:{display:true,position:'bottom',labels:{color:'#7e8183',font:{family:'monospace',size:11},boxWidth:10,padding:14}},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${rsc(c.parsed.y)}`}}}});}
  else{const el=document.getElementById('gInv');if(el)el.closest('.grafico').innerHTML='<div class="vazio">Nenhuma posição registrada. Clique no botão abaixo para começar.</div>';}
}
async function registrarSnapshot(){const linha={ano_mes:chave(ANO,MES),caixa:somaCaixa(),investido:D.investimentos.filter(i=>/investimento/i.test(i.tipo||'')).reduce((s,i)=>s+ +i.valor,0),reserva:D.investimentos.filter(i=>/reserva/i.test(i.tipo||'')).reduce((s,i)=>s+ +i.valor,0)};
  const {error}=await sb.from('investimentos_hist').upsert(linha,{onConflict:'ano_mes'});if(error)return toast('Erro: '+error.message,true);
  const i=D.investimentos_hist.findIndex(x=>x.ano_mes===linha.ano_mes);if(i>=0)D.investimentos_hist[i]=linha;else D.investimentos_hist.push(linha);toast('Posição registrada.');desenhar();}
async function novoInvestimento(){const r={banco:document.getElementById('iBanco').value.trim(),tipo:document.getElementById('iTipo').value,valor:+document.getElementById('iValor').value||0,atualizado_em:iso(HOJE)};
  if(!r.banco)return toast('Informe o banco.',true);const {data,error}=await sb.from('investimentos').insert(r).select().single();if(error)return toast('Erro: '+error.message,true);
  D.investimentos.push(data);['iBanco','iValor'].forEach(i=>document.getElementById(i).value='');toast('Carteira adicionada.');desenhar();}

/* ================= CONFIG ================= */
function verConfig(){
  const c=D.config;
  document.getElementById('v-conf').innerHTML=`<h2><span class="q"></span>Planilha</h2>
  <div class="cartao"><div class="formlinha">
    <div class="campo" style="flex:2"><label>ID da planilha</label><input id="cPlan" value="${esc(c.planilha_id||'')}" placeholder="o trecho entre /d/ e /edit no link"></div>
    <div class="campo"><label>Aba de resultado</label><input id="cAba1" value="${esc(c.aba_resultado||'Planilha financeira - RESULTADO')}"></div>
    <div class="campo"><label>Aba de mentorados</label><input id="cAba2" value="${esc(c.aba_mentorados||'FRAMEWORK')}"></div>
  </div>
  <div class="formlinha" style="margin-top:12px"><div class="campo" style="flex:2"><label>Chave da API do Google Sheets (para ler a cor das células)</label><input id="cSheetsKey" type="password" value="${esc(c.sheets_api_key||'')}" placeholder="AIza..."></div>
    <span class="tag ${c.sheets_api_key?'ok':''}">${c.sheets_api_key?(P?.comCores?'lendo cores':'chave salva'):'sem chave'}</span></div>
  <p class="nota">A planilha precisa estar compartilhada como "qualquer pessoa com o link pode ver". Sem a chave, o painel lê os valores pelo CSV e usa as linhas do balanço para pago e a pagar. Com a chave, lê também a cor: verde é pago, sem pintura é a pagar. A chave é gratuita, criada em console.cloud.google.com, restrita à Google Sheets API e ao endereço deste painel.</p></div>
  <h2><span class="q"></span>Identidade</h2>
  <div class="cartao"><div class="formlinha">
    <div class="campo"><label>Nome do negócio</label><input id="cNome" value="${esc(c.negocio||'')}"></div>
    <div class="campo"><label>Logo</label><input id="cLogoFile" type="file" accept="image/*" onchange="subirLogo(this.files[0])"></div>
    <div class="campo"><label>Cor de destaque</label><input id="cCor" type="color" value="${esc(c.cor_primaria||'#44CF17')}"></div>
    <div class="campo"><label>Assinatura do rodapé</label><input id="cAssin" value="${esc(c.assinatura||'')}"></div>
  </div></div>
  <h2><span class="q"></span>Números</h2>
  <div class="cartao"><div class="formlinha">
    <div class="campo"><label>Meta padrão</label><input id="cMeta" type="number" step="1000" value="${c.meta_mensal||100000}"></div>
    <div class="campo"><label>Saldo real em conta</label><input id="cCaixa" type="number" step="0.01" value="${c.caixa_empresa||0}"></div>
    <div class="campo"><label>Alíquota (%)</label><input id="cAliq" type="number" step="0.01" value="${c.aliquota||0}"></div>
    <div class="campo"><label>Base declarada</label><input id="cBase" type="number" step="0.01" value="${c.base_declarada||0}"></div>
    <div class="campo" style="flex:2"><label>URL do agente</label><input id="cAgente" value="${esc(c.agente_url||'')}"></div>
  </div><p class="nota">A meta padrão só vale nos meses em que a linha Objetivo da planilha estiver vazia.</p>
  <div style="margin-top:14px"><button class="btn" onclick="salvarConfig()">Salvar</button></div></div>
  <h2><span class="q"></span>Fotos diárias do recebido</h2>
  <div class="cartao"><p style="font-size:13.5px;color:var(--medio)">${D.fotos_diarias.length} foto(s) guardadas. A mais recente: ${D.fotos_diarias.length?dObj([...D.fotos_diarias].sort((a,b)=>b.data.localeCompare(a.data))[0].data).toLocaleDateString('pt-BR'):'nenhuma'}. O painel tira uma a cada abertura; o robô diário, se ativado na migração v9, garante uma por dia.</p></div>`;
}
async function subirLogo(file){if(!file)return;const nome=`logo-${Date.now()}.${file.name.split('.').pop()||'png'}`;
  const {error}=await sb.storage.from('branding').upload(nome,file,{upsert:true});if(error)return toast('Erro ao subir: '+error.message,true);
  const {data}=sb.storage.from('branding').getPublicUrl(nome);await sb.from('config').update({logo_url:data.publicUrl}).eq('id',1);D.config.logo_url=data.publicUrl;marca();toast('Logo atualizada.');}
async function salvarConfig(){
  const r={planilha_id:document.getElementById('cPlan').value.trim().replace(/.*\/d\/([^/]+).*/,'$1')||null,
    sheets_api_key:document.getElementById('cSheetsKey').value.trim()||null,
    aba_resultado:document.getElementById('cAba1').value.trim()||'Planilha financeira - RESULTADO',aba_mentorados:document.getElementById('cAba2').value.trim()||'FRAMEWORK',
    negocio:document.getElementById('cNome').value.trim()||'Painel RHINO',cor_primaria:document.getElementById('cCor').value,assinatura:document.getElementById('cAssin').value.trim(),
    meta_mensal:+document.getElementById('cMeta').value||100000,caixa_empresa:+document.getElementById('cCaixa').value||0,
    aliquota:+document.getElementById('cAliq').value||0,base_declarada:+document.getElementById('cBase').value||0,agente_url:document.getElementById('cAgente').value.trim()||null};
  const {error}=await sb.from('config').update(r).eq('id',1);if(error)return toast('Erro: '+error.message,true);
  D.config={...D.config,...r};marca();toast('Salvo. Relendo a planilha.');recarregar(false);
}

/* ================= GENÉRICOS ================= */
async function up(tabela,id,campo,valor){const {error}=await sb.from(tabela).update({[campo]:valor}).eq('id',id);if(error)return toast('Erro: '+error.message,true);
  const it=D[tabela]?.find(x=>x.id===id);if(it)it[campo]=valor;toast('Salvo.');desenhar();}
const upNum=(t,i,c,v)=>up(t,i,c,+v||0);
async function del(tabela,id){if(!confirm('Remover? Não dá para desfazer.'))return;const {error}=await sb.from(tabela).delete().eq('id',id);if(error)return toast('Erro: '+error.message,true);
  D[tabela]=D[tabela].filter(x=>x.id!==id);toast('Removido.');desenhar();}
</script>
</body>
</html>
