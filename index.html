<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F8">
<title>Painel RHINO · Consulting Framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --sf:#FFFFFF; --sf2:#F7F9FB; --ink:#0F1A2B; --mut:#5A6B80; --ln:#E3E8EF; --ln2:#EDF1F6;
  --acc:#1C9A5B; --acc-ink:#FFFFFF; --acc-soft:color-mix(in srgb,var(--acc) 13%,#fff);
  --pos:#1C9A5B; --neg:#D6453C; --warn:#C98A0B; --info:#2F6FED;
  --pos-soft:#E4F5EC; --neg-soft:#FBE7E5; --warn-soft:#FBF1DC; --info-soft:#E6EEFD;
  --r:16px; --r2:10px; --font:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --c0:#1C9A5B; --c1:#2F6FED; --c2:#7C5CE0; --c3:#E39A12; --c4:#D6453C; --c5:#17A2B8; --c6:#8A94A6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;touch-action:manipulation}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .av{color:var(--warn)} .mut{color:var(--mut)}
.oculto{display:none !important}
.q{display:none}
.rotulo{font-size:12.5px;font-weight:600;color:var(--mut)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.cxlogin{width:100%;max-width:380px;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:32px 28px;box-shadow:0 20px 60px rgba(15,26,43,.08)}
.cxlogin .marca{margin-bottom:18px}
.cxlogin h1{font-size:21px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.cxlogin p{font-size:14px;color:var(--mut);margin-bottom:20px}
.campo{margin-bottom:12px}
.campo label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--sf2);border:1px solid var(--ln);color:var(--ink);padding:9px 11px;border-radius:var(--r2);min-height:42px}
select{background-color:var(--sf2)}
select option{background:var(--sf);color:var(--ink)}
input[type="color"]{padding:3px;min-height:42px;width:56px}
input[type="file"]{padding:7px 10px;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--acc);color:var(--acc-ink);border:0;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;min-height:40px;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55;cursor:wait}
.btnv{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);padding:8px 14px;border-radius:12px;font-weight:600;font-size:13.5px;min-height:36px;white-space:nowrap}
.btnv:hover{border-color:var(--acc);color:var(--acc)}
.btn.sm,.btnv.sm{padding:5px 11px;font-size:12.5px;min-height:32px;border-radius:9px}
.btn svg,.btnv svg{width:16px;height:16px;flex:none}
.erro{background:var(--neg-soft);border:1px solid rgba(214,69,60,.35);color:#9B2C24;padding:9px 12px;font-size:13.5px;margin-top:12px;border-radius:var(--r2)}

/* ---------- cabeçalho e navegação ---------- */
header{position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--ln)}
.topo{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;min-height:60px}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.marca img{height:32px;max-width:140px;object-fit:contain}
.mark{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.marca .nome{font-weight:800;font-size:15.5px;line-height:1.1;white-space:nowrap}
.marca .sub{font-size:12px;color:var(--mut);white-space:nowrap}
.mes{display:flex;align-items:center;gap:6px;background:var(--sf2);border:1px solid var(--ln);border-radius:var(--r2);padding:4px 6px 4px 10px;font-weight:600;font-size:13px;color:var(--mut)}
.mes select{border:0;background:transparent;font-weight:700;color:var(--ink);padding:4px 2px;width:auto;min-height:0;cursor:pointer}
.quem{font-size:12.5px;color:var(--mut);white-space:nowrap}
nav.abas-wrap{background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:60px;z-index:19}
.abas{max-width:1180px;margin:0 auto;padding:8px 20px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:99px;font-weight:600;font-size:13.5px;white-space:nowrap}
.abas button:hover{color:var(--ink);background:var(--sf2)}
.abas button.on{background:var(--ink);color:#fff}
.bnav{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-radius:20px 20px 0 0;padding:10px 12px calc(88px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .25s;z-index:31;box-shadow:0 -10px 40px rgba(15,26,43,.18);border-top:1px solid var(--ln)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 10px}
.sheet button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--ink);font-weight:600;font-size:15px;padding:13px 10px;border-radius:var(--r2)}
.sheet button.on{color:var(--acc);background:var(--acc-soft)}
.sheet svg,.bnav svg{width:22px;height:22px;flex:none}
body.mais .sheet{transform:none}
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
body.mais .scrim{opacity:1;pointer-events:auto}
main{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
footer{border-top:1px solid var(--ln);padding:18px 20px 90px;text-align:center;color:var(--mut);font-size:12.5px}

/* ---------- títulos e blocos ---------- */
h2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:17px;font-weight:800;letter-spacing:-.01em;margin:26px 0 10px;text-wrap:balance}
h2:first-child{margin-top:0}
h2 .rotulo{font-weight:500;font-size:13px}
h2 .dir{margin-left:auto;font-weight:500;font-size:13px}
.grade{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cartao{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px 18px;min-width:0}
.cartao.p0{padding:0;overflow:hidden}
.cartao.p0>table{margin:0}
.hero{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px 18px;position:relative;min-width:0}
.hero .faixa{display:none}
.hero .t{font-size:13px;font-weight:600;color:var(--mut);margin-bottom:6px}
.hero .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .s{font-size:12.5px;color:var(--mut);margin-top:6px}
.hero.big{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero.big .t,.hero.big .s{color:rgba(255,255,255,.72)}
.hero.r .v{color:var(--neg)}
.hero .quebra{margin-top:10px;padding-top:8px;border-top:1px solid var(--ln2);display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.hero.big .quebra{border-top-color:rgba(255,255,255,.15)}
.hero .quebra div{display:flex;justify-content:space-between;gap:10px}
.hero .quebra span:last-child{font-variant-numeric:tabular-nums;font-weight:700}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi.clic{cursor:pointer;transition:border-color .15s}
.kpi.clic:hover{border-color:var(--acc)}
.kpi .t{font-size:12.5px;font-weight:600;color:var(--mut)}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:12px;color:var(--mut);margin-top:4px}
.anel{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.anel svg{width:132px;height:132px}
.anel .vv{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.barra{height:8px;border-radius:99px;background:var(--ln2);overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.barra.r i{background:var(--neg)} .barra.a i{background:var(--warn)}
.combo{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);gap:20px;align-items:center}
.leg{display:flex;flex-direction:column}
.leg .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln2);font-size:14px}
.leg .it:last-child{border-bottom:none}
.leg .it.sub{padding-left:22px;font-size:13px;color:var(--mut)}
.leg .pt{width:10px;height:10px;border-radius:3px;flex:none}
.leg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .vl{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.leg .pc{font-size:12px;color:var(--mut);width:42px;text-align:right}
.leg .tot{display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:1px solid var(--ln);font-weight:800;font-variant-numeric:tabular-nums}
.grafico{position:relative;height:270px}

/* ---------- tabelas ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--mut);text-align:left;padding:10px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;background:var(--sf2)}
td{padding:8px 10px;border-bottom:1px solid var(--ln2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
td.d,th.d{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nome{min-width:200px}
tr.matriz td{background:var(--sf2);font-weight:700;border-bottom:1px solid var(--ln)}
tr.filho td:first-child{padding-left:22px}
th.acoes,td.acoes{text-align:right;white-space:nowrap}
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--mut);white-space:nowrap;background:var(--sf2);line-height:1.3}
.tag.ok{color:var(--pos);background:var(--pos-soft);border-color:transparent}
.tag.mal{color:var(--neg);background:var(--neg-soft);border-color:transparent}
.tag.al{color:var(--warn);background:var(--warn-soft);border-color:transparent}
button.tag{cursor:pointer}
.x{background:none;border:0;color:var(--mut);width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;font-size:15px}
.x:hover{background:var(--neg-soft);color:var(--neg)}
.ed{background:transparent;border:1px solid transparent;border-bottom:1px dashed var(--ln);color:var(--ink);padding:4px 6px;width:100%;font-size:14px;border-radius:8px;min-height:0}
.ed:hover{border-color:var(--ln);background:var(--sf2)}
.ed:focus{border-color:transparent;background:var(--sf2)}
.ed.n{text-align:right;min-width:0;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.ed.n::-webkit-outer-spin-button,.ed.n::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ed.dt{width:138px}
.ed.nm{min-width:190px}
select.ed{width:auto;min-width:110px;padding-right:22px}
.ed.mudo{color:var(--mut);font-size:12px;padding:1px 4px;min-width:0}
.ed.mudo:hover{color:var(--ink)}
select.ed.mudo{width:auto;min-width:0;max-width:170px}
.ed.lim{width:100%;max-width:118px} .ed.mini{width:100%;max-width:64px}
td .sub{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:12px;color:var(--mut);flex-wrap:wrap}

/* ---------- alertas, listas, formulários ---------- */
.alerta{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r2);background:var(--sf);border:1px solid var(--ln);border-left-width:4px;margin-bottom:8px;font-size:14px;line-height:1.6}
.alerta.critico,.alerta.r{border-left-color:var(--neg)}
.alerta.atencao,.alerta.a{border-left-color:var(--warn)}
.alerta.bom,.alerta.v{border-left-color:var(--pos)}
.alerta.info,.alerta.b{border-left-color:var(--info)}
.alerta .acao{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--ln2);font-size:13px;color:var(--mut)}
.alerta .acao b{color:var(--acc)}
.linhafina{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--acc-soft);border-radius:var(--r2);padding:12px 14px;font-size:14px;flex-wrap:wrap}
.formlinha{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.formlinha .campo{margin:0;flex:1;min-width:150px}
.formlinha>.btn,.formlinha>.btnv{margin-bottom:0}
.fdisc{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r)}
.fdisc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;font-weight:700;font-size:15px}
.fdisc>summary::-webkit-details-marker{display:none}
.fdisc>summary .mais{width:26px;height:26px;border-radius:8px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;transition:transform .15s}
.fdisc[open]>summary .mais{transform:rotate(45deg)}
.fdisc>summary .rotulo{font-weight:500}
.fdisc[open]>summary{border-bottom:1px solid var(--ln2)}
.fdisc .fbody{padding:14px 18px 16px}
.vazio{text-align:center;color:var(--mut);padding:26px 14px;font-size:13.5px}
.nota{font-size:12.5px;color:var(--mut);margin-top:10px;line-height:1.6}
.sem{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.sem .c{background:var(--sf2);border:1px solid var(--ln2);border-radius:var(--r2);padding:11px 12px;min-width:0}
.sem .c .lb{font-size:11.5px;font-weight:600;color:var(--mut)}
.sem .c .vv{font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.sem .c .pp{font-size:11.5px;color:var(--mut);margin-top:5px}
.sem .c input{width:70px;background:transparent;border:1px dashed var(--ln);color:var(--mut);font-size:11.5px;padding:1px 4px;text-align:right;border-radius:5px;min-height:0;display:inline-block}
.sem .c input:hover{border-color:var(--mut)}
.girando{display:inline-block;width:13px;height:13px;border:2px solid var(--ln);border-top-color:var(--acc);border-radius:50%;animation:g .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes g{to{transform:rotate(360deg)}}
.cabecalho{width:100%;background:none;border:0;color:var(--ink);display:flex;align-items:center;gap:12px;padding:14px 18px;text-align:left;border-radius:var(--r)}
.cabecalho:hover{background:var(--sf2)}
.seta{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--mut);flex:none;transition:transform .15s;font-size:16px;background:var(--sf2)}
.seta.on{transform:rotate(90deg);color:var(--acc)}
.corpo{padding:0 18px 16px;border-top:1px solid var(--ln2)}
.corpo>.formlinha:first-child{padding-top:14px}
.corpo>table,.corpo>.rolagem{margin-top:4px}
.dropzona{border:1.5px dashed var(--ln);border-radius:var(--r);padding:22px;text-align:center;color:var(--mut);font-size:13.5px;background:var(--sf2)}
.dropzona.ativo{border-color:var(--acc);color:var(--acc)}
.miniaturas{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.miniaturas img{height:74px;border:1px solid var(--ln);border-radius:6px}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.sync .pt{width:8px;height:8px;border-radius:50%;background:var(--ln);flex:none}
.sync.ok .pt{background:var(--pos)} .sync.erro .pt{background:var(--neg)} .sync.rodando .pt{background:var(--warn)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 18px;font-size:13.5px;z-index:99;max-width:92vw;border-radius:12px;box-shadow:0 12px 30px rgba(15,26,43,.18);font-weight:600}
.toast.ok{background:var(--ink);color:#fff}
.toast.erro{background:var(--neg);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ---------- impressão ---------- */
@media print{
  body{background:#fff;color:#000}
  header,nav,footer,.btn,.btnv,.x,#filtros,.nota,.bnav,.sheet,.scrim,.fdisc{display:none !important}
  .cartao{border:1px solid #ccc;background:#fff;break-inside:avoid}
  table{font-size:11px} th,td{color:#000;border-color:#ddd}
  .tag{color:#000;border-color:#999}
  h2{color:#000}
}

/* ---------- celular ---------- */
@media(max-width:720px){
  body{font-size:15px}
  input,select,textarea{font-size:16px}
  .topo{padding:8px 14px;gap:8px;min-height:56px}
  .marca .sub,.quem,.mes>span{display:none}
  .mes{padding:2px 4px}
  nav.abas-wrap{display:none}
  main{padding:14px 14px 110px}
  footer{display:none}
  .g2,.g3,.combo{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:12px}
  .kpi .v{font-size:20px}
  .hero .v{font-size:27px}
  .anel{grid-template-columns:1fr;justify-items:center;text-align:center}
  .anel .chips{justify-content:center}
  .sem{grid-template-columns:1fr 1fr;gap:8px}
  .formlinha .campo{min-width:calc(50% - 5px)}
  .formlinha>.btn,.formlinha>.btnv{width:100%}
  h2 .dir{width:100%;margin-left:0}
  .cabecalho{padding:13px 14px}
  .corpo{padding:0 14px 14px}
  .fdisc>summary{padding:13px 14px} .fdisc .fbody{padding:12px 14px 14px}
  .cartao{padding:14px}
  /* tabelas viram lista de cartões */
  thead{display:none}
  table,tbody,tr,td{display:block}
  tr{border:1px solid var(--ln);border-radius:12px;padding:8px 12px;margin-bottom:8px;background:var(--sf)}
  td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0;border:0;text-align:right;min-width:0}
  td[data-l]::before{content:attr(data-l);color:var(--mut);font-size:12px;font-weight:600;text-align:left;flex:none;max-width:45%}
  td.nome{display:block;text-align:left;font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--ln2);margin-bottom:4px;min-width:0}
  td.nome::before{content:none}
  td.acoes{justify-content:flex-end;padding-top:8px}
  td.acoes::before{content:none}
  td:empty{display:none}
  tr.matriz{background:var(--sf2);padding:8px 12px;display:flex;justify-content:space-between}
  tr.matriz td{display:inline-flex;padding:0;background:none}
  tr.matriz td::before{content:none}
  tr.filho td:first-child{padding-left:0}
  td .ed{width:auto;max-width:60%;text-align:right;min-width:90px}
  td.nome .ed{width:100%;max-width:100%;text-align:left}
  td.nome .sub{justify-content:flex-start}
  select.ed{max-width:60%}
  .ed.dt{width:auto}
  .cartao.p0{padding:10px;overflow:visible}
  .cartao.p0 tr:last-child{margin-bottom:0}
  /* barra inferior + folha "Mais" */
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:32}

  r.forEach((res,i)=>{if(res.error){faltou.push(t[i]);return;} D[t[i]]=res.data||[];});
  D.config=(Array.isArray(D.config)&&D.config[0])||D.config||{};

}
/* No celular cada linha da tabela vira um cartão; o rótulo de cada célula vem do cabeçalho. */
function rotularTabelas(){
  document.querySelectorAll('main table').forEach(t=>{
    const ths=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    if(!ths.length)return;
    t.querySelectorAll('tbody tr').forEach(tr=>{ if(tr.classList.contains('matriz'))return;
      [...tr.children].forEach((td,i)=>{ if(ths[i]&&!td.dataset.l&&!td.classList.contains('acoes')) td.dataset.l=ths[i]; }); });
  });
  document.querySelectorAll('main .fdisc').forEach(d=>{ d.ontoggle=()=>{FORMS[d.id]=d.open;}; });
}
function anel(p,size=132,w=13){
  const r=(size-w)/2,C=2*Math.PI*r,len=Math.min(100,Math.max(0,p))/100*C;
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p)}% da meta"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ln2)" stroke-width="${w}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--acc)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="font-size:${size/4.6}px;font-weight:800;fill:var(--ink);font-family:var(--font)">${Math.round(p)}%</text></svg>`;
}

/* ================= CATEGORIAS MATRIZ / FILHO ================= */
const matrizes=tipo=>D.categorias.filter(c=>c.matriz&&c.tipo===tipo&&c.ativo!==false);
const filhosDe=id=>D.categorias.filter(c=>c.parent_id===id&&c.ativo!==false);
function catPorNome(n){return D.categorias.find(c=>c.nome===n)}
function matrizDe(nomeCat){
  const c=catPorNome(nomeCat); if(!c) return 'Sem categoria';
  if(c.matriz) return c.nome;
  return D.categorias.find(x=>x.id===c.parent_id)?.nome||c.nome;
}
function selCatAgrupado(sel,tipo){
  let o='';
  matrizes(tipo).forEach(m=>{
    const f=filhosDe(m.id);
    o+=`<optgroup label="${esc(m.nome)}">`;
    o+=`<option value="${esc(m.nome)}"${m.nome===sel?' selected':''}>${esc(m.nome)} (geral)</option>`;
    f.forEach(x=>{o+=`<option value="${esc(x.nome)}"${x.nome===sel?' selected':''}>${esc(x.nome)}</option>`});
    o+='</optgroup>';
  });
  const soltas=D.categorias.filter(c=>!c.matriz&&!c.parent_id&&c.tipo===tipo);
  if(soltas.length){o+='<optgroup label="Outras">'+soltas.map(x=>`<option value="${esc(x.nome)}"${x.nome===sel?' selected':''}>${esc(x.nome)}</option>`).join('')+'</optgroup>';}
  if(sel&&!D.categorias.some(c=>c.nome===sel)) o=`<option value="${esc(sel)}" selected>${esc(sel)}</option>`+o;
  return o||'<option value="Outros">Outros</option>';
}
function agrupaPorMatriz(porCat){
  const g={};
  Object.entries(porCat).forEach(([nome,v])=>{
    const m=matrizDe(nome);
    if(!g[m])g[m]={total:0,filhos:{}};
    g[m].total+=v; g[m].filhos[nome]=(g[m].filhos[nome]||0)+v;
  });
  return Object.entries(g).sort((a,b)=>b[1].total-a[1].total);
}

/* ================= CÁLCULOS ================= */
function caixaMes(a,m){
  let t=0;const pp={};
  D.parcelas.filter(p=>p.pago&&noMes(p.data_pagamento||p.vencimento,a,m)).forEach(p=>{
    const c=D.contratos.find(x=>x.id===p.contrato_id);if(!c)return;
    t+=+p.valor;pp[c.produto_id]=(pp[c.produto_id]||0)+ +p.valor;});
  D.lancamentos.filter(l=>l.tipo==='entrada'&&l.pago&&noMes(l.data,a,m)).forEach(l=>{
    t+=+l.valor;pp[l.produto_id]=(pp[l.produto_id]||0)+ +l.valor;});
  return {total:t,pp};
}
function despesasMes(a,m){
  let t=0;const pc={};
  D.lancamentos.filter(l=>l.tipo==='despesa'&&noMes(l.data,a,m)).forEach(l=>{
    t+=+l.valor;pc[l.categoria]=(pc[l.categoria]||0)+ +l.valor;});
  return {total:t,pc};
}
const aPagar=(a,m)=>D.lancamentos.filter(l=>l.tipo==='despesa'&&!l.pago&&noMes(l.data,a,m)).reduce((s,l)=>s+ +l.valor,0);
const pagoMes=(a,m)=>D.lancamentos.filter(l=>l.tipo==='despesa'&&l.pago&&noMes(l.data,a,m)).reduce((s,l)=>s+ +l.valor,0);
function faturaCartao(id,a,m){
  const ref=new Date(a,m,1);let t=0;
  D.parcelamentos.filter(p=>p.cartao_id===id).forEach(p=>{
    const n=dif(dObj(p.primeira_competencia),ref);if(n>=0&&n<p.total_parcelas)t+=+p.valor_parcela;});
  D.assinaturas.filter(x=>x.cartao_id===id&&x.ativo!==false).forEach(x=>t+=+x.valor);
  return t;
}
const faturaTotal=(a,m)=>D.cartoes.reduce((s,c)=>s+faturaCartao(c.id,a,m),0);
const impostoMes=()=>(+D.config.base_declarada||0)*(+D.config.aliquota||0)/100;
const eCaixa=i=>/caixa|conta|corrente/i.test(i.tipo||'');
const somaCaixa=()=>D.investimentos.filter(eCaixa).reduce((s,i)=>s+ +i.valor,0)+(+D.config.caixa_empresa||0);
const somaInvestido=()=>D.investimentos.filter(i=>!eCaixa(i)).reduce((s,i)=>s+ +i.valor,0);
const reservaTotal=()=>somaCaixa()+somaInvestido();

function metaDoMes(a,m){
  const r=D.metas_mes.find(x=>x.ano_mes===chave(a,m));
  const total=r?+r.total:(+D.config.meta_mensal||0);
  // nulo fica nulo: significa "calcular proporcional aos dias do bloco"
  const s=[r?.s1,r?.s2,r?.s3,r?.s4,r?.s5].map(v=>v==null||v===''?null:+v);
  return {total,s,registro:r};
}
/* Divide o mes em blocos de 7 dias corridos. Mes de 28 dias da 4 blocos,
   de 29 a 35 dias da 5, sendo o ultimo mais curto. */
function blocosSemana(a,m){
  const ult=new Date(a,m+1,0).getDate(), b=[];
  for(let d=1;d<=ult;d+=7) b.push([d,Math.min(d+6,ult)]);
  return b;
}
function abertas(){
  return D.parcelas.filter(p=>!p.pago).map(p=>{
    const c=D.contratos.find(x=>x.id===p.contrato_id);
    return {...p,contrato:c,mentorado:c?D.mentorados.find(x=>x.id===c.mentorado_id):null,d:dias(p.vencimento)};
  }).filter(p=>p.contrato&&p.contrato.status!=='cancelado').sort((a,b)=>String(a.vencimento).localeCompare(String(b.vencimento)));
}
function previsao(n){
  const r=[],ab=abertas();
  for(let i=0;i<n;i++){const d=new Date(ANO,MES+i,1);
    r.push({mes:`${MESC[d.getMonth()]}/${String(d.getFullYear()).slice(2)}`,
      valor:ab.filter(p=>noMes(p.vencimento,d.getFullYear(),d.getMonth())).reduce((s,p)=>s+ +p.valor,0)});}
  return r;
}
function semanas(a,m){
  const ult=new Date(a,m+1,0).getDate();
  const faixas=blocosSemana(a,m);
  const M=metaDoMes(a,m); let acum=0;
  return faixas.map(([i,f],k)=>{
    const dias=f-i+1;
    // meta da semana: o que você digitou, ou o proporcional aos dias do bloco
    const alvo = M.s[k]!=null ? M.s[k] : M.total*dias/ult;
    const fixa = M.s[k]!=null;
    let v=0;
    D.parcelas.filter(p=>p.pago&&noMes(p.data_pagamento||p.vencimento,a,m)).forEach(p=>{
      const dd=dObj(p.data_pagamento||p.vencimento).getDate();if(dd>=i&&dd<=f)v+=+p.valor;});
    D.lancamentos.filter(l=>l.tipo==='entrada'&&l.pago&&noMes(l.data,a,m)).forEach(l=>{
      const dd=dObj(l.data).getDate();if(dd>=i&&dd<=f)v+=+l.valor;});
    acum+=v;
    return {n:k+1,ini:i,fim:f,dias,valor:v,alvo,fixa,
            pct:alvo?v/alvo*100:0,acum,pctAcum:M.total?acum/M.total*100:0};
  });
}
function repasseAno(a){
  const meses=(D.config.repasse_meses||'1,4,7,10').split(',').map(x=>+x.trim()-1).filter(x=>x>=0&&x<12);
  const fw=D.produtos.find(p=>/framework/i.test(p.nome));
  return meses.map(m=>{
    let base=0;
    for(let k=1;k<=3;k++){const d=new Date(a,m-k,1);
      const cx=caixaMes(d.getFullYear(),d.getMonth());
      base+=fw?(cx.pp[fw.id]||0):cx.total;}
    return {mes:m,base,provisao:base*0.25,passou:new Date(a,m+1,0)<HOJE};
  });
}

/* ================= AGENTE ================= */
function agenteLocal(){
  const A=[];
  const cx=caixaMes(ANO,MES), dp=despesasMes(ANO,MES);
  const fat=faturaTotal(ANO,MES), imp=impostoMes(), M=metaDoMes(ANO,MES);
  const ab=abertas(), atr=ab.filter(p=>p.d<0);
  const hoje=HOJE.getDate(), ult=new Date(ANO,MES+1,0).getDate();
  const mesAtual=(ANO===HOJE.getFullYear()&&MES===HOJE.getMonth());
  const res=cx.total-dp.total;
  A.push(['bom',`<strong>Resultado de ${MESES[MES]}: ${rs(res)}.</strong> Entrou ${rs(cx.total)} e saiu ${rs(dp.total)}. Margem de ${cx.total?(res/cx.total*100).toFixed(1):'0'}%.`]);
  if(M.total>0&&mesAtual&&hoje>3){
    const proj=cx.total/hoje*ult, falta=Math.max(0,M.total-cx.total), restam=Math.max(1,ult-hoje);
    A.push([proj<M.total*0.95?'atencao':'bom',proj<M.total*0.95
      ?`<strong>Ritmo abaixo da meta.</strong> No passo atual o mês fecha em ${rsc(proj)}, ${rsc(M.total-proj)} abaixo. Faltam ${rsc(falta)} em ${restam} dias, ou ${rsc(falta/restam)} por dia.`
      :`<strong>Ritmo acima da meta.</strong> No passo atual o mês fecha em ${rsc(proj)}.`]);
  }
  if(atr.length){const v=atr.reduce((s,p)=>s+ +p.valor,0);const pior=atr.reduce((a,b)=>a.d<b.d?a:b);
    A.push(['critico',`<strong>${atr.length} parcelas vencidas somando ${rs(v)}.</strong> A mais antiga é de ${esc(pior.mentorado?.nome||'sem nome')}, há ${-pior.d} dias.`]);}
  const mrrDe=l=>l.reduce((s,c)=>s+ +c.valor_total/Math.max(1,c.meses),0);
  const venc=D.contratos.filter(c=>c.status==='ativo'&&dias(c.data_fim)<0);
  const prox=D.contratos.filter(c=>c.status==='ativo'&&dias(c.data_fim)>=0&&dias(c.data_fim)<=30);
  if(venc.length) A.push(['critico',`<strong>${venc.length} contratos venceram e seguem como ativos</strong>, ${rsc(mrrDe(venc))} de MRR que pode já ter saído.`]);
  if(prox.length) A.push(['atencao',`<strong>${prox.length} contratos vencem em 30 dias</strong>, ${rsc(mrrDe(prox))} de MRR em risco.`]);
  const g=agrupaPorMatriz(dp.pc);
  if(g.length) A.push(['info',`<strong>Maior bloco de despesa: ${esc(g[0][0])}, ${rs(g[0][1].total)}</strong>, ${(g[0][1].total/dp.total*100).toFixed(0)}% do mês.`]);
  const ap=aPagar(ANO,MES);
  if(ap>0) A.push(['atencao',`<strong>${rs(ap)} ainda a pagar.</strong> Com ${rsc(cx.total)} recebido, o caixa do mês ${cx.total>=ap?'cobre':'não cobre'}.`]);
  const novos=D.parcelamentos.filter(p=>noMes(p.primeira_competencia,ANO,MES));
  if(novos.length) A.push(['critico',`<strong>${novos.length} parcelamentos novos neste mês</strong>, criando ${rs(novos.reduce((s,p)=>s+ +p.valor_parcela*p.total_parcelas,0))} de compromisso futuro.`]);
  else if(D.parcelamentos.length) A.push(['bom',`<strong>Zero parcelamento novo em ${MESES[MES]}.</strong> Mantendo assim a fatura cai sozinha.`]);
  if(imp>0) A.push(['info',`<strong>Provisionar ${rs(imp)} de imposto</strong>, ${D.config.aliquota}% sobre ${rsc(D.config.base_declarada)}.`]);
  const custo=dp.total||(fat+imp);
  if(custo>0){const m=reservaTotal()/custo;
    A.push([m<3?'critico':'bom',`<strong>Reserva de ${m.toFixed(1)} mês(es).</strong> ${rsc(reservaTotal())} contra custo mensal de ${rsc(custo)}. O alvo de 3 meses seria ${rsc(custo*3)}.`]);}
  return A;
}
function dadosParaIA(){
  const cx=caixaMes(ANO,MES), dp=despesasMes(ANO,MES);
  const hist=[];
  for(let i=5;i>=0;i--){const d=new Date(ANO,MES-i,1);
    const c=caixaMes(d.getFullYear(),d.getMonth()), s=despesasMes(d.getFullYear(),d.getMonth());
    hist.push({mes:`${MESC[d.getMonth()]}/${d.getFullYear()}`,recebido:Math.round(c.total),despesas:Math.round(s.total),resultado:Math.round(c.total-s.total)});}
  const M=metaDoMes(ANO,MES);
  return {
    mes:`${MESES[MES]} ${ANO}`, hoje:HOJE.getDate(),
    caixa_recebido:Math.round(cx.total),
    recebido_por_produto:Object.fromEntries(Object.entries(cx.pp).map(([k,v])=>[nomeProd(k),Math.round(v)])),
    despesas_total:Math.round(dp.total),
    despesas_por_matriz:Object.fromEntries(agrupaPorMatriz(dp.pc).map(([k,v])=>[k,Math.round(v.total)])),
    a_pagar:Math.round(aPagar(ANO,MES)), ja_pago:Math.round(pagoMes(ANO,MES)),
    meta_total:M.total, meta_semanal:M.s,
    semanas:semanas(ANO,MES).map(s=>({semana:s.n,recebido:Math.round(s.valor),alvo:Math.round(s.alvo),pct:Math.round(s.pct)})),
    historico_6_meses:hist,
    contratos:{ativos:D.contratos.filter(c=>c.status==='ativo').length,
      cancelados:D.contratos.filter(c=>c.status==='cancelado').length,
      mrr:Math.round(D.contratos.filter(c=>c.status==='ativo').reduce((s,c)=>s+ +c.valor_total/Math.max(1,c.meses),0)),
      vencidos_ainda_ativos:D.contratos.filter(c=>c.status==='ativo'&&dias(c.data_fim)<0).length,
      vencem_30_dias:D.contratos.filter(c=>c.status==='ativo'&&dias(c.data_fim)>=0&&dias(c.data_fim)<=30).length},
    recebiveis:{em_aberto:Math.round(abertas().reduce((s,p)=>s+ +p.valor,0)),
      vencidos:Math.round(abertas().filter(p=>p.d<0).reduce((s,p)=>s+ +p.valor,0)),
      vencidos_qtd:abertas().filter(p=>p.d<0).length},
    previsao_6_meses:previsao(6),
    cartoes:D.cartoes.map(c=>({nome:c.nome,fatura_mes:Math.round(faturaCartao(c.id,ANO,MES)),
      fatura_em_3m:Math.round(faturaCartao(c.id,ANO,MES+3)),
      parcelamentos:D.parcelamentos.filter(p=>p.cartao_id===c.id).length})).filter(c=>c.fatura_mes>0),
    parcelamentos_novos_no_mes:D.parcelamentos.filter(p=>noMes(p.primeira_competencia,ANO,MES))
      .map(p=>({descricao:p.descricao,parcela:+p.valor_parcela,total:p.total_parcelas})),
    reserva:{caixa:Math.round(somaCaixa()),investido:Math.round(somaInvestido()),total:Math.round(reservaTotal())},
    imposto_provisionado:Math.round(impostoMes()),
    repasse_sociedade:repasseAno(ANO).map(r=>({mes:MESES[r.mes],provisao:Math.round(r.provisao),passou:r.passou}))
  };
}
async function rodarIA(){
  const url=D.config.agente_url;
  if(!url) return toast('Configure a URL do agente em Configurações.',true);
  IA={estado:'rodando',itens:[],erro:''}; verDash();
  const dados=dadosParaIA();
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(url,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token||SUPABASE_KEY}`},
      body:JSON.stringify({modo:'analise',mes:`${MESES[MES]} ${ANO}`,dados,
        automaticos:agenteLocal().map(([n,t])=>t.replace(/<[^>]+>/g,''))})});
    const j=await r.json();
    if(j.erro) throw new Error(j.erro);
    const itens=j.apontamentos||[];
    IA={estado:'pronto',itens,erro:''};
    // guarda no historico
    const {data,error}=await sb.from('analises').insert({
      ano_mes:chave(ANO,MES), apontamentos:itens, contexto:dados, modelo:'claude'
    }).select().single();
    if(error) toast('Análise pronta, mas não consegui salvar no histórico: '+error.message,true);
    else D.analises.unshift(data);
  }catch(e){IA={estado:'erro',itens:[],erro:String(e.message||e)};}
  verDash();
}
</script>
<script>
/* ================= RENDER ================= */
function desenhar(){
  ({dash:verDash,contr:verContratos,receb:verRecebiveis,desp:verDespesas,
    lanc:verLancamentos,cart:verCartoes,inv:verInvestimentos,conf:verConfig})[ABA]();
  rotularTabelas();
}
const hero=(t,v,s,c,extra)=>`<div class="hero ${c||''}"><div class="t">${t}</div><div class="v num">${v}</div><div class="s">${s||''}</div>${extra||''}</div>`;
const kpi=(t,v,s,c,onclick)=>`<div class="kpi${onclick?' clic':''}"${onclick?` onclick="${onclick}" role="button" tabindex="0" onkeydown="if(event.key==='Enter'){${onclick}}"`:''}><div class="t">${t}</div><div class="v ${c||''}">${v}</div><div class="s">${s||''}</div></div>`;
const tag=(t,c)=>`<span class="tag ${c||''}">${t}</span>`;

function syncHtml(){
  const q=SYNC.quando?`${String(SYNC.quando.getHours()).padStart(2,'0')}:${String(SYNC.quando.getMinutes()).padStart(2,'0')}`:'';
  const txt = SYNC.estado==='rodando' ? 'Lendo a planilha…'
    : SYNC.estado==='erro' ? `Planilha: ${esc(SYNC.erro)}`
    : SYNC.estado==='ok' ? `Planilha sincronizada às ${q}${SYNC.resumo?' · '+esc(SYNC.resumo):''}`
    : 'Planilha ainda não sincronizada';
  return `<div class="sync ${SYNC.estado}"><span class="pt"></span><span>${txt}</span><button class="btnv sm" onclick="sincronizarPlanilha({manual:true})" ${SYNC.estado==='rodando'?'disabled':''}>${ICO.sync} Atualizar</button></div>`;
}

function verDash(){
  const cx=caixaMes(ANO,MES), dp=despesasMes(ANO,MES);
  const fat=faturaTotal(ANO,MES), ap=aPagar(ANO,MES), pg=pagoMes(ANO,MES);
  const ab=abertas(), atr=ab.filter(p=>p.d<0), noM=ab.filter(p=>p.d>=0&&p.d<=30);
  const res=cx.total-dp.total, sm=semanas(ANO,MES), M=metaDoMes(ANO,MES);
  const pct=M.total?Math.min(100,cx.total/M.total*100):0;
  const falta=Math.max(0,M.total-cx.total);
  const mesAtual=(ANO===HOJE.getFullYear()&&MES===HOJE.getMonth());
  const restam=mesAtual?Math.max(0,new Date(ANO,MES+1,0).getDate()-HOJE.getDate()):0;
  const chips=Object.entries(cx.pp).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])
    .map(([k,v],i)=>tag(`${esc(nomeProd(k))} ${rsc(v)}`,i===0?'ok':'')).join('');

  let h=`<div class="rotulo" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px"><span style="font-size:15px;font-weight:800;color:var(--ink)">${MESES[MES]} ${ANO}</span>${syncHtml()}</div>
  <div class="cartao anel" style="margin-bottom:12px">
    ${anel(pct)}
    <div>
      <div class="rotulo">Recebido em ${MESES[MES]}</div>
      <div class="vv">${rsc(cx.total)}</div>
      <div class="rotulo" style="font-weight:500;margin-top:4px">${M.total?`de uma meta de <b class="num">${rsc(M.total)}</b>${falta>0?` · faltam ${rsc(falta)}${mesAtual?` em ${restam} dias`:''}`:' · meta batida'}`:'sem meta definida para o mês'}</div>
      ${chips?`<div class="chips">${chips}</div>`:''}
    </div>
  </div>
  <div class="grade g2">
    ${hero('Caixa da empresa',rsc(reservaTotal()),`${rsc(somaCaixa())} em conta + ${rsc(somaInvestido())} investido`,'big')}
    ${hero('Resultado do mês',rsc(res),`recebido menos despesas de ${rsc(dp.total)}${cx.total?` · margem ${(res/cx.total*100).toFixed(0)}%`:''}`,res>=0?'':'r')}
  </div>
  <div class="grade g4" style="margin-top:12px">
    ${kpi('A receber em 30 dias',rsc(noM.reduce((s,p)=>s+ +p.valor,0)),`${noM.length} parcelas a vencer`,'',"irPara('receb')")}
    ${kpi('Vencido',rsc(atr.reduce((s,p)=>s+ +p.valor,0)),`${atr.length} parcelas atrasadas`,atr.length?'neg':'',"irPara('receb')")}
    ${kpi('Pago no mês',rsc(pg),'despesas quitadas','',"irPara('desp')")}
    ${kpi('Ainda a pagar',rsc(ap),'despesas em aberto',ap?'av':'',"irPara('desp')")}
  </div>

  <h2>Meta do mês <span class="rotulo">clique nos valores para ajustar</span></h2>
  <div class="cartao">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px">
      <span class="num" style="font-size:24px;font-weight:800">${rsc(cx.total)}</span>
      <span class="rotulo">meta <input class="ed n" style="width:120px;display:inline-block" type="number" step="100" value="${M.total}" onchange="salvarMeta('total',this.value)"> · ${pct.toFixed(0)}%</span>
    </div>
    <div class="barra"><i style="width:${pct}%"></i></div>
    <div class="sem">${sm.map((s,k)=>`<div class="c">
      <div class="lb">Semana ${s.n} · dia ${s.ini} a ${s.fim}${s.dias<7?` · ${s.dias} dias`:''}</div>
      <div class="vv">${rsc(s.valor)}</div>
      <div class="barra ${s.pct>=100?'':s.pct>=60?'a':'r'}" style="height:5px;margin-top:6px"><i style="width:${Math.min(100,s.pct)}%"></i></div>
      <div class="pp">meta <input type="number" step="100" value="${Math.round(s.alvo)}" title="${s.fixa?'meta fixada por você. Apague para voltar ao proporcional':'proporcional aos dias do bloco'}" onchange="salvarMeta('s${k+1}',this.value)">${s.fixa?'':' <span style="opacity:.6">auto</span>'}</div>
      <div class="pp">${s.pct.toFixed(0)}% da semana · ${s.pctAcum.toFixed(0)}% acumulado</div></div>`).join('')}</div>
    <p class="nota">O mês é dividido em blocos de 7 dias corridos, então mês de 29 dias ou mais tem 5 semanas, a última mais curta. A meta marcada como “auto” acompanha os dias do bloco. Digitou um valor, ele fica fixo. Apagou, volta ao automático.</p>
  </div>

  <div class="grade g2" style="margin-top:22px">
    <div class="cartao"><h2>Despesas por categoria <span class="rotulo">${MESES[MES]}</span></h2><div class="combo">
      <div class="grafico"><canvas id="gDesp" role="img" aria-label="Despesas do mês por categoria matriz"></canvas></div>
      <div class="leg" id="legDesp"></div>
    </div></div>
    <div class="cartao"><h2>Previsão de recebimento <span class="rotulo">próximos 6 meses</span></h2>
      <div class="grafico"><canvas id="gPrev" role="img" aria-label="Previsão de recebimento dos próximos seis meses"></canvas></div>
      <div class="leg" id="legPrev" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="grade g2" style="margin-top:12px">
    <div class="cartao"><h2>Reserva <button class="btnv sm dir" onclick="irPara('inv')">Editar carteiras</button></h2><div class="leg">
      ${[...D.investimentos].sort((a,b)=>+b.valor-+a.valor).map((i,k)=>`<div class="it">
        <span class="pt" style="background:${CORES[k%CORES.length]}"></span>
        <span class="nm">${esc(i.banco)} <span class="rotulo" style="font-size:12px;font-weight:500">${esc(i.tipo||'')}</span></span>
        <span class="vl">${rs(i.valor)}</span><span class="pc">${reservaTotal()?(+i.valor/reservaTotal()*100).toFixed(0):0}%</span></div>`).join('')
        ||'<div class="vazio">Nenhuma carteira cadastrada.</div>'}
      <div class="tot"><span>Reserva total</span><span>${rs(reservaTotal())}</span></div></div></div>
    <div class="cartao"><h2>Faturas de cartão <span class="rotulo">${MESES[MES]}</span> <button class="btnv sm dir" onclick="irPara('cart')">Ver por cartão</button></h2><div class="leg">
      ${D.cartoes.map(c=>{const f=faturaCartao(c.id,ANO,MES);return f>0?`<div class="it">
        <span class="pt" style="background:${c.escopo==='empresa'?'var(--c1)':'var(--c3)'}"></span>
        <span class="nm">${esc(c.nome)} <span class="rotulo" style="font-size:12px;font-weight:500">vence dia ${c.dia_vencimento}</span></span>
        <span class="vl">${rs(f)}</span><span class="pc">${fat?(f/fat*100).toFixed(0):0}%</span></div>`:''}).join('')
        ||'<div class="vazio">Sem fatura projetada.</div>'}
      <div class="tot"><span>Total</span><span>${rs(fat)}</span></div></div></div>
  </div>

  <h2>Repasse da sociedade <span class="rotulo">${ANO} · 25% do Framework dos 3 meses anteriores</span></h2>
  <div class="cartao p0 rolagem"><table><thead><tr>
    <th>Mês</th><th class="d">Sugestão do painel</th><th class="d">Valor do repasse</th><th>Observação</th><th>Situação</th>
  </tr></thead><tbody>${repasseAno(ANO).map(r=>{
    const k=chave(ANO,r.mes), reg=D.repasses.find(x=>x.ano_mes===k)||{};
    return `<tr>
    <td class="nome">${MESES[r.mes]} ${r.passou?tag('passou'):MES===r.mes?tag('este mês','al'):''}</td>
    <td class="d mut">${rsc(r.provisao)}</td>
    <td class="d"><input class="ed n" style="width:118px" type="number" step="0.01" value="${reg.valor??''}" placeholder="${Math.round(r.provisao)}" onchange="salvarRepasse('${k}','valor',this.value)"></td>

/* Regera as parcelas em aberto a partir do valor cheio e do numero de parcelas.
   O que ja foi pago fica intacto. */
async function regerar(id){
  const c=D.contratos.find(x=>x.id===id); if(!c) return;
  const rec=recebidoDe(id), saldo=+c.valor_total-rec, n=+c.parcelas_saldo||0;
  if(saldo<0) return toast(`O valor cheio está menor que os ${rs(rec)} já recebidos.`,true);
  if(saldo>0&&!n) return toast('Informe em quantas parcelas fica o saldo na coluna Parc.',true);
  const m=D.mentorados.find(x=>x.id===c.mentorado_id);
  if(!confirm(`${m?m.nome:'Contrato'}\n\nSaldo de ${rs(saldo)} em ${n} parcelas de ${rs(n?saldo/n:0)}, a partir do próximo mês.\n\nAs parcelas em aberto de hoje serão substituídas. Confirma?`)) return;

  const abertasId=D.parcelas.filter(p=>p.contrato_id===id&&!p.pago).map(p=>p.id);
  if(abertasId.length){
    const {error}=await sb.from('parcelas').delete().in('id',abertasId);
    if(error) return toast('Erro ao limpar: '+error.message,true);
    D.parcelas=D.parcelas.filter(p=>!abertasId.includes(p.id));
  }
  if(saldo>0&&n>0){
    const di=new Date(HOJE.getFullYear(),HOJE.getMonth()+1,10);
    const pagas=D.parcelas.filter(p=>p.contrato_id===id).length;
    const base=Math.floor(saldo/n*100)/100, novas=[];
    for(let i=0;i<n;i++){
      const v=new Date(di.getFullYear(),di.getMonth()+i,10);
      novas.push({contrato_id:id,numero:pagas+i+1,
        valor:i===n-1?+(saldo-base*(n-1)).toFixed(2):base,vencimento:iso(v),pago:false});
    }
    const {data,error}=await sb.from('parcelas').insert(novas).select();
    if(error) return toast('Erro ao gerar: '+error.message,true);
    D.parcelas.push(...(data||[]));
    const fim=new Date(di.getFullYear(),di.getMonth()+n-1,10);
    await sb.from('contratos').update({entrada:rec,meses:n+1,revisado:true,data_fim:iso(fim)}).eq('id',id);
    Object.assign(c,{entrada:rec,meses:n+1,revisado:true,data_fim:iso(fim)});
    toast(`${n} parcelas de ${rs(saldo/n)} geradas.`);
  } else {
    toast('Contrato quitado, sem parcelas em aberto.');
  }
  desenhar();
}

async function novoContrato(){
  const nome=document.getElementById('cnNome').value.trim();
  const produto_id=document.getElementById('cnProd').value;
  const valor=+document.getElementById('cnValor').value||0;
  const entrada=+document.getElementById('cnEntrada').value||0;
  const meses=Math.max(1,+document.getElementById('cnMeses').value||1);
  const nParc=Math.max(0,+document.getElementById('cnParc').value||0);
  const ini=document.getElementById('cnIni').value;
  if(!nome)return toast('Informe o nome.',true);
  if(!valor)return toast('Informe o valor cheio.',true);
  if(entrada>valor)return toast('A entrada não pode ser maior que o valor cheio.',true);
  const {data:m,error:e1}=await sb.from('mentorados').insert({nome,produto_id,
    calls_contratadas:+document.getElementById('cnCalls').value||0}).select().single();
  if(e1)return toast('Erro: '+e1.message,true);
  const di=dObj(ini), df=new Date(di.getFullYear(),di.getMonth()+meses,di.getDate());
  const {data:c,error:e2}=await sb.from('contratos').insert({mentorado_id:m.id,produto_id,
    valor_total:valor,entrada,meses,parcelas_saldo:nParc,revisado:true,
    data_inicio:ini,data_fim:iso(df)}).select().single();
  if(e2)return toast('Erro no contrato: '+e2.message,true);
  const ps=[]; let nn=0;
  if(entrada>0) ps.push({contrato_id:c.id,numero:++nn,valor:entrada,vencimento:ini,pago:true,data_pagamento:ini});
  const saldo=valor-entrada;
  if(saldo>0&&nParc>0){
    const base=Math.floor(saldo/nParc*100)/100;
    for(let i=0;i<nParc;i++){const v=new Date(di.getFullYear(),di.getMonth()+i+1,di.getDate());
      ps.push({contrato_id:c.id,numero:++nn,
        valor:i===nParc-1?+(saldo-base*(nParc-1)).toFixed(2):base,
        vencimento:iso(v),pago:false});}
  }
  const {data:pp}=await sb.from('parcelas').insert(ps).select();
  D.mentorados.push(m);D.contratos.push(c);D.parcelas.push(...(pp||[]));
  ['cnNome','cnValor'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('cnEntrada').value='0';
  toast(`${nome} adicionado. Entrada ${rs(entrada)} e ${nParc} parcelas de ${rs(nParc?(valor-entrada)/nParc:0)}.`);
  desenhar();
}
async function mudaStatus(id,st){

  if(error)return toast('Erro: '+error.message,true);

  if(st==='cancelado'&&c){const m=D.mentorados.find(x=>x.id===c.mentorado_id);
    if(m){await sb.from('mentorados').update({status:'cancelado'}).eq('id',m.id);m.status='cancelado';}}
  toast('Salvo.');desenhar();
}

    const c=D.contratos.find(x=>x.id===p.contrato_id);
    return {...p,tipo:'parcela',contrato:c,mentorado:c?D.mentorados.find(x=>x.id===c.mentorado_id):null};
  });
  const recLanc=D.lancamentos.filter(l=>l.tipo==='entrada'&&l.pago&&noMes(l.data,ANO,MES))
    .map(l=>({...l,tipo:'lancamento'}));
  const totalRec=recParc.reduce((s,p)=>s+ +p.valor,0)+recLanc.reduce((s,l)=>s+ +l.valor,0);

  // futuras agrupadas por mes
  const futuras={};
  ab.filter(p=>p.d>=0).forEach(p=>{
    const k=String(p.vencimento).slice(0,7);
    (futuras[k]=futuras[k]||[]).push(p);
  });
  const meses=Object.keys(futuras).sort();

  let h=`<div class="grade g4">
    ${kpi('Vencido',rsc(sm(atr)),`${atr.length} parcelas`,atr.length?'neg':'')}
    ${kpi('1 a 30 dias',rsc(sm(f1)),`${f1.length} parcelas`,f1.length?'av':'')}
    ${kpi('31 a 60 dias',rsc(sm(f2)),`${f2.length} parcelas`,f2.length?'av':'')}
    ${kpi('Mais de 60 dias',rsc(sm(f3)),`${f3.length} parcelas`,f3.length?'neg':'')}
  </div>

  <h2>Vencido <span class="rotulo">${atr.length} parcelas · ${rs(sm(atr))}</span></h2>`;
  h+= atr.length ? tabelaParcelas(atr,true) : '<div class="cartao vazio">Nada vencido. Cobrança em dia.</div>';

  h+=`<h2>Recebido em ${MESES[MES]} <span class="rotulo">${rs(totalRec)}</span></h2>`;
  if(!recParc.length&&!recLanc.length) h+='<div class="cartao vazio">Nada baixado neste mês.</div>';
  else{
    h+=`<div class="cartao p0 rolagem"><table class="recebido"><thead><tr>
      <th>Origem</th><th>Data do pagamento</th><th class="d">Valor</th><th class="acoes"></th>
    </tr></thead><tbody>`;
    recParc.sort((a,b)=>+b.valor-+a.valor).forEach(p=>{h+=`<tr>
      <td class="nome"><input class="ed nm" value="${esc(p.mentorado?.nome||'')}" onchange="up('mentorados','${p.mentorado?.id}','nome',this.value)">
        <div class="sub">${esc(nomeProd(p.contrato?.produto_id))} · parcela ${p.numero}</div></td>
      <td><input class="ed dt" type="date" value="${String(p.data_pagamento||p.vencimento).slice(0,10)}" onchange="up('parcelas','${p.id}','data_pagamento',this.value)"></td>
      <td class="d"><input class="ed n lim" type="number" step="0.01" value="${p.valor}" onchange="upNum('parcelas','${p.id}','valor',this.value)"></td>
      <td class="acoes"><button class="btnv sm" onclick="desfazer('${p.id}')">Desfazer</button></td>
    </tr>`;});
    recLanc.sort((a,b)=>+b.valor-+a.valor).forEach(l=>{h+=`<tr>
      <td class="nome"><input class="ed nm" value="${esc(l.descricao||'')}" onchange="up('lancamentos','${l.id}','descricao',this.value)">
        <div class="sub">${esc(nomeProd(l.produto_id))} · ${l.origem==='planilha'?'planilha':'lançamento avulso'}</div></td>
      <td><input class="ed dt" type="date" value="${String(l.data).slice(0,10)}" onchange="up('lancamentos','${l.id}','data',this.value)"></td>
      <td class="d"><input class="ed n lim" type="number" step="0.01" value="${l.valor}" onchange="upNum('lancamentos','${l.id}','valor',this.value)"></td>
      <td class="acoes"><button class="x" onclick="del('lancamentos','${l.id}')" aria-label="Remover">✕</button></td>
    </tr>`;});
    h+=`</tbody></table></div>
    <p class="nota">Desfazer devolve a parcela para em aberto, sem apagar nada. Valor e data são editáveis direto aqui.</p>`;
  }

  h+=`<h2>A vencer <span class="rotulo">${meses.length} meses</span></h2>`;
  if(!meses.length) h+='<div class="cartao vazio">Nenhuma parcela futura cadastrada.</div>';
  else meses.forEach(k=>{
    const [a,m]=k.split('-').map(Number);
    const lista=futuras[k].sort((x,y)=>String(x.vencimento).localeCompare(String(y.vencimento)));
    const total=lista.reduce((s,p)=>s+ +p.valor,0);
    const aberto=REC_ABERTO===k;
    h+=`<div class="cartao p0" style="margin-bottom:8px">
      <button class="cabecalho" onclick="abrirMes('${k}')" aria-expanded="${aberto}">
        <span class="seta ${aberto?'on':''}">▸</span>
        <span style="flex:1;text-align:left"><strong>${MESES[m-1]} ${a}</strong>
          <span class="rotulo" style="display:block;margin-top:2px;font-weight:500">${lista.length} parcela${lista.length>1?'s':''}</span></span>
        <span class="num" style="font-size:18px;font-weight:800;white-space:nowrap">${rs(total)}</span>
      </button>
      <div class="corpo ${aberto?'':'oculto'}">${aberto?tabelaParcelas(lista,false,true):''}</div>
    </div>`;
  });
  document.getElementById('v-receb').innerHTML=h;
}

function tabelaParcelas(lista,vencido,dentro){
  let h=`${dentro?'<div class="rolagem">':'<div class="cartao p0 rolagem">'}<table class="receb"><thead><tr>
    <th>Mentorado</th><th class="d">Parc.</th><th>Vencimento</th>${vencido?'<th>Atraso</th>':''}<th class="d">Valor</th><th class="acoes"></th>
  </tr></thead><tbody>`;
  lista.forEach(p=>{
    const at=-p.d;
    h+=`<tr>
      <td class="nome"><input class="ed nm" value="${esc(p.mentorado?.nome||'')}" onchange="up('mentorados','${p.mentorado?.id}','nome',this.value)">
        <div class="sub">${esc(nomeProd(p.contrato?.produto_id))}</div></td>
      <td class="d"><input class="ed n mini" type="number" value="${p.numero}" onchange="upNum('parcelas','${p.id}','numero',this.value)"></td>
      <td><input class="ed dt" type="date" value="${String(p.vencimento).slice(0,10)}" onchange="up('parcelas','${p.id}','vencimento',this.value)"></td>
      ${vencido?`<td>${at>60?tag('60+ dias','mal'):at>30?tag('31–60 dias','mal'):tag(`${at} dias`,'al')}</td>`:''}
      <td class="d"><input class="ed n lim" type="number" step="0.01" value="${p.valor}" onchange="upNum('parcelas','${p.id}','valor',this.value)"></td>
      <td class="acoes"><button class="btn sm" onclick="baixar('${p.id}')">Baixar</button>

}
function abrirMes(k){REC_ABERTO=(REC_ABERTO===k?null:k);verRecebiveis();rotularTabelas();}
function abrirDespesa(k){DESP_ABERTO=(DESP_ABERTO===k?null:k);verDespesas();rotularTabelas();}
function abrirCategoria(k){CAT_ABERTO=(CAT_ABERTO===k?null:k);verConfig();rotularTabelas();}
async function desfazer(id){
  const {error}=await sb.from('parcelas').update({pago:false,data_pagamento:null}).eq('id',id);
  if(error)return toast('Erro: '+error.message,true);
  const p=D.parcelas.find(x=>x.id===id);if(p){p.pago=false;p.data_pagamento=null;}
  toast('Parcela voltou para em aberto.');desenhar();
}

async function baixar(id){
  const {error}=await sb.from('parcelas').update({pago:true,data_pagamento:iso(HOJE)}).eq('id',id);
  if(error)return toast('Erro: '+error.message,true);
  const p=D.parcelas.find(x=>x.id===id);if(p){p.pago=true;p.data_pagamento=iso(HOJE);}
  toast('Parcela baixada.');desenhar();
}

/* ================= DESPESAS ================= */
function verDespesas(){

  let h=`<div class="grade g4">
    ${kpi('Total do mês',rsc(dp.total),`${desp.length} lançamentos`)}

          <span class="seta ${aberto?'on':''}">▸</span>
          <span class="pt" style="width:10px;height:10px;border-radius:3px;background:${CORES[gi%CORES.length]};flex:none"></span>
          <span style="flex:1;text-align:left;min-width:0"><strong>${esc(m)}</strong>${orfa?' '+tag('arrumar','al'):''}

          <span class="num" style="font-size:18px;font-weight:800;white-space:nowrap">${rs(o.total)}</span>

        <div class="corpo ${aberto?'':'oculto'}">`;

        Object.keys(o.filhos).sort((a,b)=>o.filhos[b]-o.filhos[a]).forEach(cat=>{
          desp.filter(l=>l.categoria===cat).sort((a,b)=>String(a.data).localeCompare(String(b.data))).forEach(l=>{
            h+=`<tr>
              <td class="nome">${orfa
                ? `<select class="ed" onchange="adotarCategoria('${esc(l.categoria)}',this.value)"><option value="">${esc(l.categoria)} → escolher…</option>${matrizes('despesa').map(x=>`<option value="${x.id}">mover para ${esc(x.nome)}</option>`).join('')}</select>`
                : `<span>${esc(l.categoria)}</span>`}${l.origem==='planilha'?`<div class="sub">planilha</div>`:''}</td>
              <td><input class="ed" value="${esc(l.descricao||'')}" onchange="up('lancamentos','${l.id}','descricao',this.value)"></td>
              <td><input class="ed dt" type="date" value="${String(l.data).slice(0,10)}" onchange="up('lancamentos','${l.id}','data',this.value)"></td>
              <td><button class="tag ${l.pago?'ok':'al'}" onclick="up('lancamentos','${l.id}','pago',${!l.pago})">${l.pago?'pago':'a pagar'}</button></td>

    });

  h+=`<h2>Pagamentos fixos <span class="rotulo">repetem todo mês</span></h2>`;

    ?`<div class="linhafina" style="margin-bottom:12px"><span><strong>${pend.length} fixos ainda não lançados</strong> em ${MESES[MES]}, somando ${rs(pend.reduce((s,r)=>s+ +r.valor,0))}.</span><button class="btn sm" onclick="gerarFixos()">Lançar todos</button></div>`
    :(D.recorrencias.length?`<div class="linhafina" style="margin-bottom:12px"><span>Todos os fixos de ${MESES[MES]} já foram lançados.</span></div>`:'');
  h+=`<div class="cartao p0 rolagem"><table><thead><tr>
    <th>Descrição</th><th>Categoria</th><th class="d">Dia</th><th class="d">Valor</th><th>Este mês</th><th class="acoes"></th>
  </tr></thead><tbody>`;
  [...D.recorrencias].sort((a,b)=>(a.dia||0)-(b.dia||0)).forEach(r=>{h+=`<tr>
    <td class="nome"><input class="ed nm" value="${esc(r.descricao)}" onchange="up('recorrencias','${r.id}','descricao',this.value)"></td>

  h+=`</tbody></table></div>
  <div style="margin-top:12px">${caixaForm('fFixo','Novo fixo','cadastre uma vez, repete todo mês',`<div class="formlinha">
    <div class="campo"><label for="fDesc">Descrição</label><input id="fDesc" autocomplete="off"></div>

    <div class="campo"><label for="fValor">Valor</label><input id="fValor" type="number" step="0.01" inputmode="decimal"></div>

    <button class="btn" onclick="novoFixo()">Adicionar fixo</button>
  </div>`)}</div>`;
  document.getElementById('v-desp').innerHTML=h;
}
/* Cria ou reaponta uma categoria orfa para dentro de uma matriz. */
async function adotarCategoria(nome,parent_id){
  if(!parent_id) return;
  const pai=D.categorias.find(c=>c.id===parent_id);
  const ja=D.categorias.find(c=>c.nome===nome);
  if(ja){
    const {error}=await sb.from('categorias').update({parent_id,matriz:false}).eq('id',ja.id);
    if(error) return toast('Erro: '+error.message,true);
    ja.parent_id=parent_id; ja.matriz=false;
  } else {
    const {data,error}=await sb.from('categorias').insert({nome,parent_id,matriz:false,
      tipo:'despesa',escopo:pai?.escopo||'ambos',ordem:99}).select().single();
    if(error) return toast('Erro: '+error.message,true);
    D.categorias.push(data);
  }
  toast(`"${nome}" agora fica em ${pai?pai.nome:'a matriz escolhida'}.`);
  desenhar();
}

async function novoFixo(){
  const cat=document.getElementById('fCat').value;
  const r={descricao:document.getElementById('fDesc').value.trim(),categoria:cat,
    valor:+document.getElementById('fValor').value||0,dia:+document.getElementById('fDia').value||5,
    tipo:'despesa',escopo:/pessoal/i.test(cat)?'pessoal':'empresa'};
  if(!r.descricao)return toast('Informe a descrição.',true);
  if(!r.valor)return toast('Informe o valor.',true);
  const {data,error}=await sb.from('recorrencias').insert(r).select().single();
  if(error)return toast('Erro: '+error.message,true);
  D.recorrencias.push(data);['fDesc','fValor'].forEach(i=>document.getElementById(i).value='');
  toast('Fixo cadastrado.');desenhar();
}
async function gerarFixos(){
  const jaGer=new Set(D.lancamentos.filter(l=>noMes(l.data,ANO,MES)&&l.recorrencia_id).map(l=>l.recorrencia_id));
  const pend=D.recorrencias.filter(r=>r.ativo!==false&&!jaGer.has(r.id));
  if(!pend.length)return toast('Nada pendente.');
  const novos=pend.map(r=>({data:iso(new Date(ANO,MES,Math.min(r.dia||5,28))),competencia:iso(new Date(ANO,MES,1)),
    tipo:r.tipo,categoria:r.categoria,descricao:r.descricao,valor:r.valor,escopo:r.escopo,
    produto_id:r.produto_id,pago:false,recorrencia_id:r.id}));
  const {data,error}=await sb.from('lancamentos').insert(novos).select();
  if(error)return toast('Erro: '+error.message,true);
  D.lancamentos.push(...data);toast(`${data.length} fixos lançados.`);desenhar();
}

/* ================= LANÇAMENTOS ================= */
function filtrados(){
  return D.lancamentos.filter(l=>{
    const d=String(l.data).slice(0,10);
    if(FILTRO.ini||FILTRO.fim){
      if(FILTRO.ini&&d<FILTRO.ini)return false;
      if(FILTRO.fim&&d>FILTRO.fim)return false;
    } else if(!noMes(l.data,ANO,MES)) return false;
    if(FILTRO.tipo&&l.tipo!==FILTRO.tipo)return false;
    if(FILTRO.cat&&matrizDe(l.categoria)!==FILTRO.cat&&l.categoria!==FILTRO.cat)return false;
    return true;
  }).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
}

  if(!lst.length){h+='<div class="cartao vazio">Nenhum lançamento com esses filtros.</div>';document.getElementById('v-lanc').innerHTML=h;return;}

        <td class="nome"><select class="ed" onchange="up('lancamentos','${l.id}','categoria',this.value)">${selCatAgrupado(l.categoria,l.tipo)}</select></td>
        <td><input class="ed" value="${esc(l.descricao||'')}" onchange="up('lancamentos','${l.id}','descricao',this.value)"></td>
        <td>${l.tipo==='entrada'?tag('entrada','ok'):tag('saída')}${l.origem==='planilha'?' '+tag('planilha'):''}</td>
        <td><button class="tag ${l.pago?'ok':'al'}" onclick="up('lancamentos','${l.id}','pago',${!l.pago})">${l.pago?'pago':'a pagar'}</button></td>
        <td class="d"><input class="ed n" style="width:104px" type="number" step="0.01" value="${l.valor}" onchange="upNum('lancamentos','${l.id}','valor',this.value)"></td>

function setFiltro(k,v){FILTRO[k]=v;verLancamentos();rotularTabelas()}
function limparFiltro(){FILTRO={ini:'',fim:'',cat:'',tipo:''};verLancamentos();rotularTabelas()}
function trocaCat(){document.getElementById('lCat').innerHTML=selCatAgrupado('',document.getElementById('lTipo').value)}
async function novoLanc(){

<script>
/* ================= CARTÕES ================= */
function abrirCartao(id){CART_ABERTO=(CART_ABERTO===id?null:id);verCartoes();rotularTabelas();}
function verCartoes(){
  const ref=new Date(ANO,MES,1);
  const restante=D.parcelamentos.reduce((s,p)=>{const n=dif(dObj(p.primeira_competencia),ref);
    return s+(n>=0&&n<p.total_parcelas?+p.valor_parcela*(p.total_parcelas-n):0)},0);
  let h=`<div class="grade g4">
    ${kpi('Fatura total',rsc(faturaTotal(ANO,MES)),`${D.cartoes.length} cartões · ${MESES[MES]}`)}
    ${kpi('Em 3 meses',rsc(faturaTotal(ANO,MES+3)),'sem parcelar mais nada')}
    ${kpi('Em 6 meses',rsc(faturaTotal(ANO,MES+6)),'sem parcelar mais nada')}
    ${kpi('Dívida restante',rsc(restante),'tudo que ainda falta',restante?'av':'')}
  </div>
  <h2>Cada cartão <span class="rotulo">clique para abrir</span></h2>`;
  let algum=false;
  D.cartoes.forEach(c=>{
    const ps=D.parcelamentos.filter(p=>p.cartao_id===c.id).map(p=>{
      const ini=dObj(p.primeira_competencia), n=dif(ini,ref)+1;
      return {...p,atual:n,fim:new Date(ini.getFullYear(),ini.getMonth()+p.total_parcelas-1,1),viva:n>=1&&n<=p.total_parcelas};
    }).filter(p=>p.viva).sort((a,b)=>+b.valor_parcela-+a.valor_parcela);
    const asn=D.assinaturas.filter(a=>a.cartao_id===c.id&&a.ativo!==false);
    const fat=faturaCartao(c.id,ANO,MES);
    if(!ps.length&&!asn.length) return;
    algum=true;
    const falta=ps.reduce((s,p)=>s+ +p.valor_parcela*(p.total_parcelas-p.atual+1),0);
    const livre=ps.length?ps.reduce((a,b)=>a.fim>b.fim?a:b).fim:null;
    const aberto=CART_ABERTO===c.id;
    h+=`<div class="cartao p0" style="margin-bottom:8px">
      <button class="cabecalho" onclick="abrirCartao('${c.id}')" aria-expanded="${aberto}">
        <span class="seta ${aberto?'on':''}">▸</span>
        <span style="flex:1;text-align:left;min-width:0">
          <strong style="font-size:15px">${esc(c.nome)}</strong>
          <span class="rotulo" style="display:block;margin-top:2px;font-weight:500">${esc(c.bandeira||'')}${c.bandeira?' · ':''}vence dia ${c.dia_vencimento} · ${c.escopo}</span>
        </span>
        <span style="text-align:right;white-space:nowrap">
          <span class="num" style="font-size:18px;font-weight:800">${rs(fat)}</span>
          <span class="rotulo" style="display:block;margin-top:2px;font-weight:500">${ps.length} parcelamento${ps.length===1?'':'s'} · falta ${rsc(falta)}${livre?` · livre ${MESC[livre.getMonth()]}/${String(livre.getFullYear()).slice(2)}`:''}</span>
        </span>
      </button>
      <div class="corpo ${aberto?'':'oculto'}">`;
    if(ps.length){
      h+=`<div class="rolagem"><table><thead><tr><th>Compra</th><th>Categoria</th><th class="d">Parcela</th><th>Quita</th><th class="d">Por mês</th><th class="d">Falta</th><th class="acoes"></th></tr></thead><tbody>`;
      ps.forEach(p=>{h+=`<tr>
        <td class="nome"><input class="ed nm" value="${esc(p.descricao)}" onchange="up('parcelamentos','${p.id}','descricao',this.value)"></td>
        <td><input class="ed" value="${esc(p.categoria||'')}" onchange="up('parcelamentos','${p.id}','categoria',this.value)"></td>
        <td class="d">${p.atual}/<input class="ed n" style="width:40px;display:inline-block" type="number" value="${p.total_parcelas}" onchange="upNum('parcelamentos','${p.id}','total_parcelas',this.value)"></td>
        <td class="num">${MESC[p.fim.getMonth()]}/${String(p.fim.getFullYear()).slice(2)}</td>
        <td class="d"><input class="ed n" style="width:96px" type="number" step="0.01" value="${p.valor_parcela}" onchange="upNum('parcelamentos','${p.id}','valor_parcela',this.value)"></td>
        <td class="d">${rs(+p.valor_parcela*(p.total_parcelas-p.atual+1))}</td>
        <td class="acoes"><button class="x" onclick="del('parcelamentos','${p.id}')" aria-label="Remover">✕</button></td></tr>`;});
      h+='</tbody></table></div>';
    }
    if(asn.length) h+=`<div class="leg" style="margin-top:10px">${asn.map(a=>`<div class="it">
      <span class="pt" style="background:var(--ln)"></span><span class="nm">${esc(a.descricao)} <span class="rotulo" style="font-size:12px;font-weight:500">assinatura</span></span>
      <span class="vl">${rs(a.valor)}</span><span class="pc"><button class="x" onclick="del('assinaturas','${a.id}')" aria-label="Remover">✕</button></span></div>`).join('')}</div>`;
    h+='</div></div>';
  });
  if(!algum) h+='<div class="cartao vazio">Nenhum parcelamento ou assinatura ativos neste mês. Leia uma fatura pelo print ou cadastre abaixo.</div>';

  h+=`<h2>Ler fatura pelo print <span class="rotulo">a IA separa parcelamento de assinatura</span></h2>
  <div class="cartao">
    <div class="formlinha" style="margin-bottom:12px">
      <div class="campo" style="flex:0 1 260px"><label for="impCart">Cartão</label><select id="impCart">${D.cartoes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
    </div>
    <label for="impFile" class="dropzona" id="zona" style="display:block;cursor:pointer">
      Clique para escolher os prints da fatura, ou arraste aqui. Até 8 imagens por vez.
    </label>
    <input id="impFile" type="file" accept="image/*" multiple class="oculto" onchange="carregarPrints(this.files)">
    <div class="miniaturas" id="minis"></div>
    <div style="margin-top:14px"><button class="btn" id="btLer" onclick="lerPrints()" ${PRINTS.length?'':'disabled'}>
      ${ICO.ai} ${PRINTS.length?`Ler ${PRINTS.length} print(s) com IA`:'Escolha os prints primeiro'}</button></div>
    <div id="resultadoImp"></div>
    <p class="nota">A IA lê as imagens e separa parcelamento de assinatura sozinha. Você confere a lista antes de salvar. Precisa da Edge Function publicada.</p>
  </div>

  <div class="grade g2" style="margin-top:22px">
    ${caixaForm('fCart','Novo cartão','',`<div class="formlinha">
      <div class="campo"><label for="kNome">Nome</label><input id="kNome" autocomplete="off"></div>
      <div class="campo"><label for="kBand">Bandeira</label><input id="kBand" autocomplete="off"></div>
      <div class="campo"><label for="kDia">Dia de vencimento</label><input id="kDia" type="number" value="10" min="1" max="28" inputmode="numeric"></div>
      <div class="campo"><label for="kEsc">Escopo</label><select id="kEsc"><option value="pessoal">Pessoal</option><option value="empresa">Empresa</option></select></div>
      <button class="btn" onclick="novoCartao()">Adicionar cartão</button>
    </div>`)}
    ${caixaForm('fParc','Novo parcelamento manual','',`<div class="formlinha">
      <div class="campo"><label for="pCart">Cartão</label><select id="pCart">${D.cartoes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
      <div class="campo"><label for="pDesc">Descrição</label><input id="pDesc" autocomplete="off"></div>
      <div class="campo"><label for="pCat">Categoria</label><input id="pCat" placeholder="Compras" autocomplete="off"></div>
      <div class="campo"><label for="pValor">Valor da parcela</label><input id="pValor" type="number" step="0.01" inputmode="decimal"></div>
      <div class="campo"><label for="pTot">Total de parcelas</label><input id="pTot" type="number" value="10" inputmode="numeric"></div>
      <div class="campo"><label for="pIni">1ª parcela em</label><input id="pIni" type="month" value="${chave(ANO,MES)}"></div>
      <button class="btn" onclick="novoParcelamento()">Adicionar parcelamento</button>
    </div>`)}
  </div>`;
  document.getElementById('v-cart').innerHTML=h;
  const z=document.getElementById('zona');
  if(z){
    z.ondragover=e=>{e.preventDefault();z.classList.add('ativo')};
    z.ondragleave=()=>z.classList.remove('ativo');
    z.ondrop=e=>{e.preventDefault();z.classList.remove('ativo');carregarPrints(e.dataTransfer.files)};
  }
  desenhaMinis();
}
function carregarPrints(files){
  const arr=[...files].filter(f=>f.type.startsWith('image/')).slice(0,8);
  if(!arr.length)return toast('Escolha arquivos de imagem.',true);
  PRINTS=[];let lidos=0;
  arr.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{PRINTS.push({tipo:f.type,dados:String(r.result).split(',')[1],url:r.result});
      if(++lidos===arr.length){desenhaMinis();
        const b=document.getElementById('btLer');if(b){b.disabled=false;b.innerHTML=`${ICO.ai} Ler ${PRINTS.length} print(s) com IA`;}}};
    r.readAsDataURL(f);
  });
}
function desenhaMinis(){
  const el=document.getElementById('minis');if(!el)return;
  el.innerHTML=PRINTS.map(p=>`<img src="${p.url}" alt="">`).join('');
}
async function lerPrints(){
  if(!PRINTS.length)return toast('Escolha os prints primeiro.',true);
  const url=D.config.agente_url;
  if(!url)return toast('Configure a URL do agente em Configurações.',true);
  const b=document.getElementById('btLer'); b.disabled=true; b.innerHTML='<span class="girando"></span>Lendo…';
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(url,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token||SUPABASE_KEY}`},
      body:JSON.stringify({modo:'fatura',mes:`${MESES[MES]} ${ANO}`,
        imagens:PRINTS.map(p=>({tipo:p.tipo,dados:p.dados}))})});
    const j=await r.json();
    if(j.erro) throw new Error(j.erro);
    mostrarLidas(j.linhas||[]);
  }catch(e){
    document.getElementById('resultadoImp').innerHTML=`<div class="alerta critico" style="margin-top:14px"><div><strong>Não consegui ler.</strong><br>${esc(String(e.message||e))}</div></div>`;
  }
  b.disabled=false; b.innerHTML=`${ICO.ai} Ler ${PRINTS.length} print(s) com IA`;
}
let LIDAS=[];
function mostrarLidas(linhas){
  LIDAS=linhas.filter(l=>+l.valor>0);
  const el=document.getElementById('resultadoImp');
  if(!LIDAS.length){el.innerHTML='<div class="vazio">A IA não encontrou linhas legíveis.</div>';return;}
  const parc=LIDAS.filter(l=>l.parcela_total>1), ass=LIDAS.filter(l=>!(l.parcela_total>1));
  el.innerHTML=`<h2>${LIDAS.length} linhas lidas <span class="rotulo">confira antes de salvar</span></h2>
  <div class="rolagem"><table><thead><tr><th>Descrição</th><th>Categoria</th><th class="d">Parcela</th><th class="d">Valor</th><th>Vira</th></tr></thead><tbody>
  ${LIDAS.map((l,i)=>`<tr>
    <td class="nome"><input class="ed nm" value="${esc(l.descricao)}" onchange="LIDAS[${i}].descricao=this.value"></td>
    <td><input class="ed" value="${esc(l.categoria||'Outros')}" onchange="LIDAS[${i}].categoria=this.value"></td>
    <td class="d">${l.parcela_total>1?`<input class="ed n" style="width:36px;display:inline-block" type="number" value="${l.parcela_atual||1}" onchange="LIDAS[${i}].parcela_atual=+this.value">/<input class="ed n" style="width:36px;display:inline-block" type="number" value="${l.parcela_total}" onchange="LIDAS[${i}].parcela_total=+this.value">`:'—'}</td>
    <td class="d"><input class="ed n" style="width:96px" type="number" step="0.01" value="${l.valor}" onchange="LIDAS[${i}].valor=+this.value"></td>
    <td>${l.parcela_total>1?tag('parcelamento','al'):tag('assinatura')}</td>
  </tr>`).join('')}</tbody></table></div>
  <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="salvarLidas()">Salvar ${parc.length} parcelamentos e ${ass.length} assinaturas</button>
  <button class="btnv" onclick="LIDAS=[];document.getElementById('resultadoImp').innerHTML=''">Descartar</button></div>`;
  rotularTabelas();
}
async function salvarLidas(){
  const cartao_id=document.getElementById('impCart').value;
  const parc=LIDAS.filter(l=>l.parcela_total>1).map(l=>{
    const at=Math.max(1,+l.parcela_atual||1);
    return {cartao_id,descricao:l.descricao||'Compra',categoria:l.categoria||'Outros',
      valor_parcela:+l.valor,total_parcelas:+l.parcela_total,
      primeira_competencia:iso(new Date(ANO,MES-(at-1),1)),escopo:'pessoal'};});
  const ass=LIDAS.filter(l=>!(l.parcela_total>1)).map(l=>
    ({cartao_id,descricao:l.descricao||'Lançamento',valor:+l.valor,escopo:'pessoal',ativo:true}));
  if(parc.length){const{data,error}=await sb.from('parcelamentos').insert(parc).select();
    if(error)return toast('Erro: '+error.message,true);D.parcelamentos.push(...data);}
  if(ass.length){const{data,error}=await sb.from('assinaturas').insert(ass).select();
    if(error)return toast('Erro: '+error.message,true);D.assinaturas.push(...data);}
  LIDAS=[];PRINTS=[];toast(`${parc.length+ass.length} linhas salvas.`);desenhar();
}
async function novoCartao(){
  const r={nome:document.getElementById('kNome').value.trim(),bandeira:document.getElementById('kBand').value.trim()||null,
    dia_vencimento:+document.getElementById('kDia').value||10,escopo:document.getElementById('kEsc').value};
  if(!r.nome)return toast('Informe o nome do cartão.',true);
  const {data,error}=await sb.from('cartoes').insert(r).select().single();
  if(error)return toast('Erro: '+error.message,true);
  D.cartoes.push(data);
  await sb.from('categorias').insert({nome:'Cartão · '+r.nome,tipo:'despesa',escopo:r.escopo,
    parent_id:D.categorias.find(c=>c.nome==='Cartões'&&c.matriz)?.id||null,matriz:false,ordem:50});
  const {data:cat}=await sb.from('categorias').select('*');D.categorias=cat||D.categorias;
  document.getElementById('kNome').value='';toast('Cartão adicionado com categoria própria.');desenhar();
}
async function novoParcelamento(){
  const mes=document.getElementById('pIni').value;
  const r={cartao_id:document.getElementById('pCart').value,descricao:document.getElementById('pDesc').value.trim(),
    categoria:document.getElementById('pCat').value.trim()||'Outros',
    valor_parcela:+document.getElementById('pValor').value||0,
    total_parcelas:Math.max(1,+document.getElementById('pTot').value||1),
    primeira_competencia:mes?mes+'-01':null,escopo:'pessoal'};
  if(!r.descricao)return toast('Informe a descrição.',true);
  if(!r.valor_parcela)return toast('Informe o valor da parcela.',true);
  const {data,error}=await sb.from('parcelamentos').insert(r).select().single();
  if(error)return toast('Erro: '+error.message,true);
  D.parcelamentos.push(data);['pDesc','pCat','pValor'].forEach(i=>document.getElementById(i).value='');
  toast('Parcelamento cadastrado.');desenhar();
}

/* ================= INVESTIMENTOS ================= */
function verInvestimentos(){
  const caixa=somaCaixa(), investido=somaInvestido(), total=reservaTotal();
  let h=`<div class="grade g3">
    ${hero('Caixa em conta',rsc(caixa),'carteiras marcadas como caixa mais o saldo informado')}
    ${hero('Total investido',rsc(investido),'tudo que não é caixa')}
    ${hero('Reserva total',rsc(total),'caixa mais investido','big')}
  </div>
  <h2>Evolução mês a mês <span class="rotulo">reserva total e caixa</span></h2>
  <div class="cartao">
    <div class="grafico"><canvas id="gInv" role="img" aria-label="Evolução da reserva mês a mês"></canvas></div>
    <div class="formlinha" style="margin-top:14px;align-items:center">
      <button class="btn sm" onclick="registrarSnapshot()">Registrar posição de ${MESES[MES]}</button>
      <span class="nota" style="margin:0">Registre uma vez por mês para o gráfico crescer.</span>
    </div>
  </div>
  <h2>Por banco <span class="rotulo">tipo “Caixa” conta como conta corrente</span></h2>
  <div class="cartao p0 rolagem"><table><thead><tr>
    <th>Banco</th><th>Tipo</th><th class="d">Valor</th><th class="d">%</th><th>Atualizado</th><th class="acoes"></th>
  </tr></thead><tbody>`;
  [...D.investimentos].sort((a,b)=>+b.valor-+a.valor).forEach(i=>{h+=`<tr>
    <td class="nome"><input class="ed nm" value="${esc(i.banco)}" onchange="up('investimentos','${i.id}','banco',this.value)"></td>
    <td><select class="ed" onchange="up('investimentos','${i.id}','tipo',this.value)">
      ${['Caixa','Reserva','Investimento'].map(t=>`<option value="${t}"${(i.tipo||'')===t?' selected':''}>${t}</option>`).join('')}
      ${['Caixa','Reserva','Investimento'].includes(i.tipo)?'':`<option value="${esc(i.tipo||'')}" selected>${esc(i.tipo||'')}</option>`}
    </select></td>
    <td class="d"><input class="ed n" style="width:120px" type="number" step="0.01" value="${i.valor}" onchange="upNum('investimentos','${i.id}','valor',this.value)"></td>
    <td class="d mut">${total?(+i.valor/total*100).toFixed(1):0}%</td>
    <td><input class="ed dt" type="date" value="${String(i.atualizado_em||'').slice(0,10)}" onchange="up('investimentos','${i.id}','atualizado_em',this.value)"></td>
    <td class="acoes"><button class="x" onclick="del('investimentos','${i.id}')" aria-label="Remover">✕</button></td></tr>`;});
  if(!D.investimentos.length) h+='<tr><td colspan="6" class="vazio">Nenhuma carteira cadastrada. Adicione abaixo.</td></tr>';
  h+=`</tbody></table></div>
  <div style="margin-top:12px">${caixaForm('fInv','Nova carteira','',`<div class="formlinha">
    <div class="campo"><label for="iBanco">Banco</label><input id="iBanco" autocomplete="off"></div>
    <div class="campo"><label for="iTipo">Tipo</label><select id="iTipo"><option>Caixa</option><option selected>Reserva</option><option>Investimento</option></select></div>
    <div class="campo"><label for="iValor">Valor</label><input id="iValor" type="number" step="0.01" inputmode="decimal"></div>
    <button class="btn" onclick="novoInvestimento()">Adicionar carteira</button>
  </div>`)}</div>`;
  document.getElementById('v-inv').innerHTML=h;
  graficoInvestimentos();
}
function graficoInvestimentos(){
  const hist=[...D.investimentos_hist].sort((a,b)=>a.ano_mes.localeCompare(b.ano_mes)).slice(-12);
  if(!hist.length){
    const el=document.getElementById('gInv');
    if(el)el.closest('.grafico').innerHTML='<div class="vazio">Nenhuma posição registrada ainda. Clique no botão abaixo para começar o histórico.</div>';
    return;}
  const lb=hist.map(x=>{const[a,m]=x.ano_mes.split('-');return `${MESC[+m-1]}/${a.slice(2)}`});
  pinta('gInv','line',{labels:lb,datasets:[
    {label:'Reserva total',data:hist.map(x=>+x.caixa+ +x.investido+ +x.reserva),borderColor:'#1C9A5B',backgroundColor:'rgba(28,154,91,.10)',borderWidth:2.4,fill:true,pointRadius:4,pointBackgroundColor:'#1C9A5B',tension:.25},
