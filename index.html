<script>
/* ================= RECEBÍVEIS (cartões) =================
   Sem duplicidade: nos meses que a planilha traz, o faturamento é o da planilha (veja caixaMes).
   Dar baixa numa parcela só tira ela da cobrança e guarda a data em que o dinheiro entrou. */
let CONC_ABERTA=true, REC_IGNORADAS=null;
const ignoradas=()=>{ if(!REC_IGNORADAS){try{REC_IGNORADAS=new Set(JSON.parse(localStorage.getItem('rhino-conc-ignorar')||'[]'));}catch(e){REC_IGNORADAS=new Set();}} return REC_IGNORADAS; };
const salvarIgnoradas=()=>{try{localStorage.setItem('rhino-conc-ignorar',JSON.stringify([...ignoradas()]));}catch(e){}};

/* Cruza as parcelas vencidas com a aba de alunos da planilha: se no mês do vencimento a planilha mostra
   um valor que as baixas do painel ainda não explicam, vira sugestão. Nunca dá baixa sozinho. */
function linhaDoAluno(nome){
  const k=limparAluno(nome), L=ALUNOS.linhas; if(!k||!L.length)return null;
  let c=L.filter(l=>l.chave===k);
  if(!c.length){ const tk=k.split(' ');
    c=L.filter(l=>{const tl=l.chave.split(' ');const [a,b]=tk.length<=tl.length?[tk,tl]:[tl,tk];return a.length>=2&&a.every(t=>b.includes(t));});
    if(c.length!==1) return null; }            // parecido com mais de um aluno: não arrisca
  if(c.length===1) return c[0];
  return {...c[0],vals:Array.from({length:12},(_,i)=>c.reduce((s,l)=>s+(+l.vals[i]||0),0))}; // mesmo aluno em duas linhas
}
function sugestoesPlanilha(){
  if(!ALUNOS.linhas.length) return [];
  const hoje=iso(HOJE), out=[], usado={};
  abertas().filter(p=>String(p.vencimento).slice(0,10)<=hoje&&+String(p.vencimento).slice(0,4)===PLANILHA.ano).forEach(p=>{
    const m=p.mentorado; if(!m)return;
    const linha=linhaDoAluno(m.nome); if(!linha)return;
    const mes=+String(p.vencimento).slice(5,7)-1, naPlanilha=+linha.vals[mes]||0; if(naPlanilha<=0)return;
    const meus=new Set(D.contratos.filter(c=>c.mentorado_id===m.id).map(c=>c.id)), k=m.id+'|'+mes;
    const jaBaixado=D.parcelas.filter(q=>q.pago&&meus.has(q.contrato_id)&&noMes(q.data_pagamento||q.vencimento,PLANILHA.ano,mes)).reduce((s,q)=>s+ +q.valor,0);
    const livre=naPlanilha-jaBaixado-(usado[k]||0);
    if(livre>=+p.valor-0.01){usado[k]=(usado[k]||0)+ +p.valor;out.push({p,mes,naPlanilha,livre:+p.valor,tipo:'cheia'});}
    else if(livre>0.01){usado[k]=(usado[k]||0)+livre;out.push({p,mes,naPlanilha,livre,tipo:'parcial'});}
  });
  return out;
}
function blocoConferencia(){
  if(ALUNOS.estado==='erro') return `<div class="linhafina" style="margin-top:12px"><span>Não consegui ler a aba de alunos da planilha para conferir as parcelas (${esc(ALUNOS.erro)}).</span></div>`;
  const todas=sugestoesPlanilha(), ig=ignoradas(), sug=todas.filter(s=>!ig.has(s.p.id)), ocultas=todas.length-sug.length;
  if(!todas.length) return '';
  const cheias=sug.filter(s=>s.tipo==='cheia'), total=sug.reduce((s,x)=>s+x.livre,0);
  const emAndamento=sug.some(s=>s.mes===HOJE.getMonth()&&PLANILHA.ano===HOJE.getFullYear());
  const linhas=sug.map(s=>{const p=s.p, nome=p.mentorado?.nome||'Sem nome', venc=String(p.vencimento).slice(0,10);
    return `<div class="lrow"><span class="st inf"></span>
      <div class="ds"><b>${esc(nome)}</b><span>parcela ${p.numero} · venceu ${dbr(venc)} · a planilha mostra ${rs(s.naPlanilha)} em ${MESES[s.mes]}</span></div>
      <span class="tg">${s.tipo==='cheia'?tag('bate com a planilha','inf'):tag(`planilha cobre ${rsc(s.livre)}`,'al')}</span>
      <span class="vl">${rs(p.valor)}</span>
      <div class="ac">${s.tipo==='cheia'?`<button class="btn xs" onclick="baixaDireta('${p.id}','${venc}')">Já recebi</button>`:`<button class="btn xs" onclick="abrirBaixa('${p.id}',{valor:${s.livre.toFixed(2)},data:'${venc}'})">Recebi parte</button>`}<button class="btnv xs" onclick="ignorarSugestao('${p.id}')">Ainda não</button></div></div>`;}).join('');
  return `<div class="lsec conc" style="margin-top:12px;border-color:rgba(56,189,248,.35)">
    <button class="lsec-h" onclick="CONC_ABERTA=!CONC_ABERTA;verRecebiveis()"><span class="pt" style="background:var(--info)"></span>
      <span class="nm"><b>Conferência com a planilha</b><span>${sug.length?`${sug.length} parcela${sug.length>1?'s':''} vencida${sug.length>1?'s':''} que a aba de alunos mostra com valor no mês`:'tudo conferido'}${ocultas?` · ${ocultas} marcada${ocultas>1?'s':''} como “ainda não”`:''}</span></span>
      <span class="tt">${rsc(total)}<small>${CONC_ABERTA?'recolher ▴':'conferir ▾'}</small></span></button>
    ${CONC_ABERTA?`${linhas}
      <div class="lfoot"><span class="nota" style="margin:0">“Já recebi” dá baixa na data do vencimento. Não muda o faturamento: ele já está na planilha.${emAndamento?` Em ${MESES[HOJE.getMonth()]} a planilha mistura o que entrou com o que está previsto — confirme um a um.`:''}</span>
      <div class="ac">${ocultas?`<button class="btnv xs" onclick="mostrarIgnoradas()">Mostrar as ${ocultas} ocultas</button>`:''}${cheias.length>1?`<button class="btnv xs" onclick="baixarSugeridas()">Baixar as ${cheias.length} que batem</button>`:''}</div></div>`:''}
  </div>`;
}
function ignorarSugestao(id){ignoradas().add(id);salvarIgnoradas();verRecebiveis();}
function mostrarIgnoradas(){ignoradas().clear();salvarIgnoradas();verRecebiveis();}
async function baixarSugeridas(){
  const sug=sugestoesPlanilha().filter(s=>s.tipo==='cheia'&&!ignoradas().has(s.p.id)); if(!sug.length)return;
  if(!confirm(`Dar baixa em ${sug.length} parcelas (${rs(sug.reduce((s,x)=>s+ +x.p.valor,0))}) na data do vencimento de cada uma?\n\nO faturamento não muda: ele já está na planilha. Isso só tira as parcelas da cobrança.`))return;
  const rsp=await Promise.all(sug.map(s=>sb.from('parcelas').update({pago:true,data_pagamento:String(s.p.vencimento).slice(0,10)}).eq('id',s.p.id)));
  const falha=rsp.find(r=>r.error); if(falha)toast('Erro: '+falha.error.message,true);
  sug.forEach((s,i)=>{if(!rsp[i].error){const p=D.parcelas.find(x=>x.id===s.p.id);if(p){p.pago=true;p.data_pagamento=String(s.p.vencimento).slice(0,10);}}});
  registrar('baixa',`Conferência com a planilha: ${rsp.filter(r=>!r.error).length} parcelas baixadas · ${rs(sug.reduce((s,x)=>s+ +x.p.valor,0))}`);
  toast(`${rsp.filter(r=>!r.error).length} parcelas baixadas. Faturamento inalterado.`);desenhar();
}

/* ---------- baixa de parcela (janela única, usada em Contratos e Recebíveis) ---------- */
function fecharModal(){const m=document.getElementById('modal');if(m)m.remove();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharModal();});
function abrirBaixa(id,pre){
  const p=D.parcelas.find(x=>x.id===id); if(!p)return;
  const c=D.contratos.find(x=>x.id===p.contrato_id), m=c?D.mentorados.find(x=>x.id===c.mentorado_id):null;
  const venc=String(p.vencimento).slice(0,10), hoje=iso(HOJE), vencida=venc<=hoje;
  const data=(pre&&pre.data)||(vencida?venc:hoje), valor=(pre&&pre.valor)||+p.valor;
  fecharModal();
  const el=document.createElement('div'); el.className='modal-bg'; el.id='modal';
  el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Dar baixa na parcela">
    <div class="ctr-top"><div class="avatar sm ${avCls(m?.nome)}">${iniciais(m?.nome)}</div><div class="ctr-name"><b>${esc(m?.nome||'Parcela')}</b><span>parcela ${p.numero} · vence ${dbr(venc)}</span></div><div class="ctr-val"><b>${rs(p.valor)}</b></div></div>
    <label class="ml" for="bxData">Quando o dinheiro entrou?</label>
    <div class="chips" style="margin-bottom:8px"><button type="button" class="chip" onclick="dataBaixa('${hoje}')">Hoje · ${dbr(hoje)}</button>${vencida&&venc!==hoje?`<button type="button" class="chip" onclick="dataBaixa('${venc}')">No vencimento · ${dbr(venc)}</button>`:''}</div>
    <input type="date" id="bxData" value="${data}" max="${hoje}" onchange="notaBaixa('${id}')">
    <label class="ml" for="bxValor">Valor recebido</label>
    <input type="number" id="bxValor" step="0.01" inputmode="decimal" value="${(+valor).toFixed(2)}" oninput="notaBaixa('${id}')">
    <div id="bxNota"></div>
    <div class="modal-act"><button class="btnv" onclick="fecharModal()">Voltar</button><button class="btn" onclick="confirmarBaixa('${id}')">Confirmar baixa</button></div>
  </div>`;
  el.onclick=e=>{if(e.target===el)fecharModal();};
  document.body.appendChild(el); notaBaixa(id);
}
function dataBaixa(d){const i=document.getElementById('bxData');if(i){i.value=d;i.onchange();}}
function notaBaixa(id){
  const p=D.parcelas.find(x=>x.id===id), el=document.getElementById('bxNota'); if(!p||!el)return;
  const d=document.getElementById('bxData').value||iso(HOJE), v=+document.getElementById('bxValor').value||0, [y,mm]=d.split('-').map(Number);
  const daPlanilha=mesDaPlanilha(y,mm-1), resto=+p.valor-v;
  el.innerHTML=(resto>0.005&&v>0?`<div class="garantia aviso"><span class="ic">½</span><div><b>Baixa parcial.</b> Os ${rs(resto)} restantes continuam em aberto, com o mesmo vencimento.</div></div>`:'')
    +(daPlanilha?`<div class="garantia"><span class="ic">✓</span><div><b>Sem duplicidade.</b> O faturamento de ${MESES[mm-1]} vem da planilha; esta baixa só tira a parcela da cobrança.</div></div>`
      :`<div class="garantia neutra"><span class="ic">i</span><div><b>${MESES[mm-1]} ainda não tem receita na planilha.</b> A baixa conta como recebido do mês até a planilha trazer o número — aí passa a valer o dela, sem somar duas vezes.</div></div>`);
}
async function gravarBaixa(p,data,valor){
  const cheio=+p.valor, parcial=valor<cheio-0.005, patch={pago:true,data_pagamento:data,...(parcial?{valor:+valor.toFixed(2)}:{})};
  const {error}=await sb.from('parcelas').update(patch).eq('id',p.id);
  if(error){toast('Erro: '+error.message,true);return false;}
  Object.assign(p,patch);
  {const c=D.contratos.find(x=>x.id===p.contrato_id), m=c?D.mentorados.find(x=>x.id===c.mentorado_id):null;
   registrar('baixa',`Baixa${parcial?' parcial':''}: ${m?.nome||'parcela'} · parcela ${p.numero} · ${rs(valor)} em ${dbr(data)}`,null,{tabela:'parcelas',id:p.id});}
  if(parcial){ // o que faltou vira uma parcela em aberto, com o mesmo número e vencimento
    const {data:novo,error:e2}=await sb.from('parcelas').insert({contrato_id:p.contrato_id,numero:p.numero,valor:+(cheio-valor).toFixed(2),vencimento:String(p.vencimento).slice(0,10),pago:false}).select().single();
    if(e2)toast('Baixa feita, mas o restante não foi criado: '+e2.message,true); else if(novo)D.parcelas.push(novo);
  }
  return true;
}
async function confirmarBaixa(id){
  const p=D.parcelas.find(x=>x.id===id); if(!p)return;
  const data=document.getElementById('bxData').value||iso(HOJE), v=+document.getElementById('bxValor').value||0;
  if(v<=0)return toast('Informe o valor recebido.',true);
  if(v>+p.valor+0.005)return toast(`O valor é maior que a parcela (${rs(p.valor)}). Se a parcela mudou, ajuste em Editar.`,true);
  if(data>iso(HOJE))return toast('A data do recebimento não pode ser no futuro.',true);
  const parcial=v<+p.valor-0.005;
  if(!await gravarBaixa(p,data,v))return;
  fecharModal();
  toast(parcial?`Baixa parcial de ${rs(v)} em ${dbr(data)}. O restante segue em aberto.`:`Parcela baixada em ${dbr(data)}.`);desenhar();
}
async function baixaDireta(id,data){const p=D.parcelas.find(x=>x.id===id);if(!p)return;if(await gravarBaixa(p,data,+p.valor)){toast(`Parcela baixada em ${dbr(data)}. Faturamento inalterado.`);desenhar();}}
function baixar(id){abrirBaixa(id);}
async function desfazer(id){
  const {error}=await sb.from('parcelas').update({pago:false,data_pagamento:null}).eq('id',id);
  if(error)return toast('Erro: '+error.message,true);
  const p=D.parcelas.find(x=>x.id===id);if(p){p.pago=false;p.data_pagamento=null;
    const c=D.contratos.find(x=>x.id===p.contrato_id), m=c?D.mentorados.find(x=>x.id===c.mentorado_id):null;
    registrar('baixa_desfeita',`Baixa desfeita: ${m?.nome||'parcela'} · parcela ${p.numero} · ${rs(p.valor)}`,null,{tabela:'parcelas',id});}
  toast('Parcela voltou para em aberto.');desenhar();
}

function cardParcela(p){ // p vem de abertas(): parcela + contrato + mentorado + d (dias até vencer)
  const nome=p.mentorado?.nome||'Sem nome', at=-p.d;
  const cls=p.d<0?'vencido':p.d<=7?'aviso':'';
  const sit=p.d<0?tag(`${at} dias atrasada`,'mal'):p.d<=7?tag(`vence em ${p.d} d`,'al'):tag('em aberto');
  const editando=REC_EDIT===p.id, encerrado=p.contrato&&p.contrato.status!=='ativo';
  return `<div class="ctr small ${cls}">
    <div class="ctr-top"><div class="avatar sm ${avCls(nome)}">${iniciais(nome)}</div><div class="ctr-name"><b>${esc(nome)}</b><span>${esc(nomeProd(p.contrato?.produto_id))} · parcela ${p.numero}${encerrado?' · contrato encerrado':''}</span></div><div class="ctr-val"><b>${rsc(p.valor)}</b><span>vence ${dbr(p.vencimento)}</span></div></div>
    <div class="ctr-line">${sit}${p.sug?tag('planilha mostra valor','inf'):''}${p.cobrado_em?tag(`cobrado ${dbr(p.cobrado_em)}`,'inf'):''}<span class="sp"></span><button class="btn xs" onclick="abrirBaixa('${p.id}')">Dar baixa</button>${p.d<=3?`<button class="btnv xs" onclick="cobrar('${p.id}')">Cobrar</button>`:''}<button class="btnv xs" onclick="editarParcela('${p.id}')">${editando?'Fechar':'Editar'}</button></div>
    ${editando?`<div class="ctr-edit">
      <div><label>Parcela nº</label><input type="number" value="${p.numero}" onchange="upNum('parcelas','${p.id}','numero',this.value)"></div>
      <div><label>Vencimento</label><input type="date" value="${String(p.vencimento).slice(0,10)}" onchange="up('parcelas','${p.id}','vencimento',this.value)"></div>
      <div><label>Valor</label><input type="number" step="0.01" value="${p.valor}" onchange="upNum('parcelas','${p.id}','valor',this.value)"></div>
      <div class="full" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><button class="btnv xs" onclick="verContrato('${p.contrato_id}')">Ver contrato</button><button class="btnv xs perigo" onclick="del('parcelas','${p.id}')">Remover parcela</button></div></div>`:''}
  </div>`;
}
function cardRecebida(x){ // parcela paga ou entrada avulsa do mês
  if(x.tipo==='parcela'){const nome=x.mentorado?.nome||'Sem nome';
    return `<div class="ctr small pago"><div class="ctr-top"><div class="avatar sm ${avCls(nome)}">${iniciais(nome)}</div><div class="ctr-name"><b>${esc(nome)}</b><span>${esc(nomeProd(x.contrato?.produto_id))} · parcela ${x.numero}</span></div><div class="ctr-val"><b>${rsc(x.valor)}</b><span>pago em ${dbr(x.data_pagamento||x.vencimento)}</span></div></div>
      <div class="ctr-line">${tag('paga','ok')}<span class="sp"></span><button class="btnv xs" onclick="desfazer('${x.id}')">Desfazer</button></div></div>`;}
  const nome=x.descricao||nomeProd(x.produto_id), pl=x.origem==='planilha', editando=REC_EDIT===x.id;
  return `<div class="ctr small pago"><div class="ctr-top"><div class="avatar sm k3">${iniciais(nome)}</div><div class="ctr-name"><b>${esc(nome)}</b><span>${esc(nomeProd(x.produto_id))} · ${pl?'planilha':'lançamento avulso'}</span></div><div class="ctr-val"><b>${rsc(x.valor)}</b><span>${dbr(x.data)}</span></div></div>
    <div class="ctr-line">${pl?tag('planilha','inf'):tag('recebido','ok')}<span class="sp"></span>${pl?'':`<button class="btnv xs" onclick="editarParcela('${x.id}')">${editando?'Fechar':'Editar'}</button><button class="x" onclick="del('lancamentos','${x.id}')" aria-label="Remover">✕</button>`}</div>
    ${editando?`<div class="ctr-edit"><div class="full"><label>Descrição</label><input value="${esc(x.descricao||'')}" onchange="up('lancamentos','${x.id}','descricao',this.value)"></div><div><label>Data</label><input type="date" value="${String(x.data).slice(0,10)}" onchange="up('lancamentos','${x.id}','data',this.value)"></div><div><label>Valor</label><input type="number" step="0.01" value="${x.valor}" onchange="upNum('lancamentos','${x.id}','valor',this.value)"></div></div>`:''}
  </div>`;
}
function editarParcela(id){REC_EDIT=(REC_EDIT===id?null:id);verRecebiveis();}
function verRecebiveis(){
  const sugIds=new Set(sugestoesPlanilha().map(s=>s.p.id));
  const ab=abertas().map(p=>({...p,sug:sugIds.has(p.id)})), q=norm(BUSCA_REC);
  const nomeOk=p=>!q||norm(p.mentorado?.nome).includes(q);
  const atr=ab.filter(p=>p.d<0), f1=ab.filter(p=>p.d>=0&&p.d<=30), f2=ab.filter(p=>p.d>30&&p.d<=60), f3=ab.filter(p=>p.d>60);
  const sm=a=>a.reduce((s,p)=>s+ +p.valor,0);
  const cx=caixaMes(ANO,MES), hojePlanilha=mesDaPlanilha(HOJE.getFullYear(),HOJE.getMonth());
  const recParc=D.parcelas.filter(p=>p.pago&&noMes(p.data_pagamento||p.vencimento,ANO,MES)).map(p=>{
    const c=D.contratos.find(x=>x.id===p.contrato_id);
    return {...p,tipo:'parcela',contrato:c,mentorado:c?D.mentorados.find(x=>x.id===c.mentorado_id):null};}).sort((a,b)=>+b.valor-+a.valor);
  const recLanc=D.lancamentos.filter(l=>l.tipo==='entrada'&&l.pago&&noMes(l.data,ANO,MES)).map(l=>({...l,tipo:'lancamento'})).sort((a,b)=>+b.valor-+a.valor);
  const futuras={}; ab.filter(p=>p.d>=0).forEach(p=>{const k=String(p.vencimento).slice(0,7);(futuras[k]=futuras[k]||[]).push(p);});
  const meses=Object.keys(futuras).sort();
  const nDevedores=new Set(atr.map(p=>p.mentorado?.id)).size;
  const chipsRec=[['atencao',`Vencidas · ${atr.length}`],['pessoas',`Quem me deve · ${nDevedores}`],['30',`Próximos 30 dias · ${f1.length}`],['todas',`Todas a vencer · ${ab.filter(p=>p.d>=0).length}`],['recebidas',`Recebidas no mês · ${recParc.length+recLanc.length}`]];
  const grade=l=>l.length?`<div class="ctrs">${l.map(cardParcela).join('')}</div>`:'<div class="cartao vazio">Nada aqui. Cobrança em dia.</div>';
  let corpo='';
  if(FILTRO_REC==='atencao'){ corpo+=`<div class="sect">Vencidas <span>${atr.length} parcelas</span><span class="tot neg">${rsc(sm(atr))}</span></div>${grade(atr.filter(nomeOk))}`; }
  if(FILTRO_REC==='pessoas'){ corpo+=`<div class="sect">Quem me deve <span>${nDevedores} ${plural(nDevedores,'pessoa','pessoas')} · ${atr.length} parcelas vencidas</span><span class="tot neg">${rsc(sm(atr))}</span></div>${blocoPorPessoa(atr,q)}`; }
  if(FILTRO_REC==='30'){ corpo+=`<div class="sect">Próximos 30 dias <span>${f1.length} parcelas</span><span class="tot">${rsc(sm(f1))}</span></div>${grade(f1.filter(nomeOk))}`; }
  if(FILTRO_REC==='todas'){
    if(!meses.length) corpo+='<div class="cartao vazio">Nenhuma parcela futura cadastrada.</div>';
    meses.forEach((k,i)=>{const [a,m]=k.split('-').map(Number);const lista=futuras[k].filter(nomeOk);const aberto=REC_MES_ABERTO?REC_MES_ABERTO===k:i===0;
      corpo+=`<div class="sect"><button class="btnv xs" onclick="REC_MES_ABERTO='${k}';verRecebiveis()">${aberto?'▾':'▸'}</button>${MESES[m-1]} ${a} <span>${futuras[k].length} parcelas</span><span class="tot">${rsc(sm(futuras[k]))}</span></div>${aberto?grade(lista):''}`;});
  }
  if(FILTRO_REC==='recebidas'){
    corpo+=`<div class="sect">Recebido em ${MESES[MES]} <span>${cx.planilha?'total da planilha':'parcelas baixadas + entradas'}</span><span class="tot pos">${rs(cx.total)}</span></div>`;
    const lista=[...recLanc,...recParc].filter(x=>x.tipo==='lancamento'?(!q||norm(x.descricao).includes(q)):nomeOk(x));
    corpo+=lista.length?`<div class="ctrs">${lista.map(cardRecebida).join('')}</div>`:'<div class="cartao vazio">Nada recebido neste mês ainda.</div>';
    if(cx.planilha) corpo+='<p class="nota">O total do mês é o da planilha. As parcelas baixadas aparecem aqui para você saber quem pagou, mas já estão dentro desse total — não somam de novo.</p>';
  }
  document.getElementById('v-receb').innerHTML=`<div class="grade g4">
    ${kpi('Vencido',rsc(sm(atr)),`${atr.length} parcelas`,atr.length?'neg':'',"setFiltroRec('atencao')")}
    ${kpi('Próximos 30 dias',rsc(sm(f1)),`${f1.length} parcelas`,f1.length?'av':'',"setFiltroRec('30')")}
    ${kpi('31 a 60 dias',rsc(sm(f2)),`${f2.length} parcelas`,'',"setFiltroRec('todas')")}
    ${kpi('Mais de 60 dias',rsc(sm(f3)),`${f3.length} parcelas`,'',"setFiltroRec('todas')")}
  </div>
  ${hojePlanilha?`<div class="garantia" style="margin-top:12px"><span class="ic">✓</span><div><b>Pode dar baixa sem medo de duplicar.</b> O faturamento de cada mês vem da planilha. A baixa aqui só tira a parcela da cobrança e guarda a data em que o dinheiro entrou — não entra de novo no faturamento.</div></div>`
    :`<div class="garantia neutra" style="margin-top:12px"><span class="ic">i</span><div><b>${MESES[HOJE.getMonth()]} ainda não tem receita na planilha.</b> Até ela chegar, as baixas contam como recebido do mês. Quando a planilha trouxer o mês, vale o número dela — sem somar duas vezes.</div></div>`}
  ${blocoConferencia()}
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px">${chips(chipsRec,FILTRO_REC,'data-fr')}<span style="flex:1"></span>${busca('buscaRec','Buscar mentorado…',BUSCA_REC)}</div>
  ${corpo}
  <p class="nota">Cada cartão é uma parcela: quem deve, quanto e quando. “Dar baixa” pergunta a data em que o dinheiro entrou (e aceita valor parcial); “Editar” abre data, valor e número. Vencidas ficam com borda vermelha; as que vencem em 7 dias, amarela.</p>`;
  document.querySelectorAll('#v-receb [data-fr]').forEach(b=>b.onclick=()=>setFiltroRec(b.dataset.fr));
  const bi=document.getElementById('buscaRec'); bi.oninput=e=>{BUSCA_REC=e.target.value;const pos=e.target.selectionStart;verRecebiveis();const n=document.getElementById('buscaRec');n.focus();n.setSelectionRange(pos,pos);};
}
function setFiltroRec(f){FILTRO_REC=f;REC_MES_ABERTO=null;if(ABA!=='receb')irPara('receb');else verRecebiveis();}

/* ================= DESPESAS (lista segmentada por matriz) ================= */
let DESP_FECHADAS=new Set(), DESP_SECOES=[];
function linhaDespesa(l){
  const d=dias(l.data), atras=!l.pago&&d<0, breve=!l.pago&&d>=0&&d<=3;
  const sit=l.pago?tag('pago','ok'):atras?tag(`atrasada ${-d} d`,'mal'):breve?tag(d===0?'vence hoje':`vence em ${d} d`,'al'):tag('a pagar');
  const titulo=l.descricao||l.categoria, orfa=!catPorNome(l.categoria), editando=DESP_EDIT===l.id;
  const origem=l.origem==='planilha'?'planilha':l.recorrencia_id?'fixo':'avulsa';
  return `<div class="lrow ${l.pago?'pago':''}"><span class="st ${l.pago?'ok':atras?'mal':breve?'al':''}"></span>
    <div class="ds"><b>${esc(titulo)}</b><span>${esc(l.categoria)}${orfa?' · sem matriz':''} · vence ${dbr(l.data)} · ${origem}</span></div>
    <span class="tg">${sit}</span><span class="vl">${rs(l.valor)}</span>
    <div class="ac">${l.pago?`<button class="btnv xs" onclick="up('lancamentos','${l.id}','pago',false)">Desfazer</button>`:`<button class="btn xs" onclick="up('lancamentos','${l.id}','pago',true)">Pagar</button>`}<button class="btnv xs" onclick="editarDespesa('${l.id}')">${editando?'Fechar':'Editar'}</button></div></div>
    ${editando?`<div class="ledit"><div class="ctr-edit">
      <div class="full"><label>Descrição</label><input value="${esc(l.descricao||'')}" onchange="up('lancamentos','${l.id}','descricao',this.value)"></div>
      <div class="full"><label>Categoria</label><select onchange="up('lancamentos','${l.id}','categoria',this.value)">${selCatAgrupado(l.categoria,'despesa')}</select></div>
      ${orfa?`<div class="full"><label>“${esc(l.categoria)}” não está em nenhuma matriz · mover para</label><select onchange="adotarCategoria('${esc(l.categoria)}',this.value)"><option value="">escolher…</option>${matrizes('despesa').map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></div>`:''}
      <div><label>Vencimento</label><input type="date" value="${String(l.data).slice(0,10)}" onchange="up('lancamentos','${l.id}','data',this.value)"></div>
      <div><label>Valor${l.origem==='planilha'?' (a planilha manda)':''}</label><input type="number" step="0.01" value="${l.valor}" ${l.origem==='planilha'?'disabled':''} onchange="upNum('lancamentos','${l.id}','valor',this.value)"></div>
      <div><label>Escopo</label><select onchange="up('lancamentos','${l.id}','escopo',this.value)"><option value="empresa"${l.escopo==='empresa'?' selected':''}>empresa</option><option value="pessoal"${l.escopo==='pessoal'?' selected':''}>pessoal</option></select></div>
      <div class="full" style="display:flex;justify-content:flex-end">${l.origem==='planilha'?'<span class="nota" style="margin:0">Veio da planilha: para tirar, apague a célula lá.</span>':`<button class="btnv xs perigo" onclick="del('lancamentos','${l.id}')">Remover despesa</button>`}</div></div></div>`:''}`;
}
function secaoDespesas(nome,itens,cor,totalMes){
  const tot=itens.reduce((s,l)=>s+ +l.valor,0), pago=itens.filter(l=>l.pago).reduce((s,l)=>s+ +l.valor,0), falta=tot-pago;
  const fechada=DESP_FECHADAS.has(nome);

function verDespesas(){
  const dp=despesasMes(ANO,MES), g=agrupaPorMatriz(dp.pc);
  const jaGer=new Set(D.lancamentos.filter(l=>noMes(l.data,ANO,MES)&&l.recorrencia_id).map(l=>l.recorrencia_id));

  const desp=D.lancamentos.filter(l=>l.tipo==='despesa'&&noMes(l.data,ANO,MES));
  const corDe={}; g.forEach(([m],i)=>corDe[m]=CORES[i%CORES.length]);
  const porMatriz=!['todas','apagar','pagas'].includes(FILTRO_DESP);
  const lista=desp.filter(l=>FILTRO_DESP==='todas'?true:FILTRO_DESP==='apagar'?!l.pago:FILTRO_DESP==='pagas'?l.pago:matrizDe(l.categoria)===FILTRO_DESP)
    .filter(l=>!q||norm(l.descricao+' '+l.categoria).includes(q));

  const ordem=porMatriz?[...grupos.keys()].sort((a,b)=>grupos.get(b).reduce((s,l)=>s+ +l.valor,0)-grupos.get(a).reduce((s,l)=>s+ +l.valor,0))
    :[...g.map(([m])=>m).filter(m=>grupos.has(m)),...[...grupos.keys()].filter(m=>!g.some(([x])=>x===m))];
  const secoes=ordem.map((k,i)=>secaoDespesas(k,grupos.get(k),porMatriz?(corDe[FILTRO_DESP]||CORES[i%CORES.length]):(corDe[k]||CORES[6]),dp.total)).join('');
  const todasFechadas=ordem.length&&ordem.every(k=>DESP_FECHADAS.has(k));
  const chipsDesp=[['todas',`Todas · ${desp.length}`],['apagar',`A pagar · ${desp.filter(l=>!l.pago).length}`],['pagas','Pagas'],...g.map(([m])=>[m,m])];
  const barras=g.length?`<div class="grp-bars">${g.map(([m,o],i)=>`<div class="g" style="cursor:pointer" onclick="setFiltroDesp('${esc(m).replace(/'/g,"&#39;")}')"><span>${esc(m)}${m==='Sem categoria'?' '+tag('arrumar','al'):''}</span><div class="barra"><i style="width:${(o.total/g[0][1].total*100).toFixed(0)}%;background:${CORES[i%CORES.length]}"></i></div><b>${rsc(o.total)}</b><span class="pc">${(o.total/dp.total*100).toFixed(0)}%</span></div>`).join('')}</div>`:'<div class="vazio">Nenhuma despesa lançada neste mês.</div>';
  document.getElementById('v-desp').innerHTML=`<div class="grade g4">
    ${kpi('Total do mês',rsc(dp.total),`${desp.length} lançamentos · ${MESES[MES]}`)}
    ${kpi('Já pago',rsc(pagoMes(ANO,MES)),'quitado','pos',"setFiltroDesp('pagas')")}
    ${kpi('A pagar',rsc(ap),'em aberto',ap?'av':'',"setFiltroDesp('apagar')")}
    ${kpi('Fatura de cartão',rsc(faturaTotal(ANO,MES)),'projetada','',"irPara('cart')")}
  </div>
  <div class="cartao" style="margin-top:12px"><h2>Por categoria <span class="rotulo">${MESES[MES]} · clique para filtrar</span></h2>${barras}</div>
  ${pend.length?`<div class="linhafina" style="margin-top:12px"><span><strong>${pend.length} fixos ainda não lançados</strong> em ${MESES[MES]}, somando ${rsc(pend.reduce((s,r)=>s+ +r.valor,0))}: ${pend.map(r=>esc(r.descricao)).join(', ')}.</span><button class="btn sm" onclick="gerarFixos()">Lançar todos</button></div>`:''}
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px">${chips(chipsDesp,FILTRO_DESP,'data-fd')}<span style="flex:1"></span>${busca('buscaDesp','Buscar despesa…',BUSCA_DESP)}</div>
  <div class="sect" style="margin-top:14px">${porMatriz?esc(FILTRO_DESP):FILTRO_DESP==='apagar'?'A pagar':FILTRO_DESP==='pagas'?'Pagas':'Todas as despesas'} <span>${lista.length} lançamentos · por ${porMatriz?'categoria':'grupo'}, em ordem de vencimento</span><span class="tot">${rsc(lista.reduce((s,l)=>s+ +l.valor,0))}</span>${ordem.length>1?`<button class="btnv xs" onclick="recolherTudo(${todasFechadas?'false':'true'})">${todasFechadas?'Expandir tudo':'Recolher tudo'}</button>`:''}</div>
  ${secoes||'<div class="cartao vazio">Nada neste filtro.</div>'}

  <h2>Pagamentos fixos <span class="rotulo">repetem todo mês · lançados com um clique</span></h2>
  ${D.recorrencias.length?`<div class="ctrs tres">${[...D.recorrencias].sort((a,b)=>(a.dia||0)-(b.dia||0)).map(r=>cardFixo(r,jaGer.has(r.id))).join('')}</div>`:'<div class="cartao vazio">Nenhum fixo cadastrado. Cadastre abaixo e lance todos de uma vez a cada mês.</div>'}
  <div style="margin-top:12px">${caixaForm('fFixo','Novo fixo','cadastre uma vez, repete todo mês',`<div class="formlinha">
    <div class="campo"><label for="fDesc">Descrição</label><input id="fDesc" autocomplete="off"></div>

    <button class="btn" onclick="novoFixo()">Adicionar fixo</button>
  </div>`)}</div>`;
  DESP_SECOES=ordem;
  document.querySelectorAll('#v-desp [data-sec]').forEach(b=>b.onclick=()=>alternaSecao(b.dataset.sec));

  const bi=document.getElementById('buscaDesp'); bi.oninput=e=>{BUSCA_DESP=e.target.value;const pos=e.target.selectionStart;verDespesas();const n=document.getElementById('buscaDesp');n.focus();n.setSelectionRange(pos,pos);};
}
function recolherTudo(sim){DESP_SECOES.forEach(k=>sim?DESP_FECHADAS.add(k):DESP_FECHADAS.delete(k));verDespesas();}

/* Cria ou reaponta uma categoria orfa para dentro de uma matriz. */
async function adotarCategoria(nome,parent_id){
  if(!parent_id) return;
  const pai=D.categorias.find(c=>c.id===parent_id);
  const ja=D.categorias.find(c=>c.nome===nome);
  if(ja){
    const {error}=await sb.from('categorias').update({parent_id,matriz:false}).eq('id',ja.id);
    if(error) return toast('Erro: '+error.message,true);
    ja.parent_id=parent_id; ja.matriz=false;
  } else {
    const {data,error}=await sb.from('categorias').insert({nome,parent_id,matriz:false,tipo:'despesa',escopo:pai?.escopo||'ambos',ordem:99}).select().single();
    if(error) return toast('Erro: '+error.message,true);
    D.categorias.push(data);
  }
  toast(`"${nome}" agora fica em ${pai?pai.nome:'a matriz escolhida'}.`);
  desenhar();
}
async function novoFixo(){
  const cat=document.getElementById('fCat').value;
  const r={descricao:document.getElementById('fDesc').value.trim(),categoria:cat,
    valor:+document.getElementById('fValor').value||0,dia:+document.getElementById('fDia').value||5,
    tipo:'despesa',escopo:/pessoal/i.test(cat)?'pessoal':'empresa'};

  if(!r.valor)return toast('Informe o valor.',true);

  if(error)return toast('Erro: '+error.message,true);

const lancDeFixo=r=>({data:iso(new Date(ANO,MES,Math.min(r.dia||5,28))),competencia:iso(new Date(ANO,MES,1)),
  tipo:r.tipo,categoria:r.categoria,descricao:r.descricao,valor:r.valor,escopo:r.escopo,produto_id:r.produto_id,pago:false,recorrencia_id:r.id});
async function gerarFixo(id){
  const r=D.recorrencias.find(x=>x.id===id); if(!r)return;
  const {data,error}=await sb.from('lancamentos').insert(lancDeFixo(r)).select().single();

async function gerarFixos(){
  const jaGer=new Set(D.lancamentos.filter(l=>noMes(l.data,ANO,MES)&&l.recorrencia_id).map(l=>l.recorrencia_id));

<script>
/* ================= LANÇAMENTOS ================= */
function filtrados(){
  const v=FILTRO.visao||'tudo', q=norm(FILTRO.q);
  return D.lancamentos.filter(l=>{
    const d=String(l.data).slice(0,10);
    if(FILTRO.ini||FILTRO.fim){
      if(FILTRO.ini&&d<FILTRO.ini)return false;
      if(FILTRO.fim&&d>FILTRO.fim)return false;
    } else if(!noMes(l.data,ANO,MES)) return false;
    if(v==='entradas'&&l.tipo!=='entrada')return false;
    if(v==='saidas'&&l.tipo!=='despesa')return false;
    if(v==='apagar'&&(l.tipo!=='despesa'||l.pago))return false;
    if(v==='planilha'&&l.origem!=='planilha')return false;
    if(v==='manuais'&&l.origem==='planilha')return false;
    if(FILTRO.cat&&matrizDe(l.categoria)!==FILTRO.cat&&l.categoria!==FILTRO.cat)return false;
    if(q&&!norm((l.descricao||'')+' '+l.categoria).includes(q))return false;
    return true;
  }).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
}
function verLancamentos(){
  const lst=filtrados();
  const ent=lst.filter(l=>l.tipo==='entrada').reduce((s,l)=>s+ +l.valor,0);

  </div>
  <div style="margin-top:12px">${caixaForm('fLanc','Novo lançamento','entrada ou despesa avulsa — o que já está na planilha entra sozinho',`<div class="formlinha">
    <div class="campo"><label for="lData">Data</label><input id="lData" type="date" value="${iso(HOJE)}"></div>
    <div class="campo"><label for="lTipo">Tipo</label><select id="lTipo" onchange="trocaCat()"><option value="despesa">Despesa</option><option value="entrada">Entrada</option></select></div>

    <div class="campo"><label for="lDesc">Descrição</label><input id="lDesc" autocomplete="off"></div>

    <div class="campo"><label>De</label><input type="date" value="${FILTRO.ini}" onchange="setFiltro('ini',this.value)"></div>

    <div class="campo"><label>Grupo</label><select onchange="setFiltro('cat',this.value)">
      <option value="">Todos</option>${todasM.map(m=>`<option value="${esc(m)}"${FILTRO.cat===m?' selected':''}>${esc(m)}</option>`).join('')}</select></div>
    <button class="btnv" onclick="limparFiltro()">Limpar</button>
    <button class="btn" onclick="window.print()">Gerar relatório PDF</button>
  </div>
  <p class="nota">Sem datas preenchidas vale o mês escolhido no topo. O relatório abre a janela de impressão; escolha “Salvar como PDF”.</p></div></details>

  <h2>${FILTRO.ini||FILTRO.fim?'Período filtrado':MESES[MES]+' '+ANO} <span class="rotulo">${lst.length} lançamentos · por grupo</span></h2>`;
  if(!lst.length) h+='<div class="cartao vazio">Nenhum lançamento com esses filtros.</div>';

    </tr></thead><tbody>`;
    g.forEach(([m,o])=>{
      h+=`<tr class="matriz"><td colspan="5">${esc(m)}</td><td class="d">${rs(o.total)}</td><td></td></tr>`;
      Object.keys(o.filhos).forEach(cat=>{
        lst.filter(l=>l.categoria===cat).forEach(l=>{const pl=l.origem==='planilha';h+=`<tr class="filho">
          <td><input class="ed dt" type="date" value="${String(l.data).slice(0,10)}" onchange="up('lancamentos','${l.id}','data',this.value)"></td>
          <td class="nome"><select class="ed" onchange="up('lancamentos','${l.id}','categoria',this.value)">${selCatAgrupado(l.categoria,l.tipo)}</select></td>
          <td><input class="ed" value="${esc(l.descricao||'')}" onchange="up('lancamentos','${l.id}','descricao',this.value)"></td>
          <td>${l.tipo==='entrada'?tag('entrada','ok'):tag('saída')}${pl?' '+tag('planilha','inf'):''}</td>
          <td>${l.tipo==='entrada'&&pl?tag('recebido','ok'):`<button class="tag ${l.pago?'ok':'al'}" onclick="up('lancamentos','${l.id}','pago',${!l.pago})">${l.pago?'pago':'a pagar'}</button>`}</td>
          <td class="d">${pl?`<b style="color:#fff" title="O valor acompanha a planilha">${rs(l.valor)}</b>`:`<input class="ed n" style="width:104px" type="number" step="0.01" value="${l.valor}" onchange="upNum('lancamentos','${l.id}','valor',this.value)">`}</td>
          <td class="acoes">${pl?'':`<button class="x" onclick="del('lancamentos','${l.id}')" aria-label="Remover">✕</button>`}</td></tr>`;});

  }
  document.getElementById('v-lanc').innerHTML=h;

function setFiltro(k,v){FILTRO[k]=v;if(ABA!=='lanc')irPara('lanc');else{verLancamentos();rotularTabelas();}}

async function novoLanc(){
  const cat=document.getElementById('lCat').value;
  const r={data:document.getElementById('lData').value,competencia:document.getElementById('lData').value,
    tipo:document.getElementById('lTipo').value,categoria:cat,
    descricao:document.getElementById('lDesc').value.trim()||null,
    escopo:/pessoal/i.test(cat)?'pessoal':'empresa',
    produto_id:document.getElementById('lProd').value||null,
    valor:+document.getElementById('lValor').value||0,
    pago:document.getElementById('lPago').value==='true'};
  if(!r.data)return toast('Informe a data.',true);
  if(!r.valor)return toast('Informe o valor.',true);
  // trava contra receita em dobro: nos meses que a planilha traz, o faturamento já é o dela
  const [y,mm]=r.data.split('-').map(Number);
  if(r.tipo==='entrada'&&mesDaPlanilha(y,mm-1)&&!confirm(`O faturamento de ${MESES[mm-1]} já vem da planilha.\n\nSe esses ${rs(r.valor)} estão (ou vão estar) em alguma linha “Recebimento” da planilha, lançar aqui conta o mesmo dinheiro duas vezes.\n\nLançar mesmo assim, como receita por fora da planilha?`))return;
  const {data,error}=await sb.from('lancamentos').insert(r).select().single();
  if(error)return toast('Erro: '+error.message,true);
  D.lancamentos.push(data);['lDesc','lValor'].forEach(i=>document.getElementById(i).value='');
  toast('Lançamento adicionado.');desenhar();
}

/* ================= CARTÕES (cartões) =================
   As compras ficam só para leitura; “Editar” abre um bloco com Salvar/Cancelar. Nada muda por engano. */
let CART_LINHA=null, CART_INATIVAS=null;
function linhaCompra(p,viva){
  const editando=CART_LINHA===p.id, fimTxt=`${MESC[p.fim.getMonth()]}/${String(p.fim.getFullYear()).slice(2)}`;
  const situ=viva?`quita em ${fimTxt}`:p.atual<1?`começa em ${MESC[dObj(p.primeira_competencia).getMonth()]}/${String(dObj(p.primeira_competencia).getFullYear()).slice(2)}`:`quitada em ${fimTxt}`;
  const pagasN=Math.max(0,Math.min(p.total_parcelas,p.atual-1));
  return `<div class="r" style="${viva?'':'opacity:.6'}"><div><b>${esc(p.descricao)}</b><small>${esc(p.categoria||'Outros')} · ${situ}</small></div>
    <div class="mid mini"><span>${viva?`${p.atual}/${p.total_parcelas}`:`${p.total_parcelas}x`}</span><div class="barra ${!viva&&p.atual>p.total_parcelas?'v':''}"><i style="width:${pagasN/p.total_parcelas*100}%"></i></div></div>
    <div class="v">${rs(p.valor_parcela)}<small>${viva?`falta ${rsc(+p.valor_parcela*(p.total_parcelas-p.atual+1))}`:`total ${rsc(+p.valor_parcela*p.total_parcelas)}`}</small></div>
    <button class="btnv xs" onclick="editarLinhaCartao('${p.id}')">${editando?'Fechar':'Editar'}</button></div>
    ${editando?`<div class="ctr-edit" style="margin:0 0 10px;border-top:0;padding:12px;background:rgba(255,255,255,.04);border-radius:12px">
      <div class="full"><label>Descrição</label><input id="cpDesc" value="${esc(p.descricao)}"></div>
      <div><label>Valor da parcela</label><input id="cpValor" type="number" step="0.01" inputmode="decimal" value="${p.valor_parcela}"></div>
      <div><label>Total de parcelas</label><input id="cpTot" type="number" min="1" inputmode="numeric" value="${p.total_parcelas}"></div>
      <div><label>1ª parcela em</label><input id="cpIni" type="month" value="${String(p.primeira_competencia).slice(0,7)}"></div>
      <div><label>Categoria</label><input id="cpCat" value="${esc(p.categoria||'')}"></div>
      <div><label>Cartão</label><select id="cpCart">${D.cartoes.map(k=>`<option value="${k.id}"${k.id===p.cartao_id?' selected':''}>${esc(k.nome)}</option>`).join('')}</select></div>
      <div><label>Escopo</label><select id="cpEsc"><option value="pessoal"${p.escopo==='pessoal'?' selected':''}>pessoal</option><option value="empresa"${p.escopo==='empresa'?' selected':''}>empresa</option></select></div>
      <div class="full" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btnv xs perigo" onclick="del('parcelamentos','${p.id}')">Remover compra</button><span style="flex:1"></span><button class="btnv sm" onclick="editarLinhaCartao('${p.id}')">Cancelar</button><button class="btn sm" onclick="salvarCompra('${p.id}')">Salvar</button></div></div>`:''}`;
}
function linhaAssinatura(a){
  const editando=CART_LINHA===a.id, ativa=a.ativo!==false;
  return `<div class="r" style="${ativa?'':'opacity:.6'}"><div><b>${esc(a.descricao)}</b><small>assinatura · todo mês${ativa?'':' · pausada, fora da fatura'}</small></div>
    <div class="mid">${ativa?tag('assinatura'):tag('pausada','al')}</div><div class="v">${rs(a.valor)}<small>por mês</small></div>
    <button class="btnv xs" onclick="editarLinhaCartao('${a.id}')">${editando?'Fechar':'Editar'}</button></div>
    ${editando?`<div class="ctr-edit" style="margin:0 0 10px;border-top:0;padding:12px;background:rgba(255,255,255,.04);border-radius:12px">
      <div class="full"><label>Descrição</label><input id="asDescE" value="${esc(a.descricao)}"></div>
      <div><label>Valor por mês</label><input id="asValE" type="number" step="0.01" inputmode="decimal" value="${a.valor}"></div>
      <div><label>Cartão</label><select id="asCartE">${D.cartoes.map(k=>`<option value="${k.id}"${k.id===a.cartao_id?' selected':''}>${esc(k.nome)}</option>`).join('')}</select></div>
      <div><label>Situação</label><select id="asAtivoE"><option value="1"${ativa?' selected':''}>ativa</option><option value="0"${ativa?'':' selected'}>pausada</option></select></div>
      <div class="full" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btnv xs perigo" onclick="del('assinaturas','${a.id}')">Remover assinatura</button><span style="flex:1"></span><button class="btnv sm" onclick="editarLinhaCartao('${a.id}')">Cancelar</button><button class="btn sm" onclick="salvarAssinatura('${a.id}')">Salvar</button></div></div>`:''}`;
}
function cardCartao(c){
  const ref=new Date(ANO,MES,1);
  const todas=D.parcelamentos.filter(p=>p.cartao_id===c.id).map(p=>{
    const ini=dObj(p.primeira_competencia), n=dif(ini,ref)+1;
    return {...p,atual:n,fim:new Date(ini.getFullYear(),ini.getMonth()+p.total_parcelas-1,1),viva:n>=1&&n<=p.total_parcelas};
  }).sort((a,b)=>+b.valor_parcela-+a.valor_parcela);
  const ps=todas.filter(p=>p.viva), fora=todas.filter(p=>!p.viva);
  const asnTodas=D.assinaturas.filter(a=>a.cartao_id===c.id), asn=asnTodas.filter(a=>a.ativo!==false), pausadas=asnTodas.filter(a=>a.ativo===false);
  const fat=faturaCartao(c.id,ANO,MES), ass=asn.reduce((s,a)=>s+ +a.valor,0);
  const falta=ps.reduce((s,p)=>s+ +p.valor_parcela*(p.total_parcelas-p.atual+1),0);
  const livre=ps.length?ps.reduce((a,b)=>a.fim>b.fim?a:b).fim:null;
  const pagas=ps.reduce((s,p)=>s+(p.atual-1),0), total=ps.reduce((s,p)=>s+p.total_parcelas,0);
  const aberto=CART_ABERTO===c.id, editando=CART_EDIT===c.id, verFora=CART_INATIVAS===c.id;
  let h=`<div class="ctr">
    <div class="ctr-top"><div class="avatar ${c.escopo==='empresa'?'k3':'k1'}">${iniciais(c.nome)}</div><div class="ctr-name"><b>${esc(c.nome)}</b><span>${esc(c.bandeira||'')}${c.bandeira?' · ':''}vence dia ${c.dia_vencimento} · ${c.escopo}</span></div><div class="ctr-val"><b>${rsc(fat)}</b><span>fatura de ${MESES[MES]}</span></div></div>
    <div class="ctr-grid flex"><div><small>Parcelamentos</small><b>${ps.length} · ${rsc(fat-ass)}/mês</b></div><div><small>Assinaturas</small><b>${asn.length} · ${rsc(ass)}/mês</b></div><div><small>Falta pagar</small><b class="${falta?'warn':'pos'}">${rsc(falta)}</b></div><div><small>Fica livre em</small><b>${livre?`${MESC[livre.getMonth()]}/${String(livre.getFullYear()).slice(2)}`:'—'}</b></div></div>
    ${ps.length?`<div class="mini" style="margin-top:12px"><span>${pagas} de ${total} parcelas pagas</span><div class="barra"><i style="width:${total?pagas/total*100:0}%"></i></div><span>${total?(pagas/total*100).toFixed(0):0}%</span></div>`:''}
    <div class="ctr-act"><button class="btnv sm" onclick="abrirCartao('${c.id}')">${aberto?'Fechar':'Ver compras'}</button><button class="btnv sm" onclick="lerFaturaDe('${c.id}')">Ler fatura pelo print</button><button class="btnv sm" onclick="editarCartao('${c.id}')">${editando?'Fechar edição':'Editar cartão'}</button></div>`;
  if(aberto){
    h+=`<div class="sub-rows">${ps.map(p=>linhaCompra(p,true)).join('')}${asn.map(linhaAssinatura).join('')}
      ${!ps.length&&!asn.length?'<div class="vazio">Nenhum parcelamento ou assinatura ativos neste mês.</div>':''}
      ${fora.length||pausadas.length?`<div style="padding:8px 0"><button class="btnv xs" onclick="CART_INATIVAS=${verFora?'null':`'${c.id}'`};verCartoes()">${verFora?'Esconder':'Mostrar'} ${fora.length+pausadas.length} fora da fatura deste mês</button></div>${verFora?fora.map(p=>linhaCompra(p,false)).join('')+pausadas.map(linhaAssinatura).join(''):''}`:''}
      <div class="formlinha" style="margin-top:12px"><div class="campo"><label>Nova assinatura</label><input id="asDesc_${c.id}" placeholder="ex.: Netflix" autocomplete="off"></div><div class="campo" style="flex:0 1 140px"><label>Valor/mês</label><input id="asVal_${c.id}" type="number" step="0.01" inputmode="decimal"></div><button class="btnv sm" onclick="novaAssinatura('${c.id}')">+ Assinatura</button><button class="btnv sm" onclick="novoParcelamentoEm('${c.id}')">+ Parcelamento</button></div></div>`;
  }
  if(editando){
    h+=`<div class="ctr-edit">
      <div><label>Nome</label><input id="kcNome_${c.id}" value="${esc(c.nome)}"></div>
      <div><label>Bandeira</label><input id="kcBand_${c.id}" value="${esc(c.bandeira||'')}"></div>
      <div><label>Dia de vencimento</label><input id="kcDia_${c.id}" type="number" min="1" max="28" value="${c.dia_vencimento||10}"></div>
      <div><label>Escopo</label><select id="kcEsc_${c.id}"><option value="pessoal"${c.escopo==='pessoal'?' selected':''}>pessoal</option><option value="empresa"${c.escopo==='empresa'?' selected':''}>empresa</option></select></div>
      <div class="full" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btnv xs perigo" onclick="del('cartoes','${c.id}')">Remover cartão</button><span style="flex:1"></span><button class="btnv sm" onclick="editarCartao('${c.id}')">Cancelar</button><button class="btn sm" onclick="salvarCartao('${c.id}')">Salvar</button></div></div>`;
  }
  return h+'</div>';
}
function abrirCartao(id){CART_ABERTO=(CART_ABERTO===id?null:id);CART_LINHA=null;verCartoes();}
function editarCartao(id){CART_EDIT=(CART_EDIT===id?null:id);verCartoes();}
function editarLinhaCartao(id){CART_LINHA=(CART_LINHA===id?null:id);verCartoes();}
async function salvarTudo(tabela,id,patch,msg){
  const {error}=await sb.from(tabela).update(patch).eq('id',id);
  if(error){toast('Erro ao salvar: '+error.message,true);return false;}
  const it=D[tabela].find(x=>x.id===id); if(it)Object.assign(it,patch);
  toast(msg||'Salvo.'); return true;
}
async function salvarCompra(id){
  const g=k=>document.getElementById(k), mes=g('cpIni').value;
  const patch={descricao:g('cpDesc').value.trim(),valor_parcela:+g('cpValor').value||0,total_parcelas:Math.max(1,Math.round(+g('cpTot').value||1)),
    primeira_competencia:mes?mes+'-01':null,categoria:g('cpCat').value.trim()||'Outros',cartao_id:g('cpCart').value,escopo:g('cpEsc').value};
  if(!patch.descricao)return toast('Informe a descrição.',true);
  if(!patch.valor_parcela)return toast('Informe o valor da parcela.',true);
  if(!patch.primeira_competencia)return toast('Informe o mês da 1ª parcela.',true);
  if(await salvarTudo('parcelamentos',id,patch,'Compra atualizada.')){CART_LINHA=null;CART_ABERTO=patch.cartao_id;desenhar();}
}
async function salvarAssinatura(id){
  const g=k=>document.getElementById(k);
  const patch={descricao:g('asDescE').value.trim(),valor:+g('asValE').value||0,cartao_id:g('asCartE').value,ativo:g('asAtivoE').value==='1'};
  if(!patch.descricao)return toast('Informe a descrição.',true);
  if(!patch.valor)return toast('Informe o valor.',true);
  if(await salvarTudo('assinaturas',id,patch,'Assinatura atualizada.')){CART_LINHA=null;CART_ABERTO=patch.cartao_id;if(!patch.ativo)CART_INATIVAS=patch.cartao_id;desenhar();}
}
async function salvarCartao(id){
  const g=k=>document.getElementById(k+'_'+id);
  const patch={nome:g('kcNome').value.trim(),bandeira:g('kcBand').value.trim()||null,dia_vencimento:Math.min(28,Math.max(1,+g('kcDia').value||10)),escopo:g('kcEsc').value};
  if(!patch.nome)return toast('Informe o nome do cartão.',true);
  if(await salvarTudo('cartoes',id,patch,'Cartão atualizado.')){CART_EDIT=null;desenhar();}
}
function lerFaturaDe(id){const s=document.getElementById('impCart');if(s){s.value=id;document.getElementById('zona').scrollIntoView({behavior:'smooth',block:'center'});}}
function novoParcelamentoEm(id){FORMS['fParc']=true;verCartoes();const s=document.getElementById('pCart');if(s){s.value=id;document.getElementById('fParc').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('pDesc').focus();}}
async function novaAssinatura(cartao_id){
  const d=document.getElementById('asDesc_'+cartao_id), v=document.getElementById('asVal_'+cartao_id);
  const r={cartao_id,descricao:d.value.trim(),valor:+v.value||0,escopo:D.cartoes.find(c=>c.id===cartao_id)?.escopo||'pessoal',ativo:true};
  if(!r.descricao)return toast('Informe a descrição da assinatura.',true);
  if(!r.valor)return toast('Informe o valor.',true);
  const {data,error}=await sb.from('assinaturas').insert(r).select().single();
  if(error)return toast('Erro: '+error.message,true);
  D.assinaturas.push(data);toast('Assinatura adicionada.');verCartoes();
}

  let h=`<div class="grade g4">
    ${kpi('Fatura total',rsc(faturaTotal(ANO,MES)),`${D.cartoes.length} cartões · ${MESES[MES]}`)}
    ${kpi('Em 3 meses',rsc(faturaTotal(ANO,MES+3)),'sem parcelar mais nada')}
    ${kpi('Em 6 meses',rsc(faturaTotal(ANO,MES+6)),'sem parcelar mais nada')}
    ${kpi('Dívida restante',rsc(restante),'tudo que ainda falta',restante?'av':'')}
  </div>
  <div class="cartao" style="margin-top:12px"><h2>Já comprometido por mês <span class="rotulo">parcelado + assinaturas, sem nenhuma compra nova</span></h2>
    <div class="grafico"><canvas id="gComp" role="img" aria-label="Valor já comprometido nos cartões nos próximos oito meses"></canvas></div>
    <p class="nota" id="compLivre"></p></div>
  <h2>Cada cartão <span class="rotulo">fatura do mês, o que está parcelado e quando fica livre</span></h2>
  ${D.cartoes.length?`<div class="ctrs">${D.cartoes.map(cardCartao).join('')}</div>`:'<div class="cartao vazio">Nenhum cartão cadastrado. Cadastre abaixo.</div>'}
  <p class="nota">“Ver compras” abre os parcelamentos (com a barra de quanto já foi pago) e as assinaturas do cartão. As linhas são só para leitura: para mudar valor, número de parcelas, mês da 1ª parcela ou trocar de cartão, clique em <b>Editar</b> na linha e depois em <b>Salvar</b> — nada muda por engano. A fatura projetada some sozinha quando a última parcela é paga.</p>

  <h2>Ler fatura pelo print <span class="rotulo">a IA separa parcelamento de assinatura</span></h2>
  <div class="cartao">
    <div class="formlinha" style="margin-bottom:12px">
      <div class="campo" style="flex:0 1 260px"><label for="impCart">Cartão</label><select id="impCart">${D.cartoes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
    </div>
    <label for="impFile" class="dropzona" id="zona" style="display:block;cursor:pointer">Clique para escolher os prints da fatura, ou arraste aqui. Até 8 imagens por vez.</label>
    <input id="impFile" type="file" accept="image/*" multiple class="oculto" onchange="carregarPrints(this.files)">
    <div class="miniaturas" id="minis"></div>
    <div style="margin-top:14px"><button class="btn" id="btLer" onclick="lerPrints()" ${PRINTS.length?'':'disabled'}>${ICO.ai} ${PRINTS.length?`Ler ${PRINTS.length} print(s) com IA`:'Escolha os prints primeiro'}</button></div>
    <div id="resultadoImp"></div>

  </div>

  <div class="grade g2" style="margin-top:22px">
    ${caixaForm('fCart','Novo cartão','',`<div class="formlinha">
      <div class="campo"><label for="kNome">Nome</label><input id="kNome" autocomplete="off"></div>
      <div class="campo"><label for="kBand">Bandeira</label><input id="kBand" autocomplete="off"></div>
      <div class="campo"><label for="kDia">Dia de vencimento</label><input id="kDia" type="number" value="10" min="1" max="28" inputmode="numeric"></div>
      <div class="campo"><label for="kEsc">Escopo</label><select id="kEsc"><option value="pessoal">Pessoal</option><option value="empresa">Empresa</option></select></div>
      <button class="btn" onclick="novoCartao()">Adicionar cartão</button>
    </div>`)}
    ${caixaForm('fParc','Novo parcelamento manual','',`<div class="formlinha">
      <div class="campo"><label for="pCart">Cartão</label><select id="pCart">${D.cartoes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
      <div class="campo"><label for="pDesc">Descrição</label><input id="pDesc" autocomplete="off"></div>
      <div class="campo"><label for="pCat">Categoria</label><input id="pCat" placeholder="Compras" autocomplete="off"></div>
      <div class="campo"><label for="pValor">Valor da parcela</label><input id="pValor" type="number" step="0.01" inputmode="decimal"></div>
      <div class="campo"><label for="pTot">Total de parcelas</label><input id="pTot" type="number" value="10" inputmode="numeric"></div>
      <div class="campo"><label for="pIni">1ª parcela em</label><input id="pIni" type="month" value="${chave(ANO,MES)}"></div>
      <button class="btn" onclick="novoParcelamento()">Adicionar parcelamento</button>
    </div>`)}
  </div>`;
  document.getElementById('v-cart').innerHTML=h;
  const z=document.getElementById('zona');
  if(z){
    z.ondragover=e=>{e.preventDefault();z.classList.add('ativo')};
    z.ondragleave=()=>z.classList.remove('ativo');
    z.ondrop=e=>{e.preventDefault();z.classList.remove('ativo');carregarPrints(e.dataTransfer.files)};
  }
  desenhaMinis();
  graficoComprometido();

function carregarPrints(files){
  const arr=[...files].filter(f=>f.type.startsWith('image/')).slice(0,8);
  if(!arr.length)return toast('Escolha arquivos de imagem.',true);
  PRINTS=[];let lidos=0;
  arr.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{PRINTS.push({tipo:f.type,dados:String(r.result).split(',')[1],url:r.result});
      if(++lidos===arr.length){desenhaMinis();
        const b=document.getElementById('btLer');if(b){b.disabled=false;b.innerHTML=`${ICO.ai} Ler ${PRINTS.length} print(s) com IA`;}}};
    r.readAsDataURL(f);
  });
}
function desenhaMinis(){
  const el=document.getElementById('minis');if(!el)return;
  el.innerHTML=PRINTS.map(p=>`<img src="${p.url}" alt="">`).join('');
}
async function lerPrints(){
  if(!PRINTS.length)return toast('Escolha os prints primeiro.',true);
  const url=D.config.agente_url;
  if(!url)return toast('Configure a URL do agente em Configurações.',true);
  const b=document.getElementById('btLer'); b.disabled=true; b.innerHTML='<span class="girando"></span>Lendo…';
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(url,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token||SUPABASE_KEY}`},
      body:JSON.stringify({modo:'fatura',mes:`${MESES[MES]} ${ANO}`,imagens:PRINTS.map(p=>({tipo:p.tipo,dados:p.dados}))})});
    const j=await r.json();
    if(j.erro) throw new Error(j.erro);
    mostrarLidas(j.linhas||[]);
  }catch(e){
    document.getElementById('resultadoImp').innerHTML=`<div class="alerta critico" style="margin-top:14px"><div><strong>Não consegui ler.</strong><br>${esc(String(e.message||e))}</div></div>`;
  }
  b.disabled=false; b.innerHTML=`${ICO.ai} Ler ${PRINTS.length} print(s) com IA`;
}
let LIDAS=[];
function mostrarLidas(linhas){
  LIDAS=linhas.filter(l=>+l.valor>0);
  const el=document.getElementById('resultadoImp');
  if(!LIDAS.length){el.innerHTML='<div class="vazio">A IA não encontrou linhas legíveis.</div>';return;}
  const parc=LIDAS.filter(l=>l.parcela_total>1), ass=LIDAS.filter(l=>!(l.parcela_total>1));
  el.innerHTML=`<h2>${LIDAS.length} linhas lidas <span class="rotulo">confira antes de salvar</span></h2>

function graficoInvestimentos(){
  const hist=[...D.investimentos_hist].sort((a,b)=>a.ano_mes.localeCompare(b.ano_mes)).slice(-12);

    return;}
  const lb=hist.map(x=>{const[a,m]=x.ano_mes.split('-');return `${MESC[+m-1]}/${a.slice(2)}`});
  pinta('gInv','line',{labels:lb,datasets:[
    {label:'Reserva total',data:hist.map(x=>+x.caixa+ +x.investido+ +x.reserva),borderColor:CORES[0],backgroundColor:'rgba(168,85,247,.15)',borderWidth:2.4,fill:true,pointRadius:4,pointBackgroundColor:CORES[0],tension:.25},
    {label:'Caixa',data:hist.map(x=>+x.caixa),borderColor:CORES[1],borderWidth:2.4,fill:false,pointRadius:4,pointBackgroundColor:CORES[1],tension:.25}
  ]},{plugins:{legend:{display:true,position:'bottom',labels:{color:'#9CA3AF',font:{size:12},boxWidth:10,padding:14,usePointStyle:true}},
    tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${rsc(c.parsed.y)}`}}}});

async function registrarSnapshot(){
  const linha={ano_mes:chave(ANO,MES),caixa:somaCaixa(),
    investido:D.investimentos.filter(i=>/investimento/i.test(i.tipo||'')).reduce((s,i)=>s+ +i.valor,0),
    reserva:D.investimentos.filter(i=>/reserva/i.test(i.tipo||'')).reduce((s,i)=>s+ +i.valor,0)};

/* ================= GENÉRICOS ================= */
async function up(tabela,id,campo,valor){
  if(!id||id==='undefined'||id==='null')return toast('Registro sem vínculo, não dá para salvar.',true);
  const {error}=await sb.from(tabela).update({[campo]:valor}).eq('id',id);
  if(error)return toast('Erro ao salvar: '+error.message,true);
  const it=D[tabela]?.find(x=>x.id===id);if(it)it[campo]=valor;
  toast('Salvo.');desenhar();
}
const upNum=(t,i,c,v)=>up(t,i,c,+v||0);
async function del(tabela,id){
  if(!confirm('Remover? Isso não pode ser desfeito.'))return;
  const {error}=await sb.from(tabela).delete().eq('id',id);
  if(error)return toast('Erro ao remover: '+error.message,true);

  if(tabela==='mentorados')D.contratos=D.contratos.filter(c=>c.mentorado_id!==id);
  toast('Removido.');desenhar();
}

<script>
/* ================= PACK ASSESSOR · peças do painel =================
   A1 pendências · A2 comparativo, projeção e fora do padrão · A5 saldo projetado · A6 cobrança com 1 toque · B3 linha do tempo */
const plural=(n,um,varios)=>n===1?um:varios;
function irHoje(){ANO=HOJE.getFullYear();MES=HOJE.getMonth();SEMANA=null;const s=document.getElementById('selMes');if(s)s.value=`${ANO}-${MES}`;}

/* ---------- B3 · linha do tempo ---------- */
async function registrar(tipo,titulo,detalhe,ref){
  try{
    const {data,error}=await sb.from('eventos').insert({origem:'painel',tipo,titulo,detalhe:detalhe||null,ref_tabela:ref?.tabela||null,ref_id:ref?.id||null}).select().single();
    if(!error&&data){D.eventos.unshift(data);const el=document.getElementById('tempoLista');if(el)el.innerHTML=linhasTempo();}
  }catch(e){}
}
const haQuanto=s=>{const min=Math.max(0,Math.round((Date.now()-new Date(s).getTime())/60000));
  return min<1?'agora':min<60?`há ${min} min`:min<1440?`há ${Math.round(min/60)} h`:min<2880?'ontem':dbr(iso(new Date(s)));};
const COR_EVENTO={baixa:'ok',renovacao:'ok',contrato:'ok',baixa_desfeita:'al',cancelamento:'mal',encerramento:'',reativacao:'inf',cobranca:'inf',planilha:'inf',fechamento:''};
function linhasTempo(){
  const ev=D.eventos.slice(0,14);
  return ev.length?ev.map(e=>`<div class="lrow p3"><span class="st ${COR_EVENTO[e.tipo]||''}"></span><div class="ds"><b>${esc(e.titulo)}</b><span>${haQuanto(e.criado_em)} · ${e.origem==='painel'?'feito no painel':e.origem==='assessor'?'feito pelo assessor':e.origem==='planilha'?'veio da planilha':'automático'}${e.desfeito_em?' · desfeito':''}</span></div><span class="tg">${tag(esc(String(e.tipo).replace(/_/g,' ')))}</span></div>`).join('')
    :'<div class="vazio">Nada registrado ainda. Baixas, renovações, cobranças e mudanças da planilha aparecem aqui.</div>';
}
function blocoLinhaTempo(){
  if(FORMS.fTempo===undefined)FORMS.fTempo=false;
  return `<details class="fdisc" id="fTempo"${FORMS.fTempo?' open':''} style="margin-top:22px"><summary><span class="mais">+</span>Linha do tempo <span class="rotulo">${D.eventos.length?`última: ${haQuanto(D.eventos[0].criado_em)}`:'o que aconteceu no painel, na planilha e pelo assessor'}</span></summary><div class="lsec" style="margin:0;border:0;border-radius:0;background:none" id="tempoLista">${linhasTempo()}</div></details>`;
}

/* ---------- A2 · comparativo, projeção e o que fugiu do padrão ---------- */
function tagVariacao(atual,anterior,nomeAnterior,bomSeSobe){
  if(!anterior||anterior<=0)return '';
  const pct=(atual/anterior-1)*100, neutro=Math.abs(pct)<3;
  return tag(`${pct>=0?'+':''}${pct.toFixed(0)}% vs ${nomeAnterior}`,neutro?'':((pct>=0)===bomSeSobe?'ok':'mal'));
}
/* Item da planilha muito acima da média dos 3 meses anteriores (mesmo item, mesmo id estável). */
function anomalias(a,m){
  const idx=new Map(D.lancamentos.filter(l=>l.origem_id).map(l=>[l.origem_id,l])), out=[];
  D.lancamentos.filter(l=>l.origem==='planilha'&&l.tipo==='despesa'&&l.origem_id&&noMes(l.data,a,m)).forEach(l=>{
    const slugItem=String(l.origem_id).split(':')[3]; if(!slugItem)return;
    const ant=[1,2,3].map(k=>{const d=new Date(a,m-k,1);return idx.get(`pl:${d.getFullYear()}:d:${slugItem}:${String(d.getMonth()+1).padStart(2,'0')}`);}).filter(Boolean);
    if(ant.length<2)return;
    const media=ant.reduce((s,x)=>s+ +x.valor,0)/ant.length;
    if(media>0&&+l.valor>=media*1.3&&+l.valor-media>=150)out.push({l,media,pct:(+l.valor/media-1)*100});
  });
  return out.sort((x,y)=>(+y.l.valor-y.media)-(+x.l.valor-x.media));
}
/* O que ainda deve entrar no mês: parcelas em aberto com vencimento nele, menos o que a aba de alunos já mostra como pago. */
function aReceberNoMes(a,m){
  const cobertas=new Map(); (typeof sugestoesPlanilha==='function'?sugestoesPlanilha():[]).forEach(s=>cobertas.set(s.p.id,s.livre));
  return abertas().filter(p=>noMes(p.vencimento,a,m)).reduce((s,p)=>s+Math.max(0,+p.valor-(cobertas.get(p.id)||0)),0);
}
function projecaoMes(){ // só faz sentido no mês em andamento
  const a=HOJE.getFullYear(), m=HOJE.getMonth(), cx=caixaMes(a,m), dp=despesasMes(a,m), falta=aReceberNoMes(a,m);
  return {falta, recebido:cx.total+falta, saldo:cx.total+falta-dp.total};
}

/* ---------- A1 · central de pendências (sempre sobre hoje, não sobre o mês escolhido no topo) ---------- */
function pendencias(){
  const P=[], a=HOJE.getFullYear(), m=HOJE.getMonth(), hoje=iso(HOJE), em3=iso(new Date(a,m,HOJE.getDate()+3));
  const ativos=D.contratos.filter(c=>c.status==='ativo'&&D.mentorados.some(x=>x.id===c.mentorado_id));
  const venc=ativos.filter(c=>dias(c.data_fim)<0), prox=ativos.filter(c=>{const d=dias(c.data_fim);return d>=0&&d<=30;});
  if(venc.length)P.push({n:'mal',t:`<b>${venc.length} ${plural(venc.length,'contrato venceu','contratos venceram')}</b> · renovou ou não?`,b:'Decidir',a:"setFiltroCtr('atencao')"});
  if(prox.length)P.push({n:'al',t:`<b>${prox.length} ${plural(prox.length,'contrato vence','contratos vencem')} em até 30 dias</b> · ${prox.slice(0,3).map(c=>esc((D.mentorados.find(x=>x.id===c.mentorado_id)?.nome||'').split(' ')[0])).join(', ')}${prox.length>3?'…':''}`,b:'Ver',a:"setFiltroCtr('atencao')"});
  const atr=abertas().filter(p=>p.d<0);
  if(atr.length){const sug=(typeof sugestoesPlanilha==='function'?sugestoesPlanilha():[]).filter(s=>s.tipo==='cheia').length;
    P.push({n:'mal',t:`<b>${atr.length} ${plural(atr.length,'parcela vencida','parcelas vencidas')}</b> · ${rsc(atr.reduce((s,p)=>s+ +p.valor,0))}${sug?` · ${sug} ${plural(sug,'bate','batem')} com a planilha`:''}`,b:sug?'Conferir':'Cobrar',a:sug?"setFiltroRec('atencao')":"setFiltroRec('pessoas')"});}
  const desp=D.lancamentos.filter(l=>l.tipo==='despesa'&&!l.pago), atras=desp.filter(l=>String(l.data).slice(0,10)<hoje&&noMes(l.data,a,m)), breve=desp.filter(l=>{const d=String(l.data).slice(0,10);return d>=hoje&&d<=em3;});
  if(atras.length)P.push({n:'mal',t:`<b>${atras.length} ${plural(atras.length,'conta atrasada','contas atrasadas')}</b> · ${rsc(atras.reduce((s,l)=>s+ +l.valor,0))} · ${esc(atras.slice(0,2).map(l=>l.descricao||l.categoria).join(', '))}${atras.length>2?'…':''}`,b:'Pagar',a:"irHoje();setFiltroDesp('apagar')"});
  if(breve.length)P.push({n:'al',t:`<b>${breve.length} ${plural(breve.length,'conta vence','contas vencem')} até ${dbr(em3)}</b> · ${rsc(breve.reduce((s,l)=>s+ +l.valor,0))} · ${esc(breve.slice(0,2).map(l=>l.descricao||l.categoria).join(', '))}${breve.length>2?'…':''}`,b:'Ver',a:"irHoje();setFiltroDesp('apagar')"});
  const jaGer=new Set(D.lancamentos.filter(l=>noMes(l.data,a,m)&&l.recorrencia_id).map(l=>l.recorrencia_id));
  const fixos=D.recorrencias.filter(r=>r.ativo!==false&&!jaGer.has(r.id));
  if(fixos.length)P.push({n:'al',t:`<b>${fixos.length} ${plural(fixos.length,'fixo ainda não lançado','fixos ainda não lançados')}</b> em ${MESES[m]} · ${rsc(fixos.reduce((s,r)=>s+ +r.valor,0))}`,b:'Lançar',a:"irHoje();irPara('desp')"});
  const planilhaTemCartao=D.lancamentos.some(l=>l.origem==='planilha'&&l.tipo==='despesa'&&noMes(l.data,a,m)&&matrizDe(l.categoria)==='Cartões');
  if(!planilhaTemCartao)D.cartoes.forEach(c=>{const dia=+c.dia_vencimento||10, venceEm=new Date(a,m+(dia<HOJE.getDate()?1:0),dia), d=dias(iso(venceEm)), f=faturaCartao(c.id,venceEm.getFullYear(),venceEm.getMonth());
    if(f>0&&d>=0&&d<=5)P.push({n:'al',t:`<b>Fatura ${esc(c.nome)}</b> vence ${d===0?'hoje':`em ${d} ${plural(d,'dia','dias')}`} · ${rsc(f)}`,b:'Ver',a:"irPara('cart')"});});
  anomalias(a,m).slice(0,2).forEach(x=>P.push({n:'inf',t:`<b>${esc(x.l.descricao||x.l.categoria)} ${x.pct.toFixed(0)}% acima</b> da média de 3 meses · ${rsc(x.l.valor)} contra ${rsc(x.media)}`,b:'Ver',a:`irHoje();BUSCA_DESP=${JSON.stringify(String(x.l.descricao||'')).replace(/"/g,'&quot;')};setFiltroDesp('todas')`}));
  return P;
}
function blocoPendencias(){
  const P=pendencias();
  return `<div class="lsec" style="margin-top:22px"><div class="lsec-h" style="cursor:default"><span class="pt" style="background:${P.some(p=>p.n==='mal')?'var(--neg)':P.length?'var(--warn)':'var(--pos)'}"></span>
    <span class="nm"><b>Pendências de hoje</b><span>${P.length?`${P.length} ${plural(P.length,'coisa pede','coisas pedem')} a sua ação`:'nada pendente — tudo em dia'}</span></span></div>
    ${P.map(p=>{const i=p.t.indexOf('</b>'), tit=p.t.slice(0,i).replace('<b>',''), det=p.t.slice(i+4).replace(/^\s*·\s*/,'').trim();
      return `<div class="lrow p3"><span class="st ${p.n}"></span><div class="ds"><b>${tit}</b>${det?`<span>${det}</span>`:''}</div><div class="ac"><button class="btn xs" onclick="${p.a}">${p.b}</button></div></div>`;}).join('')}</div>`;
}

/* ---------- A6 · quem me deve, por pessoa, e cobrança com 1 toque ---------- */
const soDigitos=s=>String(s||'').replace(/\D/g,'');
function foneWa(t){let d=soDigitos(t);if(!d)return '';if(d.length<=11)d='55'+d;return d;}
const MODELO_COBRANCA='Oi {primeiro_nome}, tudo bem? Passando pra lembrar {itens}.{pix} Qualquer coisa me chama!';
function mensagemCobranca(ps){
  const p0=ps[0], c=D.contratos.find(x=>x.id===p0.contrato_id), m=c?D.mentorados.find(x=>x.id===c.mentorado_id):null, nome=m?.nome||'';
  const total=ps.reduce((s,p)=>s+ +p.valor,0), prodNome=nomeProd(c?.produto_id);
  const itens=ps.length===1?`da parcela ${p0.numero} da ${prodNome}, no valor de ${rs(p0.valor)}, que ${dias(p0.vencimento)<0?'venceu':'vence'} dia ${dbr(p0.vencimento)}`
    :`das parcelas em aberto da ${prodNome}: ${ps.map(p=>`nº ${p.numero} (${rs(p.valor)}, ${dias(p.vencimento)<0?'venceu':'vence'} ${dbr(p.vencimento)})`).join(', ')}. Total: ${rs(total)}`;
  const pix=D.config.pix_chave?` Segue o PIX: ${D.config.pix_chave}.`:'';
  const v={nome,primeiro_nome:nome.split(' ')[0]||nome,itens,pix,produto:prodNome,valor:rs(total),parcela:ps.map(p=>p.numero).join(' e '),vencimento:dbr(p0.vencimento)};
  return (D.config.cobranca_modelo||MODELO_COBRANCA).replace(/\{(\w+)\}/g,(x,k)=>v[k]??x);
}
async function cobrarParcelas(ids){
  const ps=ids.map(id=>D.parcelas.find(x=>x.id===id)).filter(Boolean); if(!ps.length)return;
  const c=D.contratos.find(x=>x.id===ps[0].contrato_id), m=c?D.mentorados.find(x=>x.id===c.mentorado_id):null; if(!m)return;
  const fone=foneWa(m.whatsapp);
  if(fone.length<12){pedirWhatsapp(m,ids);return;}
  window.open(`https://wa.me/${fone}?text=${encodeURIComponent(mensagemCobranca(ps))}`,'_blank','noopener'); // antes de qualquer espera, senão o navegador bloqueia
  const hoje=iso(HOJE), r=await sb.from('parcelas').update({cobrado_em:hoje}).in('id',ps.map(p=>p.id));
  if(!r.error)ps.forEach(p=>p.cobrado_em=hoje);
  registrar('cobranca',`Cobrança enviada a ${m.nome} · ${ps.length>1?ps.length+' parcelas':'parcela '+ps[0].numero} · ${rs(ps.reduce((s,p)=>s+ +p.valor,0))}`,null,{tabela:'mentorados',id:m.id});
  desenhar();
}
function cobrar(id){cobrarParcelas([id]);}
function pedirWhatsapp(m,ids){ // sem número no cadastro: pergunta uma vez, salva e segue para a cobrança
  fecharModal(); const el=document.createElement('div'); el.className='modal-bg'; el.id='modal';
  el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="WhatsApp do mentorado"><div class="ctr-top"><div class="avatar sm ${avCls(m.nome)}">${iniciais(m.nome)}</div><div class="ctr-name"><b>${esc(m.nome)}</b><span>ainda sem WhatsApp no cadastro</span></div></div>
    <label class="ml" for="waFone">WhatsApp com DDD</label><input id="waFone" inputmode="tel" placeholder="(11) 99999-9999" autocomplete="off">
    <div class="modal-act"><button class="btnv" onclick="fecharModal()">Voltar</button><button class="btn" id="waOk">Salvar e cobrar</button></div></div>`;
  el.onclick=e=>{if(e.target===el)fecharModal();}; document.body.appendChild(el);
  document.getElementById('waOk').onclick=()=>{const t=document.getElementById('waFone').value;
    if(foneWa(t).length<12)return toast('Número incompleto. Use DDD + número.',true);
    m.whatsapp=soDigitos(t); sb.from('mentorados').update({whatsapp:m.whatsapp}).eq('id',m.id).then(r=>{if(r.error)toast('Não consegui salvar o número: '+r.error.message,true);});
    fecharModal(); cobrarParcelas(ids);};
  document.getElementById('waFone').focus();
}
function blocoPorPessoa(vencidas,q){
  const g=new Map(); vencidas.forEach(p=>{const k=p.mentorado?.id||'?';(g.get(k)||g.set(k,[]).get(k)).push(p);});
  const lista=[...g.values()].map(ps=>({ps,m:ps[0].mentorado,total:ps.reduce((s,p)=>s+ +p.valor,0),pior:Math.min(...ps.map(p=>p.d)),cob:ps.map(p=>p.cobrado_em).filter(Boolean).sort().pop()}))
    .filter(x=>!q||norm(x.m?.nome).includes(q)).sort((x,y)=>y.total-x.total);
  if(!lista.length)return '<div class="cartao vazio">Ninguém devendo. Cobrança em dia.</div>';

    return `<div class="ctr small vencido"><div class="ctr-top"><div class="avatar sm ${avCls(nome)}">${iniciais(nome)}</div><div class="ctr-name"><b>${esc(nome)}</b><span>${x.ps.length} ${plural(x.ps.length,'parcela vencida','parcelas vencidas')} · a mais antiga há ${-x.pior} dias</span></div><div class="ctr-val"><b>${rsc(x.total)}</b><span>${x.m?.whatsapp?'WhatsApp salvo':'sem WhatsApp'}</span></div></div>
      <div class="ctr-line">${x.cob?tag(`cobrado em ${dbr(x.cob)}`,'inf'):tag('ainda não cobrado')}<span class="sp"></span><button class="btn xs" onclick='cobrarParcelas(${JSON.stringify(x.ps.map(p=>p.id))})'>Cobrar no WhatsApp</button><button class="btnv xs" onclick="BUSCA_REC=${JSON.stringify(nome).replace(/"/g,'&quot;')};setFiltroRec('atencao')">Ver parcelas</button></div></div>`;}).join('')}</div>
    <p class="nota">“Cobrar no WhatsApp” abre a conversa com a mensagem pronta (texto e chave PIX em Configurações). Você revisa e envia; o painel só anota a data da cobrança.</p>`;
}

/* ---------- A3 · já comprometido por mês nos cartões ---------- */
function graficoComprometido(){
  const L=[],P=[],A=[]; let livre=null;
  for(let i=0;i<8;i++){const d=new Date(ANO,MES+i,1), y=d.getFullYear(), m=d.getMonth();
    const tot=faturaTotal(y,m), ass=D.assinaturas.filter(x=>x.ativo!==false&&D.cartoes.some(c=>c.id===x.cartao_id)).reduce((s,x)=>s+ +x.valor,0);
    L.push(`${MESC[m]}/${String(y).slice(2)}`);A.push(ass);P.push(Math.max(0,tot-ass));}

    {plugins:{legend:{display:true,position:'bottom',labels:{color:'#9CA3AF',font:{size:12},boxWidth:10,padding:14,usePointStyle:true}},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${rsc(c.parsed.y)}`}}},
     scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#9CA3AF',font:{size:11}}},y:{stacked:true,beginAtZero:true,grid:{color:'rgba(255,255,255,.08)'},border:{display:false},ticks:{color:'#9CA3AF',font:{size:11},callback:v=>'R$ '+Math.round(v/1000)+'k'}}}});
}

/* ---------- C · quem o assessor atende (Configurações) ---------- */
function blocoAssessor(){

    <div class="formlinha" style="margin-top:14px"><div class="campo"><label for="acNome">Nome</label><input id="acNome" autocomplete="off"></div><div class="campo"><label for="acFone">WhatsApp com DDD</label><input id="acFone" inputmode="tel" placeholder="(11) 99999-9999" autocomplete="off"></div><div class="campo" style="flex:0 1 170px"><label for="acRel">Recebe relatórios</label><select id="acRel"><option value="1">Sim</option><option value="0">Não</option></select></div><button class="btn" onclick="novoContatoAssessor()">Autorizar número</button></div>
    <p class="nota">O assessor ignora qualquer número fora desta lista. Ele nunca movimenta dinheiro e toda ação pede a sua confirmação antes de gravar.</p></div>`;

<script>
/* Código da ponte do Google Agenda (o mesmo do arquivo google-agenda-ponte.gs), para o botão Copiar código. */
const PONTE_GS=String.raw`/**
 * PONTE GOOGLE AGENDA · Painel Rhino
 * Roda na SUA conta do Google e deixa o painel e o assessor lerem e marcarem compromissos.
 *
 * Como publicar (5 minutos, uma vez só):
 *  1. script.google.com  →  Novo projeto  →  apague o que estiver no editor e cole este arquivo inteiro.
 *  2. Na coluna da esquerda, em "Serviços", clique no +  →  "Google Calendar API"  →  Adicionar.
 *  3. Implantar  →  Nova implantação  →  tipo "App da Web"
 *        Executar como: Eu        Quem pode acessar: Qualquer pessoa        →  Implantar
 *  4. Autorizar acesso  →  escolha a sua conta  →  Avançado  →  Acessar o projeto  →  Permitir.
 *  5. Copie o "URL do app da Web" (termina em /exec) e cole no painel: Agenda → Conectar.
 *
 * Segurança: a primeira conexão grava uma chave secreta criada pelo servidor do painel.
 * Sem essa chave a ponte não responde a ninguém. Para desligar tudo: Implantar → Gerenciar
 * implantações → Arquivar.
 */
var PROP = PropertiesService.getScriptProperties();
var FUSO = 'America/Sao_Paulo';

function doGet() { return saida({ ok: true, ponte: 'Painel Rhino' }); }

function doPost(e) {
  var out;
  try {
    var b = JSON.parse((e && e.postData && e.postData.contents) || '{}');
    var atual = PROP.getProperty('CHAVE');
    if (b.acao === 'configurar') {
      if (atual && b.chave_antiga !== atual) throw new Error('esta ponte já está ligada a um painel');
      if (!b.chave || String(b.chave).length < 32) throw new Error('chave inválida');
      PROP.setProperty('CHAVE', String(b.chave));
      out = { ok: true, agenda: CalendarApp.getDefaultCalendar().getName() };
    } else {
      if (!atual || b.chave !== atual) throw new Error('não autorizado');
      out = executar(b);
    }
  } catch (err) { out = { erro: String((err && err.message) || err) }; }
  return saida(out);
}
function saida(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

function executar(b) {
  var cal = 'primary';
  if (b.acao === 'listar') {
    var r = Calendar.Events.list(cal, { timeMin: b.de, timeMax: b.ate, singleEvents: true, orderBy: 'startTime', maxResults: 150 });
    return { eventos: (r.items || []).filter(function (ev) { return ev.status !== 'cancelled'; }).map(resumir) };
  }
  if (b.acao === 'criar') {
    var convidados = (b.convidados || []).map(function (email) { return { email: email }; });
    var ev = {
      summary: b.titulo, description: b.descricao || '',
      start: { dateTime: b.inicio, timeZone: FUSO }, end: { dateTime: b.fim, timeZone: FUSO },
      attendees: convidados, reminders: { useDefault: true },
      extendedProperties: { 'private': { rhino: '1', mentorado_id: b.mentorado_id || '' } }
    };
    if (b.meet !== false) ev.conferenceData = { createRequest: { requestId: Utilities.getUuid(), conferenceSolutionKey: { type: 'hangoutsMeet' } } };
    return { evento: resumir(Calendar.Events.insert(ev, cal, { conferenceDataVersion: 1, sendUpdates: convidados.length ? 'all' : 'none' })) };
  }
  if (b.acao === 'mover') {
    var m = Calendar.Events.patch({ start: { dateTime: b.inicio, timeZone: FUSO }, end: { dateTime: b.fim, timeZone: FUSO } }, cal, b.id, { sendUpdates: 'all' });
    return { evento: resumir(m) };
  }
  if (b.acao === 'cancelar') { Calendar.Events.remove(cal, b.id, { sendUpdates: 'all' }); return { ok: true }; }
  throw new Error('ação desconhecida');
}

function resumir(ev) {
  var priv = (ev.extendedProperties && ev.extendedProperties['private']) || {};
  return {
    id: ev.id, titulo: ev.summary || '(sem título)',
    inicio: ev.start.dateTime || ev.start.date, fim: ev.end.dateTime || ev.end.date, dia_inteiro: !ev.start.dateTime,
    meet: ev.hangoutLink || '', link: ev.htmlLink || '',
    convidados: (ev.attendees || []).map(function (a) { return a.email; }),
    mentorado_id: priv.mentorado_id || '', criado_pelo_assessor: !!priv.rhino
  };
}
`;
</script>
<script>
/* ================= AGENDA (Google Agenda pela função "agenda") =================
   O painel nunca fala direto com o Google: pede para a função do Supabase, que conversa com a ponte
   em Apps Script publicada na conta do dono. A chave da ponte nasce no servidor, na hora de conectar. */
let AGENDA={estado:'ocioso',eventos:[],erro:'',nome:'',semana:null,chave:''};
const segundaDe=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};

async function chamarAgenda(corpo){
  const {data,error}=await sb.functions.invoke('agenda',{body:corpo});
  if(error){let msg=error.message;try{const j=await error.context.json();if(j&&j.erro)msg=j.erro;}catch(e){} throw new Error(msg);}

  const ini=AGENDA.semana, fim=new Date(ini);fim.setDate(fim.getDate()+6);

  for(let i=0;i<7;i++){const d=new Date(ini);d.setDate(d.getDate()+i);const k=iso(d), doDia=evs.filter(e=>String(e.dia_inteiro?e.inicio:iso(new Date(e.inicio))).slice(0,10)===k);
    if(!doDia.length&&k!==hojeIso)continue;

  if(!evs.length)h+='<div class="cartao vazio" style="margin-top:12px">Nenhum compromisso nesta semana.</div>';
