<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel RHINO · Consulting Framework</title>
<style>
:root{
  --preto:#000; --carvao:#0d0d0d; --grafite:#161616; --linha:#242424; --linha2:#1a1a1a;
  --cinza:#E6E8E9; --fraco:#8a8d8f; --verde:#44CF17; --verdebg:#122b06;
  --vermelho:#e24b4a; --vermelhobg:#2a0f0f; --ambar:#EF9F27; --ambarbg:#2b1d05;
  --azul:#378ADD;
  --mono:"Courier New",Courier,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--preto);color:var(--cinza);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer}
.rotulo{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fraco)}
.q{display:inline-block;width:9px;height:9px;background:var(--verde);margin-right:9px;flex:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--verde)} .neg{color:var(--vermelho)} .av{color:var(--ambar)}
.oculto{display:none !important}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.cxlogin{width:100%;max-width:360px;border:1px solid var(--linha);background:var(--carvao);padding:34px 30px}
.cxlogin h1{font-size:20px;font-weight:600;margin:14px 0 4px}
.cxlogin p{font-size:13px;color:var(--fraco);margin-bottom:22px}
.campo{margin-bottom:12px}
.campo label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fraco);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--grafite);border:1px solid var(--linha);color:var(--cinza);padding:9px 11px;border-radius:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde)}
.btn{background:var(--verde);color:#000;border:none;padding:10px 18px;font-weight:600;font-size:13px}
.btn:hover{filter:brightness(1.12)}
.btnv{background:transparent;color:var(--cinza);border:1px solid var(--linha);padding:8px 14px;font-size:13px}
.btnv:hover{border-color:var(--verde);color:var(--verde)}
.erro{background:var(--vermelhobg);border:1px solid var(--vermelho);color:#f5b0b0;padding:9px 12px;font-size:13px;margin-top:12px}

header{border-bottom:1px solid var(--linha);background:var(--carvao);position:sticky;top:0;z-index:20}
.topo{max-width:1240px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto}
.marca img{height:26px}
.marca .nome{font-weight:600;font-size:15px}
header select{width:auto;padding:6px 10px;font-family:var(--mono);font-size:12px}
nav{border-bottom:1px solid var(--linha);overflow-x:auto}
.abas{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:2px}
.abas button{background:none;border:none;border-bottom:2px solid transparent;color:var(--fraco);padding:12px 15px;font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}
.abas button.on{color:var(--verde);border-bottom-color:var(--verde)}
.abas button:hover{color:var(--cinza)}
main{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
h2{font-size:13px;font-family:var(--mono);letter-spacing:.13em;text-transform:uppercase;font-weight:400;display:flex;align-items:center;margin:28px 0 12px}
h2:first-child{margin-top:0}

.grade{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.cartao{background:var(--carvao);border:1px solid var(--linha);padding:16px}

.hero{background:var(--carvao);border:1px solid var(--linha);padding:20px;position:relative;overflow:hidden}
.hero .t{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--fraco);margin-bottom:9px}
.hero .v{font-family:var(--mono);font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:-.025em;line-height:1.1}
.hero .s{font-size:12px;color:var(--fraco);margin-top:7px}
.hero.big{border-color:var(--verde)}
.hero .faixa{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--verde)}
.hero.r .faixa{background:var(--vermelho)} .hero.b .faixa{background:var(--azul)}

.kpi{background:var(--carvao);border:1px solid var(--linha);padding:14px 15px}
.kpi .t{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fraco);margin-bottom:6px}
.kpi .v{font-family:var(--mono);font-size:23px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--fraco);margin-top:4px}

.barra{height:9px;background:var(--grafite);overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--verde);transition:width .3s}
.barra.r i{background:var(--vermelho)} .barra.a i{background:var(--ambar)}

.combo{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,300px);gap:20px;align-items:center}
@media(max-width:820px){.combo{grid-template-columns:1fr}}
.leg{display:flex;flex-direction:column;gap:2px}
.leg .it{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--linha2)}
.leg .it:last-child{border-bottom:none}
.leg .pt{width:11px;height:11px;flex:none}
.leg .nm{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .vl{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.leg .pc{font-family:var(--mono);font-size:11px;color:var(--fraco);width:44px;text-align:right}
.leg .tot{display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:1px solid var(--linha);font-family:var(--mono);font-size:14px}
.grafico{position:relative;height:270px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fraco);text-align:left;padding:8px;border-bottom:1px solid var(--linha);font-weight:400;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--linha2);vertical-align:middle}
tbody tr:hover{background:var(--grafite)}
td.d,th.d{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rolagem{overflow-x:auto}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--linha);color:var(--fraco);white-space:nowrap;background:none}
.tag.ok{color:var(--verde);border-color:#1e4a0c;background:var(--verdebg)}
.tag.mal{color:var(--vermelho);border-color:#4a1414;background:var(--vermelhobg)}
.tag.al{color:var(--ambar);border-color:#4a3410;background:var(--ambarbg)}
.x{background:none;border:none;color:#4a4a4a;font-size:15px;padding:0 4px}
.x:hover{color:var(--vermelho)}
.ed{background:transparent;border:1px solid transparent;color:var(--cinza);padding:3px 5px;width:100%;min-width:58px;font-size:13px}
.ed:hover{border-color:var(--linha);background:var(--grafite)}
.ed:focus{border-color:var(--verde);background:var(--grafite);outline:none}
.ed.n{font-family:var(--mono);text-align:right}
.ed.dt{font-family:var(--mono);width:134px}
select.ed{width:auto;min-width:96px}

.alerta{display:flex;gap:10px;padding:11px 13px;border-left:3px solid var(--linha);background:var(--grafite);margin-bottom:7px;font-size:13px;line-height:1.6}
.alerta.a{border-left-color:var(--ambar)} .alerta.r{border-left-color:var(--vermelho)}
.alerta.v{border-left-color:var(--verde)} .alerta.b{border-left-color:var(--azul)}
.linhafina{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--grafite);border-left:3px solid var(--verde);padding:11px 14px;font-size:13px;flex-wrap:wrap}
.formlinha{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.formlinha .campo{margin:0;flex:1;min-width:120px}
.vazio{text-align:center;color:var(--fraco);padding:26px 14px;font-size:13px}
.nota{font-size:12px;color:var(--fraco);margin-top:9px;line-height:1.6}
footer{border-top:1px solid var(--linha);padding:18px;text-align:center}
.sem{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.sem .c{background:var(--grafite);padding:11px 12px}
.sem .c .lb{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fraco)}
.sem .c .vv{font-family:var(--mono);font-size:17px;margin-top:4px}
.sem .c .pp{font-family:var(--mono);font-size:11px;color:var(--fraco);margin-top:3px}
@media(max-width:640px){.hero .v{font-size:27px}.kpi .v{font-size:20px}main{padding:18px 13px 70px}.topo,.abas{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>

<div id="login"><div class="cxlogin">
  <div class="rotulo"><span class="q"></span>Consulting Framework</div>
  <h1>Painel financeiro</h1>
  <p>Entre para ver e lançar os números.</p>
  <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username"></div>
  <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password"></div>
  <button class="btn" id="btEntrar" style="width:100%;margin-top:8px">Entrar</button>
  <div id="erroLogin" class="erro oculto"></div>
</div></div>

<div id="app" class="oculto">
<header><div class="topo">
  <div class="marca"><img id="logoTopo" class="oculto" alt=""><span class="q" id="qTopo"></span><span class="nome" id="nomeNegocio">Painel RHINO</span></div>
  <select id="selMes" aria-label="Mês"></select>
  <button class="btnv" id="btSair">Sair</button>
</div></header>
<nav><div class="abas" id="abas">
  <button data-a="dash" class="on">Dashboard</button>
  <button data-a="contr">Contratos</button>
  <button data-a="receb">Recebíveis</button>
  <button data-a="desp">Despesas</button>
  <button data-a="lanc">Lançamentos</button>
  <button data-a="cart">Cartões</button>
  <button data-a="inv">Investimentos</button>
  <button data-a="conf">Configurações</button>
</div></nav>
<main>
  <section id="v-dash"></section>
  <section id="v-contr" class="oculto"></section>
  <section id="v-receb" class="oculto"></section>
  <section id="v-desp" class="oculto"></section>
  <section id="v-lanc" class="oculto"></section>
  <section id="v-cart" class="oculto"></section>
  <section id="v-inv" class="oculto"></section>
  <section id="v-conf" class="oculto"></section>
</main>
<footer><div class="rotulo" id="rodape">Consulting Framework · RHINO</div></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const SUPABASE_URL='https://fcwxkelokmqwmivjembv.supabase.co';
const SUPABASE_KEY='sb_publishable_eo9wQ05w390iA0V13ACSqg_Lihy643Q';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const CORES=['#44CF17','#378ADD','#7F77DD','#EF9F27','#e24b4a','#1baf7a','#D4537E','#888780','#eb6834','#4a3aa7'];
const HOJE=new Date();
let MES=HOJE.getMonth(), ANO=HOJE.getFullYear(), ABA='dash';
let D={config:{},produtos:[],mentorados:[],contratos:[],parcelas:[],lancamentos:[],recorrencias:[],cartoes:[],parcelamentos:[],assinaturas:[],metas:[],investimentos:[],faturas:[],categorias:[]};
const G={};

const rs=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const rsc=v=>'R$ '+Math.round(Number(v)||0).toLocaleString('pt-BR');
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chave=(a,m)=>`${a}-${String(m+1).padStart(2,'0')}`;
const noMes=(s,a,m)=>{if(!s)return false;const[y,mm]=String(s).slice(0,10).split('-').map(Number);return y===a&&mm===m+1;};
const dObj=s=>{const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d);};
const dif=(a,b)=>(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
const dias=v=>Math.floor((dObj(v)-HOJE)/86400000);
const prod=id=>D.produtos.find(p=>p.id===id);

function toast(m,e){const t=document.createElement('div');t.textContent=m;
t.style.cssText=`position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:${e?'#2a0f0f':'#122b06'};border:1px solid ${e?'#e24b4a':'#44CF17'};color:${e?'#f5b0b0':'#c7f0b0'};padding:10px 18px;font-size:13px;z-index:99;font-family:Courier New,monospace`;
document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

/* ---------- login ---------- */
document.getElementById('btEntrar').onclick=entrar;
document.getElementById('senha').onkeydown=e=>{if(e.key==='Enter')entrar()};
async function entrar(){
  const email=document.getElementById('email').value.trim(), password=document.getElementById('senha').value;
  const cx=document.getElementById('erroLogin'); cx.classList.add('oculto');
  if(!email||!password){cx.textContent='Preencha e-mail e senha.';cx.classList.remove('oculto');return;}
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){cx.textContent=error.message.includes('Invalid')?'E-mail ou senha incorretos.':error.message;cx.classList.remove('oculto');return;}
  iniciar();
}
document.getElementById('btSair').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(({data})=>{if(data.session)iniciar()});

async function iniciar(){
  document.getElementById('login').classList.add('oculto');
  document.getElementById('app').classList.remove('oculto');
  const s=document.getElementById('selMes');
  for(let i=-13;i<=4;i++){const d=new Date(HOJE.getFullYear(),HOJE.getMonth()+i,1);
    const o=document.createElement('option');o.value=`${d.getFullYear()}-${d.getMonth()}`;
    o.textContent=`${MESES[d.getMonth()]} ${d.getFullYear()}`;if(i===0)o.selected=true;s.appendChild(o);}
  s.onchange=()=>{const[a,m]=s.value.split('-').map(Number);ANO=a;MES=m;desenhar()};
  await carregar();
}
document.getElementById('abas').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  ABA=b.dataset.a;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  ['dash','contr','receb','desp','lanc','cart','inv','conf'].forEach(k=>document.getElementById('v-'+k).classList.toggle('oculto',k!==ABA));
  desenhar();};
function irPara(a){document.querySelector(`#abas button[data-a="${a}"]`).click();window.scrollTo(0,0)}

async function carregar(){
  const t=['config','produtos','mentorados','contratos','parcelas','lancamentos','recorrencias','cartoes','parcelamentos','assinaturas','metas','investimentos','faturas','categorias'];
  const r=await Promise.all(t.map(x=>sb.from(x).select('*')));
  let faltou=false;
  r.forEach((res,i)=>{if(res.error){faltou=true;return;} D[t[i]]=res.data||[];});
  D.config=(Array.isArray(D.config)&&D.config[0])||D.config||{};
  D.produtos.sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  D.categorias.sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  if(faltou||!D.categorias.length) toast('Rode o supabase-migracao-v3.sql para liberar as telas novas.',true);
  marca(); desenhar();
}
function marca(){
  const c=D.config;
  if(c.cor_primaria)document.documentElement.style.setProperty('--verde',c.cor_primaria);
  if(c.cor_fundo)document.documentElement.style.setProperty('--preto',c.cor_fundo);
  document.getElementById('nomeNegocio').textContent=c.negocio||'Painel RHINO';
  document.getElementById('rodape').textContent=c.assinatura||'Consulting Framework · RHINO';
  const i=document.getElementById('logoTopo');
  if(c.logo_url){i.src=c.logo_url;i.classList.remove('oculto');document.getElementById('qTopo').classList.add('oculto');}
}

/* ================= CÁLCULOS ================= */
function caixaMes(a,m){
  let t=0;const pp={};
  D.parcelas.filter(p=>p.pago&&noMes(p.data_pagamento||p.vencimento,a,m)).forEach(p=>{
    const c=D.contratos.find(x=>x.id===p.contrato_id);if(!c)return;
    t+=+p.valor;pp[c.produto_id]=(pp[c.produto_id]||0)+ +p.valor;});
  D.lancamentos.filter(l=>l.tipo==='entrada'&&l.pago&&noMes(l.data,a,m)).forEach(l=>{
    t+=+l.valor;pp[l.produto_id]=(pp[l.produto_id]||0)+ +l.valor;});
  return {total:t,pp};
}
function despesasMes(a,m){
  let t=0;const pc={};
  D.lancamentos.filter(l=>l.tipo==='despesa'&&noMes(l.data,a,m)).forEach(l=>{
    t+=+l.valor;pc[l.categoria]=(pc[l.categoria]||0)+ +l.valor;});
  return {total:t,pc};
}
const aPagar=(a,m)=>D.lancamentos.filter(l=>l.tipo==='despesa'&&!l.pago&&noMes(l.data,a,m)).reduce((s,l)=>s+ +l.valor,0);
const pagoMes=(a,m)=>D.lancamentos.filter(l=>l.tipo==='despesa'&&l.pago&&noMes(l.data,a,m)).reduce((s,l)=>s+ +l.valor,0);

function faturaCartao(id,a,m){
  const ref=new Date(a,m,1);let t=0;
  D.parcelamentos.filter(p=>p.cartao_id===id).forEach(p=>{
    const n=dif(dObj(p.primeira_competencia),ref);if(n>=0&&n<p.total_parcelas)t+=+p.valor_parcela;});
  D.assinaturas.filter(x=>x.cartao_id===id&&x.ativo!==false).forEach(x=>t+=+x.valor);
  return t;
}
const faturaTotal=(a,m)=>D.cartoes.reduce((s,c)=>s+faturaCartao(c.id,a,m),0);
const impostoMes=()=>(+D.config.base_declarada||0)*(+D.config.aliquota||0)/100;
const totalInvestido=()=>D.investimentos.reduce((s,i)=>s+ +i.valor,0);
const metaMes=(a,m)=>(D.metas.filter(x=>x.ano_mes===chave(a,m)).reduce((s,x)=>s+ +x.valor,0))||(+D.config.meta_mensal||0);

function abertas(){
  return D.parcelas.filter(p=>!p.pago).map(p=>{
    const c=D.contratos.find(x=>x.id===p.contrato_id);
    return {...p,contrato:c,mentorado:c?D.mentorados.find(x=>x.id===c.mentorado_id):null,d:dias(p.vencimento)};
  }).filter(p=>p.contrato&&p.contrato.status!=='cancelado').sort((a,b)=>String(a.vencimento).localeCompare(String(b.vencimento)));
}
function previsao(n){
  const r=[],ab=abertas();
  for(let i=0;i<n;i++){const d=new Date(ANO,MES+i,1);
    r.push({mes:`${MESC[d.getMonth()]}/${String(d.getFullYear()).slice(2)}`,
      valor:ab.filter(p=>noMes(p.vencimento,d.getFullYear(),d.getMonth())).reduce((s,p)=>s+ +p.valor,0)});}
  return r;
}
function semanas(a,m){
  const ult=new Date(a,m+1,0).getDate();
  const faixas=[[1,7],[8,14],[15,21],[22,ult]];
  const meta=metaMes(a,m), alvo=meta/4;
  let acum=0;
  return faixas.map(([i,f],k)=>{
    let v=0;
    D.parcelas.filter(p=>p.pago&&noMes(p.data_pagamento||p.vencimento,a,m)).forEach(p=>{
      const dd=dObj(p.data_pagamento||p.vencimento).getDate();if(dd>=i&&dd<=f)v+=+p.valor;});
    D.lancamentos.filter(l=>l.tipo==='entrada'&&l.pago&&noMes(l.data,a,m)).forEach(l=>{
      const dd=dObj(l.data).getDate();if(dd>=i&&dd<=f)v+=+l.valor;});
    acum+=v;
    return {n:k+1,ini:i,fim:f,valor:v,alvo,pct:alvo?v/alvo*100:0,acum,pctAcum:meta?acum/meta*100:0};
  });
}

/* ================= AGENTE ================= */
function agente(){
  const A=[];
  const cx=caixaMes(ANO,MES), dp=despesasMes(ANO,MES);
  const fat=faturaTotal(ANO,MES), imp=impostoMes(), meta=metaMes(ANO,MES);
  const caixa=+D.config.caixa_empresa||0, inv=totalInvestido();
  const ab=abertas(), atr=ab.filter(p=>p.d<0);
  const hoje=HOJE.getDate(), ult=new Date(ANO,MES+1,0).getDate();
  const mesAtual=(ANO===HOJE.getFullYear()&&MES===HOJE.getMonth());
  const res=cx.total-dp.total;

  A.push([res>=0?'v':'r',`<strong>Resultado de ${MESES[MES]}: ${rs(res)}.</strong> Entrou ${rs(cx.total)} e saiu ${rs(dp.total)}. Margem de ${cx.total?(res/cx.total*100).toFixed(1):'0'}%.`]);

  if(meta>0&&mesAtual&&hoje>3){
    const proj=cx.total/hoje*ult, falta=Math.max(0,meta-cx.total), restam=Math.max(1,ult-hoje);
    if(proj<meta*0.95) A.push(['a',`<strong>Ritmo abaixo da meta.</strong> No passo atual o mês fecha em ${rsc(proj)}, ${rsc(meta-proj)} abaixo. Faltam ${rsc(falta)} em ${restam} dias, ou ${rsc(falta/restam)} por dia.`]);
    else A.push(['v',`<strong>Ritmo acima da meta.</strong> No passo atual o mês fecha em ${rsc(proj)}.`]);
  }

  const sm=semanas(ANO,MES).filter(s=>!mesAtual||s.ini<=hoje);
  const fracas=sm.filter(s=>s.pct<60);
  if(fracas.length>=2) A.push(['a',`<strong>${fracas.length} semanas abaixo de 60% da meta semanal.</strong> A entrada está concentrada em poucos dias, o que aperta o caixa no meio do mês.`]);

  if(atr.length){
    const v=atr.reduce((s,p)=>s+ +p.valor,0);
    const pior=atr.reduce((a,b)=>a.d<b.d?a:b);
    A.push(['r',`<strong>${atr.length} parcelas vencidas somando ${rs(v)}.</strong> A mais antiga é de ${esc(pior.mentorado?.nome||'sem nome')}, há ${-pior.d} dias.`]);
  }

  const mrrDe=l=>l.reduce((s,c)=>s+ +c.valor_total/Math.max(1,c.meses),0);
  const venc=D.contratos.filter(c=>c.status==='ativo'&&dias(c.data_fim)<0);
  const prox=D.contratos.filter(c=>c.status==='ativo'&&dias(c.data_fim)>=0&&dias(c.data_fim)<=30);
  if(venc.length) A.push(['r',`<strong>${venc.length} contratos venceram e seguem marcados como ativos</strong>, ${rsc(mrrDe(venc))} de MRR que pode já ter saído. Revisar na aba Contratos.`]);
  if(prox.length) A.push(['a',`<strong>${prox.length} contratos vencem em 30 dias</strong>, ${rsc(mrrDe(prox))} de MRR em risco. Abrir a conversa de renovação agora custa menos que recuperar depois.`]);
  const canc=D.contratos.filter(c=>c.status==='cancelado').length;
  const ativos=D.contratos.filter(c=>c.status==='ativo').length;
  if(canc&&ativos){
    const tx=canc/(canc+ativos)*100;
    if(tx>15) A.push(['a',`<strong>Churn acumulado de ${tx.toFixed(0)}%</strong>, ${canc} cancelados contra ${ativos} ativos. Acima de 15% o custo de aquisição para de se pagar.`]);
  }

  const cats=Object.entries(dp.pc).sort((a,b)=>b[1]-a[1]);
  if(cats.length) A.push(['b',`<strong>Maior despesa: ${esc(cats[0][0])}, ${rs(cats[0][1])}</strong>, ${(cats[0][1]/dp.total*100).toFixed(0)}% do total do mês.`]);
  const ap=aPagar(ANO,MES);
  if(ap>0) A.push(['a',`<strong>${rs(ap)} ainda a pagar</strong> em ${MESES[MES]}. Com ${rsc(cx.total)} recebido, o caixa do mês ${cx.total>=ap?'cobre':'não cobre e vai puxar da reserva'}.`]);

  D.cartoes.forEach(c=>{
    const f=faturaCartao(c.id,ANO,MES), f3=faturaCartao(c.id,ANO,MES+3);
    if(f>1000&&f3<f*0.65) A.push(['v',`<strong>${esc(c.nome)}:</strong> a fatura cai de ${rsc(f)} para ${rsc(f3)} em 3 meses sozinha. Não parcelar nada nele libera ${rsc(f-f3)} por mês.`]);
  });
  const novos=D.parcelamentos.filter(p=>noMes(p.primeira_competencia,ANO,MES));
  if(novos.length) A.push(['r',`<strong>${novos.length} parcelamentos novos neste mês</strong>, criando ${rs(novos.reduce((s,p)=>s+ +p.valor_parcela*p.total_parcelas,0))} de compromisso futuro. Cada um adia a data de liberdade.`]);
  else if(D.parcelamentos.length) A.push(['v',`<strong>Zero parcelamento novo em ${MESES[MES]}.</strong> Mantendo assim a fatura cai sozinha.`]);

  if(imp>0&&cx.total>0) A.push(['b',`<strong>Provisionar ${rs(imp)} de imposto</strong>, ${D.config.aliquota}% sobre ${rsc(D.config.base_declarada)}. Separar ao receber evita o susto no vencimento.`]);
  const custo=dp.total||(fat+imp);
  if(custo>0){
    const m=(caixa+inv)/custo;
    if(m<3) A.push(['r',`<strong>Reserva de ${m.toFixed(1)} mês(es).</strong> ${rsc(caixa)} em conta mais ${rsc(inv)} investido contra custo mensal de ${rsc(custo)}. O alvo de 3 meses seria ${rsc(custo*3)}.`]);
    else A.push(['v',`<strong>Reserva de ${m.toFixed(1)} meses de operação.</strong> Dentro do alvo.`]);
  }
  const pl=D.recorrencias.find(r=>/labore/i.test(r.descricao||''));
  if(pl&&!D.lancamentos.some(l=>noMes(l.data,ANO,MES)&&/labore/i.test(l.descricao||'')))
    A.push(['a',`<strong>Pró-labore de ${rs(pl.valor)} ainda não lançado</strong> em ${MESES[MES]}. Gerar os fixos na aba Despesas.`]);
  const rp=(D.config.repasse_meses||'1,4,7,10').split(',').map(x=>+x.trim()-1);
  if(rp.includes(MES)) A.push(['a',`<strong>Mês de repasse da sociedade.</strong> Fechar o trimestre e acertar com o Jefferson.`]);
  return A;
}

/* ================= RENDER ================= */
function desenhar(){
  ({dash:verDash,contr:verContratos,receb:verRecebiveis,desp:verDespesas,

}

    ${kpi('Pago no mês',rsc(pg),'despesas quitadas')}
    ${kpi('Ainda a pagar',rsc(ap),'despesas em aberto',ap?'av':'')}
  </div>

  <h2><span class="q"></span>Meta · semana a semana</h2>
  <div class="cartao">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:6px">

      <div class="pp">${s.pct.toFixed(0)}% da semana · ${s.pctAcum.toFixed(0)}% acumulado</div></div>`).join('')}</div>
  </div>

  <h2><span class="q"></span>Despesas por categoria</h2>
  <div class="cartao"><div class="combo">
    <div class="grafico"><canvas id="gDesp" role="img" aria-label="Despesas do mês por categoria"></canvas></div>
    <div class="leg" id="legDesp"></div>
  </div></div>

  <h2><span class="q"></span>Previsão de recebimento · contratos parcelados</h2>
  <div class="cartao"><div class="combo">
    <div class="grafico"><canvas id="gPrev" role="img" aria-label="Previsão de recebimento dos próximos seis meses"></canvas></div>
    <div class="leg" id="legPrev"></div>
  </div><p class="nota">Atualiza sozinho quando você dá baixa numa parcela ou muda um vencimento.</p></div>

  <h2><span class="q"></span>Carteiras de investimento</h2>
  <div class="cartao">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
      <span class="rotulo">Total investido</span><span class="num" style="font-size:22px">${rsc(inv)}</span></div>
    <div class="leg">${[...D.investimentos].sort((a,b)=>+b.valor-+a.valor).map((i,k)=>`
      <div class="it"><span class="pt" style="background:${CORES[k%CORES.length]}"></span>
      <span class="nm">${esc(i.banco)} <span class="rotulo" style="font-size:10px">${esc(i.tipo||'')}</span></span>
      <span class="vl">${rs(i.valor)}</span><span class="pc">${inv?(+i.valor/inv*100).toFixed(0):0}%</span></div>`).join('')
      ||'<div class="vazio">Nenhuma carteira cadastrada.</div>'}</div>
    <div style="margin-top:12px"><button class="btnv" onclick="irPara('inv')">Editar carteiras</button></div>

  <h2><span class="q"></span>Faturas de cartão</h2>
  <div class="cartao"><div class="leg">
    ${D.cartoes.map(c=>{const f=faturaCartao(c.id,ANO,MES);return f>0?`<div class="it">
      <span class="pt" style="background:${c.escopo==='empresa'?'#378ADD':'#8a8d8f'}"></span>

function graficoDespesas(dp){
  const e=Object.entries(dp.pc).sort((a,b)=>b[1]-a[1]);
  const leg=document.getElementById('legDesp');
  if(!e.length){leg.innerHTML='<div class="vazio">Nenhuma despesa lançada neste mês.</div>';return;}
  leg.innerHTML=e.map(([n,v],k)=>`<div class="it"><span class="pt" style="background:${CORES[k%CORES.length]}"></span>
    <span class="nm">${esc(n)}</span><span class="vl">${rs(v)}</span><span class="pc">${(v/dp.total*100).toFixed(0)}%</span></div>`).join('')
    +`<div class="tot"><span class="rotulo">Total</span><span>${rs(dp.total)}</span></div>`;
  pinta('gDesp','doughnut',{labels:e.map(x=>x[0]),
    datasets:[{data:e.map(x=>x[1]),backgroundColor:e.map((_,k)=>CORES[k%CORES.length]),borderColor:'#0d0d0d',borderWidth:2}]});
}
function graficoPrevisao(){
  const p=previsao(6), tot=p.reduce((s,x)=>s+x.valor,0);
  document.getElementById('legPrev').innerHTML=p.map((x,k)=>`<div class="it">
    <span class="pt" style="background:${k===0?'#44CF17':'#378ADD'}"></span><span class="nm">${x.mes}</span>
    <span class="vl">${rs(x.valor)}</span><span class="pc">${tot?(x.valor/tot*100).toFixed(0):0}%</span></div>`).join('')
    +`<div class="tot"><span class="rotulo">6 meses</span><span>${rs(tot)}</span></div>`;
  pinta('gPrev','bar',{labels:p.map(x=>x.mes),
    datasets:[{label:'A receber',data:p.map(x=>x.valor),backgroundColor:p.map((_,k)=>k===0?'#44CF17':'#378ADD'),borderRadius:3,maxBarThickness:34}]});
}
function pinta(id,tipo,data){
  const el=document.getElementById(id);if(!el)return;
  if(G[id])G[id].destroy();
  G[id]=new Chart(el,{type:tipo,data,options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+rsc(c.parsed.y??c.parsed)}}},
    scales:tipo==='doughnut'?{}:{x:{grid:{display:false},ticks:{color:'#8a8d8f',font:{family:'Courier New',size:11}}},
      y:{beginAtZero:true,grid:{color:'#1c1c1c'},ticks:{color:'#8a8d8f',font:{family:'Courier New',size:11},callback:v=>'R$ '+Math.round(v/1000)+'k'}}}}});
}

/* ================= CONTRATOS ================= */

    .filter(c=>c.m).sort((a,b)=>a.d-b.d);
  const at=lst.filter(c=>c.status==='ativo');

  lst.forEach(c=>{

      <td class="d"><input class="ed n" type="number" step="0.01" value="${c.valor_total}" onchange="upNum('contratos','${c.id}','valor_total',this.value)"></td>

  document.getElementById('v-contr').innerHTML=h;
}
async function novoContrato(){
  const nome=document.getElementById('cnNome').value.trim();
  const produto_id=document.getElementById('cnProd').value;
  const valor=+document.getElementById('cnValor').value||0;
  const meses=Math.max(1,+document.getElementById('cnMeses').value||1);
  const ini=document.getElementById('cnIni').value;
  if(!nome)return toast('Informe o nome.',true);
  if(!valor)return toast('Informe o valor total.',true);
  if(!ini)return toast('Informe a data de início.',true);
  const {data:m,error:e1}=await sb.from('mentorados').insert({nome,produto_id,
    instagram:document.getElementById('cnIg').value.trim()||null,
    calls_contratadas:+document.getElementById('cnCalls').value||0}).select().single();
  if(e1)return toast('Erro: '+e1.message,true);
  const di=dObj(ini), df=new Date(di.getFullYear(),di.getMonth()+meses,di.getDate());
  const {data:c,error:e2}=await sb.from('contratos').insert({mentorado_id:m.id,produto_id,
    valor_total:valor,meses,data_inicio:ini,data_fim:iso(df)}).select().single();
  if(e2)return toast('Erro no contrato: '+e2.message,true);
  const ps=[];for(let i=0;i<meses;i++){const v=new Date(di.getFullYear(),di.getMonth()+i,di.getDate());
    ps.push({contrato_id:c.id,numero:i+1,valor:+(valor/meses).toFixed(2),vencimento:iso(v),pago:false});}
  const {data:pp}=await sb.from('parcelas').insert(ps).select();
  D.mentorados.push(m);D.contratos.push(c);D.parcelas.push(...(pp||[]));
  ['cnNome','cnIg','cnValor'].forEach(i=>document.getElementById(i).value='');
  toast(`${nome} adicionado com ${meses} parcelas.`);desenhar();
}
async function mudaStatus(id,st){
  const {error}=await sb.from('contratos').update({status:st}).eq('id',id);
  if(error)return toast('Erro: '+error.message,true);
  const c=D.contratos.find(x=>x.id===id);if(c)c.status=st;
  if(st==='cancelado'&&c){const m=D.mentorados.find(x=>x.id===c.mentorado_id);

function verRecebiveis(){

  const aV=ab.filter(p=>p.d>=0), f1=f(1,30), f2=f(31,60), f3=f(61,null);
  const sm=a=>a.reduce((s,p)=>s+ +p.valor,0);
  let h=`<h2><span class="q"></span>Recebíveis</h2>
  <div class="grade g4">
    ${kpi('A vencer',rsc(sm(aV)),`${aV.length} parcelas`)}

    ${kpi('31 a 60 dias',rsc(sm(f2)),`${f2.length} vencidas`,f2.length?'av':'')}
    ${kpi('Mais de 60 dias',rsc(sm(f3)),`${f3.length} vencidas`,f3.length?'neg':'')}

  h+=`<div class="cartao rolagem"><table><thead><tr>

  </tr></thead><tbody>`;
  ab.forEach(p=>{

      at>60?'<span class="tag mal">vencida 60+</span>':at>30?'<span class="tag mal">vencida 31-60</span>':`<span class="tag al">vencida ${at}d</span>`;
    h+=`<tr>

      <td><input class="ed dt" type="date" value="${String(p.vencimento).slice(0,10)}" onchange="up('parcelas','${p.id}','vencimento',this.value)"></td>
      <td>${tg}</td>
      <td class="d"><input class="ed n" type="number" step="0.01" value="${p.valor}" onchange="upNum('parcelas','${p.id}','valor',this.value)"></td>

      <button class="x" onclick="del('parcelas','${p.id}')" aria-label="Remover">✕</button></td>
    </tr>`;});
  h+=`</tbody></table></div>
  <p class="nota">Mudar o vencimento recalcula na hora se está a vencer ou vencida, e o alerta do dashboard acompanha.</p>`;

function selCat(sel,tipo){
  const l=D.categorias.filter(c=>c.tipo===tipo&&c.ativo!==false);
  let o=l.map(c=>`<option value="${esc(c.nome)}"${c.nome===sel?' selected':''}>${esc(c.nome)}</option>`).join('');
  if(sel&&!l.some(c=>c.nome===sel)) o=`<option value="${esc(sel)}" selected>${esc(sel)}</option>`+o;
  return o||`<option value="Outros">Outros</option>`;
}

  if(error)return toast('Erro: '+error.message,true);
  D.parcelamentos.push(data);['pDesc','pCat','pValor'].forEach(i=>document.getElementById(i).value='');
  toast('Parcelamento cadastrado.');desenhar();
}
function lerFatura(txt,cartao_id){
  const parc=[],ass=[];
  txt.split('\n').forEach(li=>{
    const l=li.trim();if(!l)return;
    const mv=l.match(/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2}|\d+\.\d{2}|\d+)\s*$/);
    if(!mv)return;
    const bruto=mv[1];
    const valor=bruto.includes(',')?parseFloat(bruto.replace(/\./g,'').replace(',','.')):parseFloat(bruto);
    if(!valor||valor<=0)return;
    const resto=l.slice(0,mv.index).trim();
    const mp=resto.match(/(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})\s*$/);
    if(mp){
      const atual=+mp[1],total=+mp[2];
      if(total>=atual&&atual>=1&&total<=48){
        const prim=new Date(ANO,MES-(atual-1),1);
        parc.push({cartao_id,descricao:resto.slice(0,mp.index).trim()||'Compra',categoria:'Importado',
          valor_parcela:valor,total_parcelas:total,primeira_competencia:iso(prim),escopo:'pessoal'});
        return;
      }
    }
    ass.push({cartao_id,descricao:resto||'Lançamento',valor,escopo:'pessoal',ativo:true});
  });
  return {parc,ass};
}
async function importar(){
  const txt=document.getElementById('impTxt').value.trim();
  if(!txt)return toast('Cole as linhas da fatura primeiro.',true);
  const {parc,ass}=lerFatura(txt,document.getElementById('impCart').value);
  if(!parc.length&&!ass.length)return toast('Não consegui ler nenhuma linha. Confira o formato.',true);
  if(!confirm(`Li ${parc.length} parcelamentos e ${ass.length} assinaturas. Lançar?`))return;
  if(parc.length){const{data,error}=await sb.from('parcelamentos').insert(parc).select();
    if(error)return toast('Erro: '+error.message,true);D.parcelamentos.push(...data);}
  if(ass.length){const{data,error}=await sb.from('assinaturas').insert(ass).select();
    if(error)return toast('Erro: '+error.message,true);D.assinaturas.push(...data);}
  document.getElementById('impTxt').value='';
  toast(`${parc.length+ass.length} linhas importadas.`);desenhar();
}

/* ================= INVESTIMENTOS ================= */
function verInvestimentos(){
  const t=totalInvestido(), caixa=+D.config.caixa_empresa||0;
  let h=`<h2><span class="q"></span>Carteiras</h2>
  <div class="grade g3">
    ${hero('Total investido',rsc(t),`${D.investimentos.length} carteiras`,'big')}
    ${hero('Caixa em conta',rsc(caixa),'informado em Configurações','b')}
    ${hero('Reserva total',rsc(t+caixa),'investido mais conta','')}
  </div>
  <h2><span class="q"></span>Por banco · tudo editável</h2>
  <div class="cartao rolagem"><table><thead><tr>
    <th>Banco</th><th>Tipo</th><th class="d">Valor</th><th class="d">%</th><th>Atualizado</th><th></th>
  </tr></thead><tbody>`;
  [...D.investimentos].sort((a,b)=>+b.valor-+a.valor).forEach(i=>{h+=`<tr>
    <td><input class="ed" value="${esc(i.banco)}" onchange="up('investimentos','${i.id}','banco',this.value)"></td>
    <td><input class="ed" value="${esc(i.tipo||'')}" onchange="up('investimentos','${i.id}','tipo',this.value)"></td>
    <td class="d"><input class="ed n" type="number" step="0.01" value="${i.valor}" onchange="upNum('investimentos','${i.id}','valor',this.value)"></td>
    <td class="d">${t?(+i.valor/t*100).toFixed(1):0}%</td>
    <td><input class="ed dt" type="date" value="${String(i.atualizado_em||'').slice(0,10)}" onchange="up('investimentos','${i.id}','atualizado_em',this.value)"></td>
    <td><button class="x" onclick="del('investimentos','${i.id}')" aria-label="Remover">✕</button></td></tr>`;});
  h+=`</tbody></table></div>
  <h2><span class="q"></span>Nova carteira</h2>
  <div class="cartao"><div class="formlinha">
    <div class="campo"><label>Banco</label><input id="iBanco"></div>
    <div class="campo"><label>Tipo</label><input id="iTipo" placeholder="Reserva, Investimento, Caixa"></div>
    <div class="campo"><label>Valor</label><input id="iValor" type="number" step="0.01"></div>
    <button class="btn" onclick="novoInvestimento()">Adicionar</button>
  </div></div>`;
  document.getElementById('v-inv').innerHTML=h;
}
async function novoInvestimento(){
  const r={banco:document.getElementById('iBanco').value.trim(),
    tipo:document.getElementById('iTipo').value.trim()||'Reserva',
    valor:+document.getElementById('iValor').value||0,atualizado_em:iso(HOJE)};
  if(!r.banco)return toast('Informe o banco.',true);
  const {data,error}=await sb.from('investimentos').insert(r).select().single();
  if(error)return toast('Erro: '+error.message,true);
  D.investimentos.push(data);['iBanco','iValor'].forEach(i=>document.getElementById(i).value='');
  toast('Carteira adicionada.');desenhar();
}

    .reduce((s,x)=>s+ +x.valor_total/Math.max(1,x.meses),0);

async function salvarConfig(){
  const r={negocio:document.getElementById('cNome').value.trim()||'Painel RHINO',
    razao_social:document.getElementById('cRazao').value.trim(),
    logo_url:document.getElementById('cLogo').value.trim()||null,
    cor_primaria:document.getElementById('cCor').value,cor_fundo:document.getElementById('cFundo').value,
    assinatura:document.getElementById('cAssin').value.trim(),
    caixa_empresa:+document.getElementById('cCaixa').value||0,
    meta_mensal:+document.getElementById('cMeta').value||0,
    aliquota:+document.getElementById('cAliq').value||0,
    base_declarada:+document.getElementById('cBase').value||0,
    repasse_meses:document.getElementById('cRepasse').value.trim()||'1,4,7,10'};
  const {error}=await sb.from('config').update(r).eq('id',1);
  if(error)return toast('Erro: '+error.message,true);
  D.config={...D.config,...r};marca();toast('Configurações salvas.');desenhar();
}

/* ================= GENÉRICOS ================= */
async function up(tabela,id,campo,valor){
  if(!id||id==='undefined'||id==='null')return toast('Registro sem vínculo, não dá para salvar.',true);
  const {error}=await sb.from(tabela).update({[campo]:valor}).eq('id',id);
  if(error)return toast('Erro ao salvar: '+error.message,true);
  const it=D[tabela]?.find(x=>x.id===id);if(it)it[campo]=valor;
  toast('Salvo.');desenhar();
}
const upNum=(t,i,c,v)=>up(t,i,c,c==='produto_id'?v:(+v||0));
async function del(tabela,id){
  if(!confirm('Remover? Isso não pode ser desfeito.'))return;
  const {error}=await sb.from(tabela).delete().eq('id',id);
  if(error)return toast('Erro ao remover: '+error.message,true);
  D[tabela]=D[tabela].filter(x=>x.id!==id);
  if(tabela==='mentorados')D.contratos=D.contratos.filter(c=>c.mentorado_id!==id);
  toast('Removido.');desenhar();
}
