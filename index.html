<script>
/* ================= PLANILHA (Google Sheets -> Supabase) =================
   Toda vez que o painel abre ele baixa o CSV público da aba financeira, lê a linha
   "Recebimento Consultoria", os grupos de despesa e a linha "Objetivo", e grava em
   `lancamentos` / `metas_mes` com a etiqueta origem = 'planilha'.
   Regras:
   - a planilha é a fonte dos números do mês: receitas (Consultoria, Mentoria, Framework)
     e despesas; nos meses em que ela tem receita, o "recebido" do painel é o dela
     (as parcelas baixadas ficam só para a cobrança);
   - só meses até o mês atual (o resto da planilha é projeção);
   - todos os itens de despesa entram, inclusive "Provisões financeiras" (categoria
     Provisões financeiras) e "Carteira de investimentos" (categoria Investimentos),
     como a planilha soma de janeiro a junho e como o painel já classificava;
   - cada célula vira um lançamento com origem_id estável (pl:ANO:tipo:item:MM);
     linha nova entra completa, linha existente só tem o valor atualizado;
   - célula apagada na planilha remove o lançamento correspondente;
   - lançamentos digitados no painel (sem origem) nunca são tocados;
   - categorias seguem o esquema que já existe no painel (Despesas fixas · Pessoal,
     Cartões · empresa, Colaboradores, Impostos…); o item da planilha vai na descrição. */

function csvParse(t){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(ch!=='\r') cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
/* " R$  16.375,48 " -> 16375.48 · "-R$  8.761,46" -> -8761.46 · " R$  -   " -> 0 · "" -> null · "5k até o final" -> null */
function brl(s){
  if(s==null)return null; s=String(s).trim(); if(!s)return null;
  const temRS=/R\$/.test(s), neg=/^\s*-|^\(/.test(s);
  const num=s.replace(/[^\d,.]/g,'');
  if(!/\d/.test(num)) return temRS?0:null;
  if(!temRS&&/[a-zA-Z]/.test(s)) return null;
  const v=parseFloat(num.replace(/\./g,'').replace(',','.'));
  return isNaN(v)?null:(neg?-v:v);
}
const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const limparItem=l=>l.replace(/\s*-\s*\d{1,2}(\s*e\s*\d{1,2})?\s*$/,'').replace(/\s+/g,' ').replace(/\)\)/g,')').trim();
const diaDoItem=l=>{const m=l.match(/-\s*(\d{1,2})(?:\s*e\s*\d{1,2})?\s*$/);const d=m?+m[1]:0;return d>=1&&d<=31?d:null;};

/* Lê a aba financeira: label na coluna A e os 12 meses nas colunas B..M. */
function lerFinanceira(rows){
  const out={receitas:[],despesas:[],metas:null};
  let sec='',grupo=null;
  for(const r of rows){
    const label=String(r[0]||'').replace(/\s+/g,' ').trim();
    const vals=r.slice(1,13).map(brl);
    const temValor=vals.some(v=>v!=null), L=label.toUpperCase();
    if(!label&&!temValor) continue;
    if(/^PLANILHA FINANCEIRA|^RECEITAS$/.test(L)){sec='rec';continue;}
    if(L==='DESPESAS'){sec='desp';grupo=null;continue;}
    if(/^META/.test(L)){sec='meta';continue;}
    // fim da parte financeira: "BALANÇO" ou o cabeçalho "Carteiras de investimento" (sem valores;
    // a linha "Carteira de investimentos" dentro das despesas tem valores e é tratada adiante)
    if(/^BALAN/.test(L)||(/^CARTEIRAS? DE INVESTIMENTO/.test(L)&&!temValor)){sec='fim';continue;}
    if(sec==='rec'){ if(/^RECEBIMENTO/.test(L)) out.receitas.push({label,vals}); continue; }
    if(sec==='desp'){
      if(/^TOTAL DAS DESPESAS/.test(L)){sec='fim';continue;}
      if(/^TOTAL$/.test(L)){grupo=null;continue;}
      if(label&&!temValor){grupo=label;continue;}
      if(temValor) out.despesas.push({grupo:grupo||'Extras',label:label||`${grupo||'Despesa'} (sem descrição)`,vals});
      continue;
    }
    if(sec==='meta'){ if(/^OBJETIVO/.test(L)) out.metas=vals; continue; }
  }
  return out;
}
/* Decide categoria (do esquema que já existe no painel), matriz de reserva e escopo de um item. */
function classificar(grupo,label){
  const s=(grupo+' » '+label).toLowerCase(), g=grupo.toLowerCase();
  const emp=/\bpj\b|\(empresa\)/.test(s);
  if(/cart/.test(g)) return emp?{cat:'Cartões · empresa',mat:'Cartões',esc:'empresa'}:{cat:'Cartões · pessoal',mat:'Cartões',esc:'pessoal'};
  if(/imposto|inss|taxa/.test(label.toLowerCase())) return {cat:'Impostos',mat:'Impostos',esc:'empresa'};
  if(/repasse jefferson|repasse soc|provis|ipva|manuten/.test(s)) return {cat:'Provisões financeiras',mat:'Provisões financeiras',esc:/repasse/.test(s)?'empresa':'pessoal'};
  if(/carteira de invest|aporte/.test(s)) return {cat:'Investimentos',mat:'Investimentos',esc:'ambos'};
  if(/despesas extras|extra/.test(label.toLowerCase())) return {cat:'Despesas extras',mat:'Despesas extras',esc:'pessoal'};
  if(/casa|fixo/.test(g)) return /aluguel rec/.test(s)?{cat:'Despesas fixas · Empresa',mat:'Despesas fixas · Empresa',esc:'empresa'}:{cat:'Despesas fixas · Pessoal',mat:'Despesas fixas · Pessoal',esc:'pessoal'};
  if(/colaborador/.test(g)){
    if(/terapia|diarista|seguro|celular|sa[uú]de|treino|suplemento/.test(s)) return {cat:'Despesas fixas · Pessoal',mat:'Despesas fixas · Pessoal',esc:'pessoal'};
    if(/flowize|vivo|caixa postal|ferramenta|moda|hubla|cal\.com|typeform|plataforma|aplicativo/.test(s)) return {cat:'Despesas fixas · Empresa',mat:'Despesas fixas · Empresa',esc:'empresa'};
    return {cat:'Colaboradores',mat:'Colaboradores',esc:'empresa'};
  }
  return {cat:'Despesas extras',mat:'Despesas extras',esc:'pessoal'};
}
function receitaDe(label){
  const L=label.toLowerCase();
  if(/framework/.test(L)) return {chave:'framework',cat:'Receita de contrato',re:[/framework/i]};
  if(/mentoria/.test(L)) return {chave:'mentoria',cat:'Receita de contrato',re:[/mentoria/i,/rhino/i]};
  return {chave:'consultoria',cat:'Receita avulsa',re:[/consultoria/i]};
}
const achaCat=(nome,tipo)=>D.categorias.find(c=>(!tipo||c.tipo===tipo)&&c.nome.trim().toLowerCase()===nome.trim().toLowerCase());
/* Garante que cada categoria usada exista (reaproveita o que já existe; cria só o que falta). */
async function garantirCategorias(itens){
  const matrizesNovas=new Map(), filhas=new Map();
  itens.forEach(it=>{
    if(achaCat(it.nome,it.tipo)) return;
    if(!achaCat(it.matriz,it.tipo)&&!matrizesNovas.has(it.tipo+'|'+it.matriz))
      matrizesNovas.set(it.tipo+'|'+it.matriz,{nome:it.matriz,tipo:it.tipo,escopo:'ambos',matriz:true,parent_id:null,ordem:90});
  });
  if(matrizesNovas.size){
    const {data,error}=await sb.from('categorias').insert([...matrizesNovas.values()]).select();
    if(error) throw new Error('categorias: '+error.message);
    D.categorias.push(...(data||[]));
  }
  itens.forEach(it=>{
    if(achaCat(it.nome,it.tipo)||achaCat(it.nome)) return;
    const m=achaCat(it.matriz,it.tipo); if(!m||it.nome.toLowerCase()===it.matriz.toLowerCase()) return;
    if(!filhas.has(it.nome.toLowerCase())) filhas.set(it.nome.toLowerCase(),{nome:it.nome,tipo:it.tipo,escopo:it.escopo==='ambos'?'ambos':it.escopo,matriz:false,parent_id:m.id,ordem:95});
  });
  if(filhas.size){
    const {data,error}=await sb.from('categorias').insert([...filhas.values()]).select();
    if(error) throw new Error('categorias: '+error.message);
    D.categorias.push(...(data||[]));
  }
}
/* Monta os lançamentos a partir do que foi lido e grava só as diferenças. */
async function gravarPlanilha(dados){
  const ano=PLANILHA.ano;
  const mesMax = ano<HOJE.getFullYear() ? 11 : ano>HOJE.getFullYear() ? -1 : HOJE.getMonth();
  if(mesMax<0) return 'o ano da planilha ainda não começou';
  const hojeIso=iso(HOJE), todas=[], cats=[];

  dados.receitas.forEach(({label,vals})=>{
    const r=receitaDe(label);
    if(!(PLANILHA.receitas||['consultoria','mentoria','framework']).includes(r.chave)) return;
    const pid=r.re.map(re=>D.produtos.find(p=>re.test(p.nome))).find(Boolean)?.id||null;
    cats.push({nome:r.cat,matriz:'Receitas',tipo:'entrada',escopo:'empresa'});
    vals.forEach((v,m)=>{ if(m>mesMax||!v||v<=0) return; const mm=String(m+1).padStart(2,'0');
      todas.push({origem:'planilha',origem_id:`pl:${ano}:r:${r.chave}:${mm}`,tipo:'entrada',categoria:r.cat,
        descricao:label.replace(/^Recebimento\s*/i,'').trim()+' (planilha)',valor:+v.toFixed(2),
        data:`${ano}-${mm}-01`,competencia:`${ano}-${mm}-01`,escopo:'empresa',produto_id:pid,pago:true}); });
  });
  dados.despesas.forEach(({grupo,label,vals})=>{
    const nome=limparItem(label), dia=diaDoItem(label), c=classificar(grupo,label);
    cats.push({nome:c.cat,matriz:c.mat,tipo:'despesa',escopo:c.esc});
    vals.forEach((v,m)=>{ if(m>mesMax||v==null||v<=0) return; const mm=String(m+1).padStart(2,'0');
      const ult=new Date(ano,m+1,0).getDate(), d=String(Math.min(dia||10,ult)).padStart(2,'0'), data=`${ano}-${mm}-${d}`;
      const id=`pl:${ano}:d:${slug(nome)}:${mm}`;
      const rep=todas.find(l=>l.origem_id===id); if(rep){rep.valor=+(rep.valor+v).toFixed(2);return;} // mesmo item duas vezes na planilha: soma
      todas.push({origem:'planilha',origem_id:id,tipo:'despesa',categoria:c.cat,descricao:/cart/i.test(grupo)?'Fatura '+nome:nome,valor:+v.toFixed(2),
        data,competencia:`${ano}-${mm}-01`,escopo:c.esc==='ambos'?'pessoal':c.esc,produto_id:null,pago:data<=hojeIso}); });
  });
  if(!todas.length) return 'nenhum valor até o mês atual';
  const linhas=todas;
  await garantirCategorias(cats);

  const {data:ex,error:e0}=await sb.from('lancamentos').select('id,origem_id,valor').eq('origem','planilha');
  if(e0) throw new Error(/origem/.test(e0.message)?'rode o arquivo supabase-migracao-v5-planilha.sql no Supabase':e0.message);
  const mapa=new Map((ex||[]).map(x=>[x.origem_id,x]));
  const idsTodas=new Set(todas.map(l=>l.origem_id));
  const novos=linhas.filter(l=>!mapa.has(l.origem_id));
  const mudados=linhas.filter(l=>mapa.has(l.origem_id)&&Math.abs(+mapa.get(l.origem_id).valor-l.valor)>0.005)
    .map(l=>({id:mapa.get(l.origem_id).id,valor:l.valor}));
  // linha do tempo: o que a planilha mudou na receita (a primeira importação não conta)
  const nomeMes=l=>MESES[+l.origem_id.slice(-2)-1];
  const avisos=(ex||[]).length?[
    ...linhas.filter(l=>l.tipo==='entrada'&&mapa.has(l.origem_id)&&Math.abs(+mapa.get(l.origem_id).valor-l.valor)>0.005).map(l=>{const de=+mapa.get(l.origem_id).valor, dif=l.valor-de;
      return `Planilha: ${l.descricao.replace(' (planilha)','')} de ${nomeMes(l)} foi de ${rs(de)} para ${rs(l.valor)} (${dif>0?'+':'−'}${rs(Math.abs(dif))})`;}),
    ...novos.filter(l=>l.tipo==='entrada').map(l=>`Planilha: ${l.descricao.replace(' (planilha)','')} de ${nomeMes(l)} entrou com ${rs(l.valor)}`)
  ].slice(0,6):[];
  // célula apagada na planilha (ou item renomeado): remove o lançamento que veio dela
  const sobras=(ex||[]).filter(x=>x.origem_id&&x.origem_id.startsWith(`pl:${ano}:`)&&!idsTodas.has(x.origem_id)&&(+x.origem_id.slice(-2)-1)<=mesMax);

  if(novos.length){const {error}=await sb.from('lancamentos').upsert(novos,{onConflict:'origem_id'}); if(error) throw new Error(error.message);}
  if(mudados.length){ // update linha a linha: upsert parcial esbarra nas colunas obrigatórias (data, tipo…)
    const rs=await Promise.all(mudados.map(m=>sb.from('lancamentos').update({valor:m.valor}).eq('id',m.id)));
    const falha=rs.find(r=>r.error); if(falha) throw new Error(falha.error.message); }
  if(sobras.length){const {error}=await sb.from('lancamentos').delete().in('id',sobras.map(x=>x.id)); if(error) throw new Error(error.message);}

  let metas=[];
  if(dados.metas){
    metas=dados.metas.map((v,m)=>v&&v>0?{ano_mes:chave(ano,m),total:+v.toFixed(2)}:null).filter(Boolean)
      .filter(x=>{const r=D.metas_mes.find(y=>y.ano_mes===x.ano_mes);return !r||Math.abs(+r.total-x.total)>0.005;});
    if(metas.length){const {error}=await sb.from('metas_mes').upsert(metas,{onConflict:'ano_mes'}); if(error) throw new Error('metas: '+error.message);}
  }
  if(avisos.length){ const {data:evs}=await sb.from('eventos').insert(avisos.map(t=>({origem:'planilha',tipo:'planilha',titulo:t}))).select(); if(evs)D.eventos.unshift(...evs.reverse()); }
  const p=[];
  if(novos.length)p.push(`${novos.length} novos`); if(mudados.length)p.push(`${mudados.length} atualizados`);
  if(sobras.length)p.push(`${sobras.length} removidos`); if(metas.length)p.push(`${metas.length} meta${metas.length>1?'s':''}`);
  return p.length?p.join(', '):'sem mudanças';
}
async function recarregar(tabelas){
  const r=await Promise.all(tabelas.map(t=>sb.from(t).select('*')));
  r.forEach((res,i)=>{if(!res.error)D[tabelas[i]]=res.data||[];});
  D.categorias.sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  desenhar();
}
function atualizarSync(){ document.querySelectorAll('.sync').forEach(el=>{el.outerHTML=syncHtml();}); }

/* ---------- aba de alunos: um aluno por linha, meses nas colunas B..M ----------
   Só leitura e só em memória: serve para a conferência de Recebíveis sugerir quais parcelas
   vencidas a planilha já mostra com valor. Nada daqui vira lançamento (o faturamento vem da aba financeira). */
const limparAluno=s=>norm(s).replace(/\(.*?\)/g,' ').replace(/-\s*\d+\s*aulas?/g,' ').replace(/\d{1,2}\/\d{1,2}(\/\d{2,4})?/g,' ').replace(/[^a-z ]+/g,' ').replace(/\s+/g,' ').trim();
function lerAlunos(rows){
  const out=[];let bloco=null;
  for(const r of rows){
    const label=String(r[0]||'').replace(/\s+/g,' ').trim(), L=label.toUpperCase();
    if(!label) continue;
    if(/^MENTORIA\s+(RHINO|FRAMEWORK)$/.test(L)){bloco=label;continue;}
    if(/^(TOTAL|ENTRADAS|RECEBIMENTO|CAIXA|MENTORIA \+)/.test(L)) continue;
    if(!bloco) continue;
    const vals=r.slice(1,13).map(brl);
    if(!vals.some(v=>v>0)) continue;
    out.push({nome:label,chave:limparAluno(label),bloco,vals});
  }
  return out;
}
async function lerAbaAlunos(){
  if(!PLANILHA.gidAlunos) return;
  try{
    const r=await fetch(`https://docs.google.com/spreadsheets/d/${PLANILHA.id}/gviz/tq?tqx=out:csv&gid=${PLANILHA.gidAlunos}&t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok) throw new Error(`a aba não respondeu (${r.status})`);
    const txt=await r.text();
    if(/<html/i.test(txt.slice(0,300))) throw new Error('a aba não está pública');
    const linhas=lerAlunos(csvParse(txt));
    if(!linhas.length) throw new Error('não achei os blocos “Mentoria RHINO” / “Mentoria FrameWork”');
    ALUNOS={estado:'ok',linhas,erro:''};
  }catch(e){ ALUNOS={estado:'erro',linhas:[],erro:String(e.message||e)}; }
  if(ABA==='receb') verRecebiveis();
}
async function sincronizarPlanilha({auto,manual}={}){
  if(!PLANILHA.id||SYNC.estado==='rodando') return;
  lerAbaAlunos(); // em paralelo; não grava nada
  let ult=0,resumoAnt=''; try{ult=+localStorage.getItem('rhino-sync-ts')||0;resumoAnt=localStorage.getItem('rhino-sync-resumo')||'';}catch(e){}
  if(auto&&Date.now()-ult<PLANILHA.segundos*1000){ SYNC={estado:'ok',quando:new Date(ult),resumo:resumoAnt,erro:''}; atualizarSync(); return; }
  SYNC={estado:'rodando',quando:SYNC.quando,resumo:'',erro:''}; atualizarSync();
  try{
    const url=`https://docs.google.com/spreadsheets/d/${PLANILHA.id}/gviz/tq?tqx=out:csv&gid=${PLANILHA.gid}&t=${Date.now()}`;
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error(`a planilha não respondeu (${r.status}). Ela precisa estar compartilhada como “qualquer pessoa com o link”.`);
    const txt=await r.text();
    if(/<html/i.test(txt.slice(0,300))) throw new Error('a planilha não está pública. Compartilhe como “qualquer pessoa com o link · leitor”.');
    const dados=lerFinanceira(csvParse(txt));
    if(!dados.receitas.length&&!dados.despesas.length) throw new Error('não reconheci a aba: procuro as linhas “Recebimento …” e o bloco “DESPESAS”.');
    const resumo=await gravarPlanilha(dados);
    SYNC={estado:'ok',quando:new Date(),resumo,erro:''};
    try{localStorage.setItem('rhino-sync-ts',String(Date.now()));localStorage.setItem('rhino-sync-resumo',resumo);}catch(e){}
    if(manual||/novos|atualizados|removidos|meta/.test(resumo)) toast('Planilha: '+resumo);
    if(/novos|atualizados|removidos|meta/.test(resumo)) await recarregar(['lancamentos','metas_mes','categorias']); else atualizarSync();
  }catch(e){
    SYNC={estado:'erro',quando:SYNC.quando,resumo:'',erro:String(e.message||e)};
    if(manual) toast('Planilha: '+SYNC.erro,true);
    atualizarSync();
  }
}
