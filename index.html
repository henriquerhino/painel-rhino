<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel RHINO · Consulting Framework</title>
<style>
:root{
  --preto:#000; --carvao:#0e0e0e; --grafite:#171717; --linha:#282828; --linha2:#1d1d1d;
  --cinza:#EDEFF0; --medio:#a8abad; --fraco:#7e8183;
  --verde:#44CF17; --verdebg:#123006; --vermelho:#f0605f; --vermelhobg:#2e1010;
  --ambar:#F5A623; --ambarbg:#2e1f06; --azul:#4E9AE8;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--preto);color:var(--cinza);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer}
.rotulo{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fraco)}
.q{display:inline-block;width:9px;height:9px;background:var(--verde);margin-right:10px;flex:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--verde)} .neg{color:var(--vermelho)} .av{color:var(--ambar)}
.oculto{display:none !important}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.cxlogin{width:100%;max-width:370px;border:1px solid var(--linha);background:var(--carvao);padding:36px 32px}
.cxlogin h1{font-size:21px;font-weight:600;margin:14px 0 4px}
.cxlogin p{font-size:14px;color:var(--medio);margin-bottom:22px}
.campo{margin-bottom:12px}
.campo label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fraco);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--grafite);border:1px solid var(--linha);color:var(--cinza);padding:9px 11px;border-radius:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde)}
.btn{background:var(--verde);color:#000;border:none;padding:10px 18px;font-weight:600;font-size:13.5px}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.5;cursor:wait}
.btnv{background:transparent;color:var(--cinza);border:1px solid var(--linha);padding:8px 14px;font-size:13.5px}
.btnv:hover{border-color:var(--verde);color:var(--verde)}
.erro{background:var(--vermelhobg);border:1px solid var(--vermelho);color:#ffc4c4;padding:9px 12px;font-size:13.5px;margin-top:12px}

header{border-bottom:1px solid var(--linha);background:var(--carvao);position:sticky;top:0;z-index:20}
.topo{max-width:1320px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto}
.marca img{height:28px}
.marca .nome{font-weight:600;font-size:15.5px}
header select{width:auto;padding:6px 10px;font-family:var(--mono);font-size:12.5px}
nav{border-bottom:1px solid var(--linha);overflow-x:auto}
.abas{max-width:1320px;margin:0 auto;padding:0 22px;display:flex;gap:2px}
.abas button{background:none;border:none;border-bottom:2px solid transparent;color:var(--fraco);padding:12px 15px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.abas button.on{color:var(--verde);border-bottom-color:var(--verde)}
.abas button:hover{color:var(--cinza)}
main{max-width:1320px;margin:0 auto;padding:24px 22px 90px}
h2{font-size:13px;font-family:var(--mono);letter-spacing:.11em;text-transform:uppercase;font-weight:400;
  display:flex;align-items:center;margin:30px 0 12px;color:var(--medio)}
h2:first-child{margin-top:0}

.grade{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.cartao{background:var(--carvao);border:1px solid var(--linha);padding:17px}

.hero{background:var(--carvao);border:1px solid var(--linha);padding:20px 20px 20px 24px;position:relative}
.hero .t{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fraco);margin-bottom:9px}
.hero .v{font-family:var(--mono);font-size:33px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.12}
.hero .s{font-size:12.5px;color:var(--medio);margin-top:7px}
.hero.big{border-color:var(--verde)}
.hero .faixa{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--verde)}
.hero.r .faixa{background:var(--vermelho)} .hero.b .faixa{background:var(--azul)}
.hero .quebra{margin-top:11px;padding-top:10px;border-top:1px solid var(--linha2);display:flex;flex-direction:column;gap:4px}
.hero .quebra div{display:flex;justify-content:space-between;font-size:12.5px}
.hero .quebra span:last-child{font-family:var(--mono)}

.kpi{background:var(--carvao);border:1px solid var(--linha);padding:15px 16px}
.kpi.clic{cursor:pointer} .kpi.clic:hover{border-color:var(--verde)}
.kpi .t{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--fraco);margin-bottom:6px}
.kpi .v{font-family:var(--mono);font-size:23px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--medio);margin-top:4px}

.barra{height:9px;background:var(--grafite);overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--verde);transition:width .3s}
.barra.r i{background:var(--vermelho)} .barra.a i{background:var(--ambar)}

.combo{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,320px);gap:22px;align-items:center}
@media(max-width:860px){.combo{grid-template-columns:1fr}}
.leg{display:flex;flex-direction:column}
.leg .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--linha2)}
.leg .it:last-child{border-bottom:none}
.leg .it.sub{padding-left:21px;font-size:12.5px;color:var(--medio)}
.leg .pt{width:11px;height:11px;flex:none}
.leg .nm{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .vl{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.leg .pc{font-family:var(--mono);font-size:11.5px;color:var(--fraco);width:46px;text-align:right}
.leg .tot{display:flex;justify-content:space-between;padding-top:11px;margin-top:7px;border-top:1px solid var(--linha);font-family:var(--mono);font-size:14.5px}
.grafico{position:relative;height:280px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--fraco);
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--linha);font-weight:400;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--linha2);vertical-align:middle}
tbody tr:hover{background:var(--grafite)}
td.d,th.d{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.nome{min-width:230px;white-space:nowrap}
tr.matriz td{background:var(--grafite);font-weight:600;border-bottom:1px solid var(--linha)}
tr.filho td:first-child{padding-left:26px;color:var(--medio)}
.rolagem{overflow-x:auto}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 8px;border:1px solid var(--linha);color:var(--fraco);white-space:nowrap;background:none}
.tag.ok{color:var(--verde);border-color:#255a10;background:var(--verdebg)}
.tag.mal{color:var(--vermelho);border-color:#5a1a1a;background:var(--vermelhobg)}
.tag.al{color:var(--ambar);border-color:#5a4010;background:var(--ambarbg)}
.x{background:none;border:none;color:#555;font-size:16px;padding:0 5px}
.x:hover{color:var(--vermelho)}
.ed{background:transparent;border:1px solid transparent;color:var(--cinza);padding:4px 6px;width:100%;font-size:14px}
.ed:hover{border-color:var(--linha);background:var(--grafite)}
.ed:focus{border-color:var(--verde);background:var(--grafite);outline:none}
.ed.n{font-family:var(--mono);text-align:right;min-width:0;-moz-appearance:textfield}
.ed.n::-webkit-outer-spin-button,.ed.n::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
table.revisar td{padding:9px 12px} table.revisar th{padding:10px 12px}
table.revisar td.nome{min-width:250px}

.ed.dt{font-family:var(--mono);width:140px}
.ed.nm{min-width:220px}
select.ed{width:auto;min-width:110px}

.alerta{display:flex;gap:11px;padding:13px 15px;border-left:3px solid var(--linha);background:var(--grafite);
  margin-bottom:8px;font-size:14px;line-height:1.65}
.alerta.critico,.alerta.r{border-left-color:var(--vermelho)}
.alerta.atencao,.alerta.a{border-left-color:var(--ambar)}
.alerta.bom,.alerta.v{border-left-color:var(--verde)}
.alerta.info,.alerta.b{border-left-color:var(--azul)}
.alerta .acao{display:block;margin-top:7px;padding-top:7px;border-top:1px solid var(--linha);
  font-size:13px;color:var(--medio)}
.alerta .acao b{color:var(--verde);font-weight:600}
.linhafina{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--grafite);
  border-left:3px solid var(--verde);padding:12px 15px;font-size:14px;flex-wrap:wrap}
.formlinha{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.formlinha .campo{margin:0;flex:1;min-width:130px}
.vazio{text-align:center;color:var(--fraco);padding:28px 14px;font-size:13.5px}
.nota{font-size:12.5px;color:var(--fraco);margin-top:10px;line-height:1.65}
footer{border-top:1px solid var(--linha);padding:20px;text-align:center}
.sem{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sem .c{background:var(--grafite);padding:12px 13px}
.sem .c .lb{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--fraco)}
.sem .c .vv{font-family:var(--mono);font-size:18px;margin-top:5px}
.sem .c .pp{font-family:var(--mono);font-size:11px;color:var(--fraco);margin-top:4px}
.sem .c input{background:transparent;border:1px solid transparent;color:var(--medio);font-family:var(--mono);
  font-size:11px;padding:1px 3px;width:88px;text-align:right}
.sem .c input:hover{border-color:var(--linha)} .sem .c input:focus{border-color:var(--verde);outline:none}
.girando{display:inline-block;width:12px;height:12px;border:2px solid var(--linha);border-top-color:var(--verde);
  border-radius:50%;animation:g .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes g{to{transform:rotate(360deg)}}
.cabecalho{width:100%;background:none;border:none;color:var(--cinza);display:flex;align-items:center;gap:12px;padding:15px 17px;text-align:left}
.cabecalho:hover{background:var(--grafite)}
.seta{color:var(--fraco);font-size:13px;transition:transform .15s;flex:none}
.seta.on{transform:rotate(90deg);color:var(--verde)}
.corpo{padding:0 17px 17px;border-top:1px solid var(--linha)}
table.contratos,table.receb{table-layout:fixed;width:100%}
table.contratos td,table.receb td{padding:8px 9px}
table.contratos th,table.receb th{padding:9px}
table.contratos td.nome,table.receb td.nome{min-width:0;width:auto;white-space:normal}
td .sub{display:flex;align-items:center;gap:5px;margin-top:3px;font-family:var(--mono);
  font-size:10px;letter-spacing:.04em;color:var(--fraco);flex-wrap:wrap}
.ed.mudo{color:var(--fraco);font-size:10px;font-family:var(--mono);padding:1px 3px;min-width:0}
.ed.mudo:hover{color:var(--cinza)}
select.ed.mudo{width:auto;min-width:0;max-width:170px}
th.acoes,td.acoes{width:132px;text-align:right;white-space:nowrap}
table.contratos th.d:nth-child(2),table.contratos td.d:nth-child(2){width:120px}
table.contratos th.d:nth-child(3),table.contratos td.d:nth-child(3),
table.contratos th.d:nth-child(4),table.contratos td.d:nth-child(4){width:96px}
table.contratos th.d:nth-child(5),table.contratos td.d:nth-child(5){width:74px}
table.contratos th:nth-child(6),table.contratos td:nth-child(6){width:150px}
table.contratos th:nth-child(7),table.contratos td:nth-child(7){width:132px}
table.receb th:nth-child(2),table.receb td:nth-child(2){width:78px}
.ed.lim{width:100%;max-width:118px} .ed.mini{width:100%;max-width:64px}
.ed.dt{width:100%;max-width:142px}
@media(max-width:900px){table.contratos,table.receb{table-layout:auto}
  .cartao>table{display:block;overflow-x:auto}}
.dropzona{border:1px dashed var(--linha);padding:22px;text-align:center;color:var(--fraco);font-size:13.5px}
.dropzona.ativo{border-color:var(--verde);color:var(--verde)}
.miniaturas{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.miniaturas img{height:74px;border:1px solid var(--linha)}
@media print{
  body{background:#fff;color:#000}
  header,nav,footer,.btn,.btnv,.x,#filtros,.nota{display:none !important}
  .cartao{border:1px solid #ccc;background:#fff;break-inside:avoid}
  table{font-size:11px} th,td{color:#000;border-color:#ddd}
  .tag{color:#000;border-color:#999}
  h2{color:#000} .rotulo{color:#444}
}
@media(max-width:640px){.hero .v{font-size:27px}.kpi .v{font-size:21px}main{padding:18px 14px 70px}
  .topo,.abas{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>

<div id="login"><div class="cxlogin">
  <div class="rotulo"><span class="q"></span>Consulting Framework</div>
  <h1>Painel financeiro</h1>
  <p>Entre para ver e lançar os números.</p>
  <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username"></div>
  <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password"></div>
  <button class="btn" id="btEntrar" style="width:100%;margin-top:8px">Entrar</button>
  <div id="erroLogin" class="erro oculto"></div>
</div></div>

<div id="app" class="oculto">
<header><div class="topo">
  <div class="marca"><img id="logoTopo" class="oculto" alt=""><span class="q" id="qTopo"></span><span class="nome" id="nomeNegocio">Painel RHINO</span></div>
  <select id="selMes" aria-label="Mês"></select>
  <button class="btnv" id="btSair">Sair</button>
</div></header>
<nav><div class="abas" id="abas">
  <button data-a="dash" class="on">Dashboard</button>
  <button data-a="contr">Contratos</button>
  <button data-a="receb">Recebíveis</button>
  <button data-a="desp">Despesas</button>
  <button data-a="lanc">Lançamentos</button>
  <button data-a="cart">Cartões</button>
  <button data-a="inv">Investimentos</button>
  <button data-a="conf">Configurações</button>
</div></nav>
<main>
  <section id="v-dash"></section><section id="v-contr" class="oculto"></section>
  <section id="v-receb" class="oculto"></section><section id="v-desp" class="oculto"></section>
  <section id="v-lanc" class="oculto"></section><section id="v-cart" class="oculto"></section>
  <section id="v-inv" class="oculto"></section><section id="v-conf" class="oculto"></section>
</main>
<footer><div class="rotulo" id="rodape">Consulting Framework · RHINO</div></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const SUPABASE_URL='https://fcwxkelokmqwmivjembv.supabase.co';
const SUPABASE_KEY='sb_publishable_eo9wQ05w390iA0V13ACSqg_Lihy643Q';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const CORES=['#44CF17','#4E9AE8','#7F77DD','#F5A623','#f0605f','#1baf7a','#D4537E','#8a8d8f','#eb6834','#4a3aa7'];
const HOJE=new Date();
let MES=HOJE.getMonth(), ANO=HOJE.getFullYear(), ABA='dash';
let FILTRO={ini:'',fim:'',cat:'',tipo:''};
let IA={estado:'ocioso',itens:[],erro:''};
let PRINTS=[];
let CART_ABERTO=null;
let REC_ABERTO=null;
let D={config:{},produtos:[],mentorados:[],contratos:[],parcelas:[],lancamentos:[],recorrencias:[],
  cartoes:[],parcelamentos:[],assinaturas:[],metas_mes:[],investimentos:[],investimentos_hist:[],categorias:[],repasses:[]};
const G={};

const rs=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const rsc=v=>'R$ '+Math.round(Number(v)||0).toLocaleString('pt-BR');
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chave=(a,m)=>`${a}-${String(m+1).padStart(2,'0')}`;
const noMes=(s,a,m)=>{if(!s)return false;const[y,mm]=String(s).slice(0,10).split('-').map(Number);return y===a&&mm===m+1;};
const dObj=s=>{const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d);};
const dif=(a,b)=>(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
const dias=v=>Math.floor((dObj(v)-HOJE)/86400000);
const prod=id=>D.produtos.find(p=>p.id===id);
const nomeProd=id=>prod(id)?.nome||'Sem produto';

function toast(m,e){const t=document.createElement('div');t.textContent=m;
t.style.cssText=`position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:${e?'#2e1010':'#123006'};border:1px solid ${e?'#f0605f':'#44CF17'};color:${e?'#ffc4c4':'#c7f0b0'};padding:11px 20px;font-size:13.5px;z-index:99;max-width:90vw`;
document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}

/* ---------- login ---------- */
document.getElementById('btEntrar').onclick=entrar;
document.getElementById('senha').onkeydown=e=>{if(e.key==='Enter')entrar()};
async function entrar(){
  const email=document.getElementById('email').value.trim(), password=document.getElementById('senha').value;
  const cx=document.getElementById('erroLogin'); cx.classList.add('oculto');
  if(!email||!password){cx.textContent='Preencha e-mail e senha.';cx.classList.remove('oculto');return;}
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){cx.textContent=error.message.includes('Invalid')?'E-mail ou senha incorretos.':error.message;cx.classList.remove('oculto');return;}
  iniciar();
}
document.getElementById('btSair').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(({data})=>{if(data.session)iniciar()});

async function iniciar(){
  document.getElementById('login').classList.add('oculto');
  document.getElementById('app').classList.remove('oculto');
  const s=document.getElementById('selMes');
  for(let i=-13;i<=4;i++){const d=new Date(HOJE.getFullYear(),HOJE.getMonth()+i,1);
    const o=document.createElement('option');o.value=`${d.getFullYear()}-${d.getMonth()}`;
    o.textContent=`${MESES[d.getMonth()]} ${d.getFullYear()}`;if(i===0)o.selected=true;s.appendChild(o);}
  s.onchange=()=>{const[a,m]=s.value.split('-').map(Number);ANO=a;MES=m;IA={estado:'ocioso',itens:[],erro:''};desenhar()};
  await carregar();
}
document.getElementById('abas').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  ABA=b.dataset.a;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  ['dash','contr','receb','desp','lanc','cart','inv','conf'].forEach(k=>document.getElementById('v-'+k).classList.toggle('oculto',k!==ABA));
  desenhar();};
function irPara(a){document.querySelector(`#abas button[data-a="${a}"]`).click();window.scrollTo(0,0)}

async function carregar(){
  const t=['config','produtos','mentorados','contratos','parcelas','lancamentos','recorrencias','cartoes',
    'parcelamentos','assinaturas','metas_mes','investimentos','investimentos_hist','categorias','repasses'];
  const r=await Promise.all(t.map(x=>sb.from(x).select('*')));
  let faltou=[];
  r.forEach((res,i)=>{if(res.error){faltou.push(t[i]);return;} D[t[i]]=res.data||[];});
  D.config=(Array.isArray(D.config)&&D.config[0])||D.config||{};
  D.produtos.sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  D.categorias.sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  if(faltou.length) toast('Rode o supabase-migracao-v4.sql. Faltando: '+faltou.join(', '),true);
  marca(); desenhar();
}

/* ================= CATEGORIAS MATRIZ / FILHO ================= */
const matrizes=tipo=>D.categorias.filter(c=>c.matriz&&c.tipo===tipo&&c.ativo!==false);
const filhosDe=id=>D.categorias.filter(c=>c.parent_id===id&&c.ativo!==false);
function catPorNome(n){return D.categorias.find(c=>c.nome===n)}
function matrizDe(nomeCat){
  const c=catPorNome(nomeCat); if(!c) return 'Sem categoria';
  if(c.matriz) return c.nome;
  return D.categorias.find(x=>x.id===c.parent_id)?.nome||c.nome;
}
function selCatAgrupado(sel,tipo){
  let o='';
  matrizes(tipo).forEach(m=>{
    const f=filhosDe(m.id);
    o+=`<optgroup label="${esc(m.nome)}">`;
    o+=`<option value="${esc(m.nome)}"${m.nome===sel?' selected':''}>${esc(m.nome)} (geral)</option>`;
    f.forEach(x=>{o+=`<option value="${esc(x.nome)}"${x.nome===sel?' selected':''}>${esc(x.nome)}</option>`});
    o+='</optgroup>';
  });
  const soltas=D.categorias.filter(c=>!c.matriz&&!c.parent_id&&c.tipo===tipo);
  if(soltas.length){o+='<optgroup label="Outras">'+soltas.map(x=>`<option value="${esc(x.nome)}"${x.nome===sel?' selected':''}>${esc(x.nome)}</option>`).join('')+'</optgroup>';}
  if(sel&&!D.categorias.some(c=>c.nome===sel)) o=`<option value="${esc(sel)}" selected>${esc(sel)}</option>`+o;
  return o||'<option value="Outros">Outros</option>';
}
function agrupaPorMatriz(porCat){
  const g={};
  Object.entries(porCat).forEach(([nome,v])=>{
    const m=matrizDe(nome);
    if(!g[m])g[m]={total:0,filhos:{}};
    g[m].total+=v; g[m].filhos[nome]=(g[m].filhos[nome]||0)+v;
  });
  return Object.entries(g).sort((a,b)=>b[1].total-a[1].total);
}

/* ================= CÁLCULOS ================= */
function caixaMes(a,m){
  let t=0;const pp={};
  D.parcelas.filter(p=>p.pago&&noMes(p.data_pagamento||p.vencimento,a,m)).forEach(p=>{
    const c=D.contratos.find(x=>x.id===p.contrato_id);if(!c)return;
    t+=+p.valor;pp[c.produto_id]=(pp[c.produto_id]||0)+ +p.valor;});
  D.lancamentos.filter(l=>l.tipo==='entrada'&&l.pago&&noMes(l.data,a,m)).forEach(l=>{
    t+=+l.valor;pp[l.produto_id]=(pp[l.produto_id]||0)+ +l.valor;});
  return {total:t,pp};
}
function despesasMes(a,m){
  let t=0;const pc={};
  D.lancamentos.filter(l=>l.tipo==='despesa'&&noMes(l.data,a,m)).forEach(l=>{
    t+=+l.valor;pc[l.categoria]=(pc[l.categoria]||0)+ +l.valor;});
  return {total:t,pc};
}
const aPagar=(a,m)=>D.lancamentos.filter(l=>l.tipo==='despesa'&&!l.pago&&noMes(l.data,a,m)).reduce((s,l)=>s+ +l.valor,0);
const pagoMes=(a,m)=>D.lancamentos.filter(l=>l.tipo==='despesa'&&l.pago&&noMes(l.data,a,m)).reduce((s,l)=>s+ +l.valor,0);
function faturaCartao(id,a,m){
  const ref=new Date(a,m,1);let t=0;
  D.parcelamentos.filter(p=>p.cartao_id===id).forEach(p=>{
    const n=dif(dObj(p.primeira_competencia),ref);if(n>=0&&n<p.total_parcelas)t+=+p.valor_parcela;});
  D.assinaturas.filter(x=>x.cartao_id===id&&x.ativo!==false).forEach(x=>t+=+x.valor);
  return t;
}
const faturaTotal=(a,m)=>D.cartoes.reduce((s,c)=>s+faturaCartao(c.id,a,m),0);
const impostoMes=()=>(+D.config.base_declarada||0)*(+D.config.aliquota||0)/100;
const eCaixa=i=>/caixa|conta|corrente/i.test(i.tipo||'');
const somaCaixa=()=>D.investimentos.filter(eCaixa).reduce((s,i)=>s+ +i.valor,0)+(+D.config.caixa_empresa||0);
const somaInvestido=()=>D.investimentos.filter(i=>!eCaixa(i)).reduce((s,i)=>s+ +i.valor,0);
const reservaTotal=()=>somaCaixa()+somaInvestido();

function metaDoMes(a,m){
  const r=D.metas_mes.find(x=>x.ano_mes===chave(a,m));
  const total=r?+r.total:(+D.config.meta_mensal||0);
  const s=[r?.s1,r?.s2,r?.s3,r?.s4].map(v=>v==null?total/4:+v);
  return {total,s,registro:r};
}
function abertas(){
  return D.parcelas.filter(p=>!p.pago).map(p=>{
    const c=D.contratos.find(x=>x.id===p.contrato_id);
    return {...p,contrato:c,mentorado:c?D.mentorados.find(x=>x.id===c.mentorado_id):null,d:dias(p.vencimento)};
  }).filter(p=>p.contrato&&p.contrato.status!=='cancelado').sort((a,b)=>String(a.vencimento).localeCompare(String(b.vencimento)));
}
function previsao(n){
  const r=[],ab=abertas();
  for(let i=0;i<n;i++){const d=new Date(ANO,MES+i,1);
    r.push({mes:`${MESC[d.getMonth()]}/${String(d.getFullYear()).slice(2)}`,
      valor:ab.filter(p=>noMes(p.vencimento,d.getFullYear(),d.getMonth())).reduce((s,p)=>s+ +p.valor,0)});}
  return r;
}
function semanas(a,m){
  const ult=new Date(a,m+1,0).getDate();
  const faixas=[[1,7],[8,14],[15,21],[22,ult]];
  const M=metaDoMes(a,m); let acum=0;
  return faixas.map(([i,f],k)=>{
    let v=0;
    D.parcelas.filter(p=>p.pago&&noMes(p.data_pagamento||p.vencimento,a,m)).forEach(p=>{
      const dd=dObj(p.data_pagamento||p.vencimento).getDate();if(dd>=i&&dd<=f)v+=+p.valor;});
    D.lancamentos.filter(l=>l.tipo==='entrada'&&l.pago&&noMes(l.data,a,m)).forEach(l=>{
      const dd=dObj(l.data).getDate();if(dd>=i&&dd<=f)v+=+l.valor;});
    acum+=v;
    return {n:k+1,ini:i,fim:f,valor:v,alvo:M.s[k],pct:M.s[k]?v/M.s[k]*100:0,acum,pctAcum:M.total?acum/M.total*100:0};
  });
}
function repasseAno(a){
  const meses=(D.config.repasse_meses||'1,4,7,10').split(',').map(x=>+x.trim()-1).filter(x=>x>=0&&x<12);
  const fw=D.produtos.find(p=>/framework/i.test(p.nome));
  return meses.map(m=>{
    let base=0;
    for(let k=1;k<=3;k++){const d=new Date(a,m-k,1);
      const cx=caixaMes(d.getFullYear(),d.getMonth());
      base+=fw?(cx.pp[fw.id]||0):cx.total;}
    return {mes:m,base,provisao:base*0.25,passou:new Date(a,m+1,0)<HOJE};
  });
}

/* ================= AGENTE ================= */
function agenteLocal(){
  const A=[];
  const cx=caixaMes(ANO,MES), dp=despesasMes(ANO,MES);
  const fat=faturaTotal(ANO,MES), imp=impostoMes(), M=metaDoMes(ANO,MES);
  const ab=abertas(), atr=ab.filter(p=>p.d<0);
  const hoje=HOJE.getDate(), ult=new Date(ANO,MES+1,0).getDate();
  const mesAtual=(ANO===HOJE.getFullYear()&&MES===HOJE.getMonth());
  const res=cx.total-dp.total;
  A.push(['bom',`<strong>Resultado de ${MESES[MES]}: ${rs(res)}.</strong> Entrou ${rs(cx.total)} e saiu ${rs(dp.total)}. Margem de ${cx.total?(res/cx.total*100).toFixed(1):'0'}%.`]);
  if(M.total>0&&mesAtual&&hoje>3){
    const proj=cx.total/hoje*ult, falta=Math.max(0,M.total-cx.total), restam=Math.max(1,ult-hoje);
    A.push([proj<M.total*0.95?'atencao':'bom',proj<M.total*0.95
      ?`<strong>Ritmo abaixo da meta.</strong> No passo atual o mês fecha em ${rsc(proj)}, ${rsc(M.total-proj)} abaixo. Faltam ${rsc(falta)} em ${restam} dias, ou ${rsc(falta/restam)} por dia.`
      :`<strong>Ritmo acima da meta.</strong> No passo atual o mês fecha em ${rsc(proj)}.`]);
  }
  if(atr.length){const v=atr.reduce((s,p)=>s+ +p.valor,0);const pior=atr.reduce((a,b)=>a.d<b.d?a:b);
    A.push(['critico',`<strong>${atr.length} parcelas vencidas somando ${rs(v)}.</strong> A mais antiga é de ${esc(pior.mentorado?.nome||'sem nome')}, há ${-pior.d} dias.`]);}
  const mrrDe=l=>l.reduce((s,c)=>s+ +c.valor_total/Math.max(1,c.meses),0);
  const venc=D.contratos.filter(c=>c.status==='ativo'&&dias(c.data_fim)<0);
  const prox=D.contratos.filter(c=>c.status==='ativo'&&dias(c.data_fim)>=0&&dias(c.data_fim)<=30);
  if(venc.length) A.push(['critico',`<strong>${venc.length} contratos venceram e seguem como ativos</strong>, ${rsc(mrrDe(venc))} de MRR que pode já ter saído.`]);
  if(prox.length) A.push(['atencao',`<strong>${prox.length} contratos vencem em 30 dias</strong>, ${rsc(mrrDe(prox))} de MRR em risco.`]);
  const g=agrupaPorMatriz(dp.pc);
  if(g.length) A.push(['info',`<strong>Maior bloco de despesa: ${esc(g[0][0])}, ${rs(g[0][1].total)}</strong>, ${(g[0][1].total/dp.total*100).toFixed(0)}% do mês.`]);
  const ap=aPagar(ANO,MES);
  if(ap>0) A.push(['atencao',`<strong>${rs(ap)} ainda a pagar.</strong> Com ${rsc(cx.total)} recebido, o caixa do mês ${cx.total>=ap?'cobre':'não cobre'}.`]);
  const novos=D.parcelamentos.filter(p=>noMes(p.primeira_competencia,ANO,MES));
  if(novos.length) A.push(['critico',`<strong>${novos.length} parcelamentos novos neste mês</strong>, criando ${rs(novos.reduce((s,p)=>s+ +p.valor_parcela*p.total_parcelas,0))} de compromisso futuro.`]);
  else if(D.parcelamentos.length) A.push(['bom',`<strong>Zero parcelamento novo em ${MESES[MES]}.</strong> Mantendo assim a fatura cai sozinha.`]);
  if(imp>0) A.push(['info',`<strong>Provisionar ${rs(imp)} de imposto</strong>, ${D.config.aliquota}% sobre ${rsc(D.config.base_declarada)}.`]);
  const custo=dp.total||(fat+imp);
  if(custo>0){const m=reservaTotal()/custo;
    A.push([m<3?'critico':'bom',`<strong>Reserva de ${m.toFixed(1)} mês(es).</strong> ${rsc(reservaTotal())} contra custo mensal de ${rsc(custo)}. O alvo de 3 meses seria ${rsc(custo*3)}.`]);}
  return A;
}
function dadosParaIA(){
  const cx=caixaMes(ANO,MES), dp=despesasMes(ANO,MES);
  const hist=[];
  for(let i=5;i>=0;i--){const d=new Date(ANO,MES-i,1);
    const c=caixaMes(d.getFullYear(),d.getMonth()), s=despesasMes(d.getFullYear(),d.getMonth());
    hist.push({mes:`${MESC[d.getMonth()]}/${d.getFullYear()}`,recebido:Math.round(c.total),despesas:Math.round(s.total),resultado:Math.round(c.total-s.total)});}
  const M=metaDoMes(ANO,MES);
  return {
    mes:`${MESES[MES]} ${ANO}`, hoje:HOJE.getDate(),
    caixa_recebido:Math.round(cx.total),
    recebido_por_produto:Object.fromEntries(Object.entries(cx.pp).map(([k,v])=>[nomeProd(k),Math.round(v)])),
    despesas_total:Math.round(dp.total),
    despesas_por_matriz:Object.fromEntries(agrupaPorMatriz(dp.pc).map(([k,v])=>[k,Math.round(v.total)])),
    a_pagar:Math.round(aPagar(ANO,MES)), ja_pago:Math.round(pagoMes(ANO,MES)),
    meta_total:M.total, meta_semanal:M.s,
    semanas:semanas(ANO,MES).map(s=>({semana:s.n,recebido:Math.round(s.valor),alvo:Math.round(s.alvo),pct:Math.round(s.pct)})),
    historico_6_meses:hist,
    contratos:{ativos:D.contratos.filter(c=>c.status==='ativo').length,
      cancelados:D.contratos.filter(c=>c.status==='cancelado').length,
      mrr:Math.round(D.contratos.filter(c=>c.status==='ativo').reduce((s,c)=>s+ +c.valor_total/Math.max(1,c.meses),0)),
      vencidos_ainda_ativos:D.contratos.filter(c=>c.status==='ativo'&&dias(c.data_fim)<0).length,
      vencem_30_dias:D.contratos.filter(c=>c.status==='ativo'&&dias(c.data_fim)>=0&&dias(c.data_fim)<=30).length},
    recebiveis:{em_aberto:Math.round(abertas().reduce((s,p)=>s+ +p.valor,0)),
      vencidos:Math.round(abertas().filter(p=>p.d<0).reduce((s,p)=>s+ +p.valor,0)),
      vencidos_qtd:abertas().filter(p=>p.d<0).length},
    previsao_6_meses:previsao(6),
    cartoes:D.cartoes.map(c=>({nome:c.nome,fatura_mes:Math.round(faturaCartao(c.id,ANO,MES)),
      fatura_em_3m:Math.round(faturaCartao(c.id,ANO,MES+3)),
      parcelamentos:D.parcelamentos.filter(p=>p.cartao_id===c.id).length})).filter(c=>c.fatura_mes>0),
    parcelamentos_novos_no_mes:D.parcelamentos.filter(p=>noMes(p.primeira_competencia,ANO,MES))
      .map(p=>({descricao:p.descricao,parcela:+p.valor_parcela,total:p.total_parcelas})),
    reserva:{caixa:Math.round(somaCaixa()),investido:Math.round(somaInvestido()),total:Math.round(reservaTotal())},
    imposto_provisionado:Math.round(impostoMes()),
    repasse_sociedade:repasseAno(ANO).map(r=>({mes:MESES[r.mes],provisao:Math.round(r.provisao),passou:r.passou}))
  };
}
async function rodarIA(){
  const url=D.config.agente_url;
  if(!url) return toast('Configure a URL do agente em Configurações.',true);
  IA={estado:'rodando',itens:[],erro:''}; verDash();
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(url,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token||SUPABASE_KEY}`},
      body:JSON.stringify({modo:'analise',mes:`${MESES[MES]} ${ANO}`,dados:dadosParaIA(),
        automaticos:agenteLocal().map(([n,t])=>t.replace(/<[^>]+>/g,''))})});
    const j=await r.json();
    if(j.erro) throw new Error(j.erro);
    IA={estado:'pronto',itens:j.apontamentos||[],erro:''};
  }catch(e){IA={estado:'erro',itens:[],erro:String(e.message||e)};}
  verDash();
}

async function salvarRepasse(ano_mes,campo,valor){
  const reg=D.repasses.find(x=>x.ano_mes===ano_mes)||{ano_mes,percentual:25,pago:false};
  const linha={ano_mes,base:reg.base||0,percentual:reg.percentual||25,
    valor:reg.valor||0,pago:reg.pago||false,observacao:reg.observacao||null};
  linha[campo]= campo==='valor' ? (+valor||0) : valor;
  const {error}=await sb.from('repasses').upsert(linha,{onConflict:'ano_mes'});
  if(error) return toast('Erro ao salvar repasse: '+error.message,true);
  const i=D.repasses.findIndex(x=>x.ano_mes===ano_mes);
  if(i>=0) D.repasses[i]=linha; else D.repasses.push(linha);

async function salvarMeta(campo,valor){

}

/* Regera as parcelas em aberto a partir do valor cheio e do numero de parcelas.
   O que ja foi pago fica intacto. */
async function regerar(id){
  const c=D.contratos.find(x=>x.id===id); if(!c) return;
  const rec=recebidoDe(id), saldo=+c.valor_total-rec, n=+c.parcelas_saldo||0;
  if(saldo<0) return toast(`O valor cheio está menor que os ${rs(rec)} já recebidos.`,true);
  if(saldo>0&&!n) return toast('Informe em quantas parcelas fica o saldo na coluna Parc.',true);
  const m=D.mentorados.find(x=>x.id===c.mentorado_id);
  if(!confirm(`${m?m.nome:'Contrato'}\n\nSaldo de ${rs(saldo)} em ${n} parcelas de ${rs(n?saldo/n:0)}, a partir do próximo mês.\n\nAs parcelas em aberto de hoje serão substituídas. Confirma?`)) return;

  const abertasId=D.parcelas.filter(p=>p.contrato_id===id&&!p.pago).map(p=>p.id);
  if(abertasId.length){
    const {error}=await sb.from('parcelas').delete().in('id',abertasId);
    if(error) return toast('Erro ao limpar: '+error.message,true);
    D.parcelas=D.parcelas.filter(p=>!abertasId.includes(p.id));
  }
  if(saldo>0&&n>0){
    const di=new Date(HOJE.getFullYear(),HOJE.getMonth()+1,10);
    const pagas=D.parcelas.filter(p=>p.contrato_id===id).length;
    const base=Math.floor(saldo/n*100)/100, novas=[];
    for(let i=0;i<n;i++){
      const v=new Date(di.getFullYear(),di.getMonth()+i,10);
      novas.push({contrato_id:id,numero:pagas+i+1,
        valor:i===n-1?+(saldo-base*(n-1)).toFixed(2):base,vencimento:iso(v),pago:false});
    }
    const {data,error}=await sb.from('parcelas').insert(novas).select();
    if(error) return toast('Erro ao gerar: '+error.message,true);
    D.parcelas.push(...(data||[]));
    const fim=new Date(di.getFullYear(),di.getMonth()+n-1,10);
    await sb.from('contratos').update({entrada:rec,meses:n+1,revisado:true,data_fim:iso(fim)}).eq('id',id);
    Object.assign(c,{entrada:rec,meses:n+1,revisado:true,data_fim:iso(fim)});
    toast(`${n} parcelas de ${rs(saldo/n)} geradas.`);
  } else {
    toast('Contrato quitado, sem parcelas em aberto.');
  }
  desenhar();
}

async function novoContrato(){
  const nome=document.getElementById('cnNome').value.trim();
  const produto_id=document.getElementById('cnProd').value;
  const valor=+document.getElementById('cnValor').value||0;
  const entrada=+document.getElementById('cnEntrada').value||0;
  const meses=Math.max(1,+document.getElementById('cnMeses').value||1);
  const nParc=Math.max(0,+document.getElementById('cnParc').value||0);
  const ini=document.getElementById('cnIni').value;
  if(!nome)return toast('Informe o nome.',true);
  if(!valor)return toast('Informe o valor cheio.',true);
  if(entrada>valor)return toast('A entrada não pode ser maior que o valor cheio.',true);
  const {data:m,error:e1}=await sb.from('mentorados').insert({nome,produto_id,
    calls_contratadas:+document.getElementById('cnCalls').value||0}).select().single();
  if(e1)return toast('Erro: '+e1.message,true);
  const di=dObj(ini), df=new Date(di.getFullYear(),di.getMonth()+meses,di.getDate());
  const {data:c,error:e2}=await sb.from('contratos').insert({mentorado_id:m.id,produto_id,
    valor_total:valor,entrada,meses,parcelas_saldo:nParc,revisado:true,
    data_inicio:ini,data_fim:iso(df)}).select().single();
  if(e2)return toast('Erro no contrato: '+e2.message,true);
  const ps=[]; let nn=0;
  if(entrada>0) ps.push({contrato_id:c.id,numero:++nn,valor:entrada,vencimento:ini,pago:true,data_pagamento:ini});
  const saldo=valor-entrada;
  if(saldo>0&&nParc>0){
    const base=Math.floor(saldo/nParc*100)/100;
    for(let i=0;i<nParc;i++){const v=new Date(di.getFullYear(),di.getMonth()+i+1,di.getDate());
      ps.push({contrato_id:c.id,numero:++nn,
        valor:i===nParc-1?+(saldo-base*(nParc-1)).toFixed(2):base,
        vencimento:iso(v),pago:false});}
  }
  const {data:pp}=await sb.from('parcelas').insert(ps).select();
  D.mentorados.push(m);D.contratos.push(c);D.parcelas.push(...(pp||[]));
  ['cnNome','cnValor'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('cnEntrada').value='0';
  toast(`${nome} adicionado. Entrada ${rs(entrada)} e ${nParc} parcelas de ${rs(nParc?(valor-entrada)/nParc:0)}.`);
  desenhar();
}

  document.getElementById('v-desp').innerHTML=h;

/* Cria ou reaponta uma categoria orfa para dentro de uma matriz. */
async function adotarCategoria(nome,parent_id){
  if(!parent_id) return;
  const pai=D.categorias.find(c=>c.id===parent_id);
  const ja=D.categorias.find(c=>c.nome===nome);
  if(ja){
    const {error}=await sb.from('categorias').update({parent_id,matriz:false}).eq('id',ja.id);
    if(error) return toast('Erro: '+error.message,true);
    ja.parent_id=parent_id; ja.matriz=false;
  } else {
    const {data,error}=await sb.from('categorias').insert({nome,parent_id,matriz:false,
      tipo:'despesa',escopo:pai?.escopo||'ambos',ordem:99}).select().single();
    if(error) return toast('Erro: '+error.message,true);
    D.categorias.push(data);
  }
  toast(`"${nome}" agora fica em ${pai?pai.nome:'a matriz escolhida'}.`);
  desenhar();
}

async function novoFixo(){
  const cat=document.getElementById('fCat').value;
  const r={descricao:document.getElementById('fDesc').value.trim(),categoria:cat,
    valor:+document.getElementById('fValor').value||0,dia:+document.getElementById('fDia').value||5,
    tipo:'despesa',escopo:/pessoal/i.test(cat)?'pessoal':'empresa'};
  if(!r.descricao)return toast('Informe a descrição.',true);
  if(!r.valor)return toast('Informe o valor.',true);
  const {data,error}=await sb.from('recorrencias').insert(r).select().single();
  if(error)return toast('Erro: '+error.message,true);
  D.recorrencias.push(data);['fDesc','fValor'].forEach(i=>document.getElementById(i).value='');
  toast('Fixo cadastrado.');desenhar();
}
async function gerarFixos(){
  const jaGer=new Set(D.lancamentos.filter(l=>noMes(l.data,ANO,MES)&&l.recorrencia_id).map(l=>l.recorrencia_id));
  const pend=D.recorrencias.filter(r=>r.ativo!==false&&!jaGer.has(r.id));
  if(!pend.length)return toast('Nada pendente.');
  const novos=pend.map(r=>({data:iso(new Date(ANO,MES,Math.min(r.dia||5,28))),competencia:iso(new Date(ANO,MES,1)),
    tipo:r.tipo,categoria:r.categoria,descricao:r.descricao,valor:r.valor,escopo:r.escopo,
    produto_id:r.produto_id,pago:false,recorrencia_id:r.id}));
  const {data,error}=await sb.from('lancamentos').insert(novos).select();
  if(error)return toast('Erro: '+error.message,true);
  D.lancamentos.push(...data);toast(`${data.length} fixos lançados.`);desenhar();
}

/* ================= LANÇAMENTOS ================= */
function filtrados(){
  return D.lancamentos.filter(l=>{
    const d=String(l.data).slice(0,10);
    if(FILTRO.ini||FILTRO.fim){
      if(FILTRO.ini&&d<FILTRO.ini)return false;
      if(FILTRO.fim&&d>FILTRO.fim)return false;
    } else if(!noMes(l.data,ANO,MES)) return false;
    if(FILTRO.tipo&&l.tipo!==FILTRO.tipo)return false;
    if(FILTRO.cat&&matrizDe(l.categoria)!==FILTRO.cat&&l.categoria!==FILTRO.cat)return false;
    return true;
  }).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
}

  <h2><span class="q"></span>${FILTRO.ini||FILTRO.fim?'Período filtrado':MESES[MES]+' '+ANO} · entradas ${rsc(ent)} · saídas ${rsc(des)} · resultado ${rsc(ent-des)}</h2>`;

  </tr></thead><tbody>`;
  g.forEach(([m,o])=>{

    });

  h+='</tbody></table></div>';

function carregarPrints(files){
  const arr=[...files].filter(f=>f.type.startsWith('image/')).slice(0,8);
  if(!arr.length)return toast('Escolha arquivos de imagem.',true);
  PRINTS=[];let lidos=0;
  arr.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{PRINTS.push({tipo:f.type,dados:String(r.result).split(',')[1],url:r.result});
      if(++lidos===arr.length){desenhaMinis();
        const b=document.getElementById('btLer');if(b){b.disabled=false;b.textContent=`Ler ${PRINTS.length} print(s) com IA`;}}};
    r.readAsDataURL(f);
  });
}
function desenhaMinis(){
  const el=document.getElementById('minis');if(!el)return;
  el.innerHTML=PRINTS.map(p=>`<img src="${p.url}" alt="">`).join('');
}
async function lerPrints(){
  if(!PRINTS.length)return toast('Escolha os prints primeiro.',true);
  const url=D.config.agente_url;
  if(!url)return toast('Configure a URL do agente em Configurações.',true);
  const b=document.getElementById('btLer'); b.disabled=true; b.innerHTML='<span class="girando"></span>Lendo';
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(url,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token||SUPABASE_KEY}`},
      body:JSON.stringify({modo:'fatura',mes:`${MESES[MES]} ${ANO}`,
        imagens:PRINTS.map(p=>({tipo:p.tipo,dados:p.dados}))})});
    const j=await r.json();
    if(j.erro) throw new Error(j.erro);
    mostrarLidas(j.linhas||[]);
  }catch(e){
    document.getElementById('resultadoImp').innerHTML=`<div class="alerta critico" style="margin-top:14px"><div><strong>Não consegui ler.</strong><br>${esc(String(e.message||e))}</div></div>`;
  }
  b.disabled=false; b.textContent=`Ler ${PRINTS.length} print(s) com IA`;
}
let LIDAS=[];
function mostrarLidas(linhas){
  LIDAS=linhas.filter(l=>+l.valor>0);
  const el=document.getElementById('resultadoImp');
  if(!LIDAS.length){el.innerHTML='<div class="vazio">A IA não encontrou linhas legíveis.</div>';return;}
  const parc=LIDAS.filter(l=>l.parcela_total>1), ass=LIDAS.filter(l=>!(l.parcela_total>1));
  el.innerHTML=`<h2 style="margin-top:22px"><span class="q"></span>${LIDAS.length} linhas lidas · confira antes de salvar</h2>
  <div class="rolagem"><table><thead><tr><th>Descrição</th><th>Categoria</th><th class="d">Parcela</th><th class="d">Valor</th><th>Vira</th></tr></thead><tbody>
  ${LIDAS.map((l,i)=>`<tr>
    <td class="nome"><input class="ed nm" value="${esc(l.descricao)}" onchange="LIDAS[${i}].descricao=this.value"></td>
    <td><input class="ed" value="${esc(l.categoria||'Outros')}" onchange="LIDAS[${i}].categoria=this.value"></td>
    <td class="d">${l.parcela_total>1?`<input class="ed n" style="width:34px" type="number" value="${l.parcela_atual||1}" onchange="LIDAS[${i}].parcela_atual=+this.value">/<input class="ed n" style="width:34px" type="number" value="${l.parcela_total}" onchange="LIDAS[${i}].parcela_total=+this.value">`:'—'}</td>
    <td class="d"><input class="ed n" style="width:96px" type="number" step="0.01" value="${l.valor}" onchange="LIDAS[${i}].valor=+this.value"></td>
    <td>${l.parcela_total>1?'<span class="tag al">parcelamento</span>':'<span class="tag">assinatura</span>'}</td>
  </tr>`).join('')}</tbody></table></div>
  <div style="margin-top:14px"><button class="btn" onclick="salvarLidas()">Salvar ${parc.length} parcelamentos e ${ass.length} assinaturas</button>
  <button class="btnv" onclick="LIDAS=[];document.getElementById('resultadoImp').innerHTML=''">Descartar</button></div>`;
}
async function salvarLidas(){
  const cartao_id=document.getElementById('impCart').value;
  const parc=LIDAS.filter(l=>l.parcela_total>1).map(l=>{
    const at=Math.max(1,+l.parcela_atual||1);
    return {cartao_id,descricao:l.descricao||'Compra',categoria:l.categoria||'Outros',
      valor_parcela:+l.valor,total_parcelas:+l.parcela_total,
      primeira_competencia:iso(new Date(ANO,MES-(at-1),1)),escopo:'pessoal'};});
  const ass=LIDAS.filter(l=>!(l.parcela_total>1)).map(l=>
    ({cartao_id,descricao:l.descricao||'Lançamento',valor:+l.valor,escopo:'pessoal',ativo:true}));
  if(parc.length){const{data,error}=await sb.from('parcelamentos').insert(parc).select();
    if(error)return toast('Erro: '+error.message,true);D.parcelamentos.push(...data);}
  if(ass.length){const{data,error}=await sb.from('assinaturas').insert(ass).select();
    if(error)return toast('Erro: '+error.message,true);D.assinaturas.push(...data);}
  LIDAS=[];PRINTS=[];toast(`${parc.length+ass.length} linhas salvas.`);desenhar();
}
async function novoCartao(){
  const r={nome:document.getElementById('kNome').value.trim(),bandeira:document.getElementById('kBand').value.trim()||null,
    dia_vencimento:+document.getElementById('kDia').value||10,escopo:document.getElementById('kEsc').value};
  if(!r.nome)return toast('Informe o nome do cartão.',true);
  const {data,error}=await sb.from('cartoes').insert(r).select().single();
  if(error)return toast('Erro: '+error.message,true);
  D.cartoes.push(data);
  await sb.from('categorias').insert({nome:'Cartão · '+r.nome,tipo:'despesa',escopo:r.escopo,
    parent_id:D.categorias.find(c=>c.nome==='Cartões'&&c.matriz)?.id||null,matriz:false,ordem:50});
  const {data:cat}=await sb.from('categorias').select('*');D.categorias=cat||D.categorias;
  document.getElementById('kNome').value='';toast('Cartão adicionado com categoria própria.');desenhar();

async function novoParcelamento(){

    <div class="campo"><label>URL do agente</label><input id="cAgente" value="${esc(c.agente_url||'')}"></div>
  </div>
  <div style="margin-top:14px"><button class="btn" onclick="salvarConfig()">Salvar</button></div></div>

  <h2><span class="q"></span>Produtos</h2>
  <div class="cartao rolagem"><table><thead><tr>
    <th>Produto</th><th>Cor</th><th class="d">Contratos</th><th class="d">MRR</th><th>Ativo</th><th></th>
  </tr></thead><tbody>
  ${D.produtos.map(p=>{const cs=D.contratos.filter(x=>x.status==='ativo'&&x.produto_id===p.id);
    return `<tr>
    <td class="nome"><input class="ed nm" value="${esc(p.nome)}" onchange="up('produtos','${p.id}','nome',this.value)"></td>
    <td><input class="ed" type="color" style="width:52px;padding:1px" value="${esc(p.cor||'#44CF17')}" onchange="up('produtos','${p.id}','cor',this.value)"></td>
    <td class="d">${cs.length}</td>
    <td class="d">${rsc(cs.reduce((s,x)=>s+ +x.valor_total/Math.max(1,x.meses),0))}</td>
    <td><button class="tag ${p.ativo!==false?'ok':'mal'}" onclick="up('produtos','${p.id}','ativo',${p.ativo===false})">${p.ativo!==false?'ativo':'inativo'}</button></td>
    <td><button class="x" onclick="apagarProduto('${p.id}',${cs.length})" aria-label="Remover">✕</button></td></tr>`}).join('')}
  </tbody></table></div>
  <div class="cartao" style="margin-top:12px"><div class="formlinha">
    <div class="campo"><label>Novo produto</label><input id="prNome"></div>
    <div class="campo"><label>Cor</label><input id="prCor" type="color" value="#44CF17"></div>
    <button class="btn" onclick="novoProduto()">Adicionar produto</button>
  </div><p class="nota">Produto inativo some dos formulários novos mas continua nos contratos antigos. Só dá para apagar produto sem contrato ativo.</p></div>

  <h2><span class="q"></span>Categorias · edite o nome e o escopo direto na tabela</h2>
  <div class="cartao rolagem"><table><thead><tr>
    <th>Categoria</th><th>Dentro de</th><th>Escopo</th><th>Tipo</th><th></th>
  </tr></thead><tbody>
  ${matrizes('despesa').concat(matrizes('entrada')).map(m=>
    `<tr class="matriz">
      <td><input class="ed nm" value="${esc(m.nome)}" onchange="up('categorias','${m.id}','nome',this.value)"></td>
      <td class="rotulo" style="font-size:10px">matriz</td>
      <td><select class="ed" onchange="up('categorias','${m.id}','escopo',this.value)">${['ambos','empresa','pessoal'].map(e=>`<option value="${e}"${m.escopo===e?' selected':''}>${e}</option>`).join('')}</select></td>
      <td class="rotulo" style="font-size:10px">${m.tipo}</td><td></td></tr>`+
    filhosDe(m.id).map(f=>`<tr class="filho">
      <td><input class="ed nm" value="${esc(f.nome)}" onchange="up('categorias','${f.id}','nome',this.value)"></td>
      <td><select class="ed" onchange="up('categorias','${f.id}','parent_id',this.value)">${matrizes(f.tipo).map(x=>`<option value="${x.id}"${x.id===f.parent_id?' selected':''}>${esc(x.nome)}</option>`).join('')}</select></td>
      <td><select class="ed" onchange="up('categorias','${f.id}','escopo',this.value)">${['ambos','empresa','pessoal'].map(e=>`<option value="${e}"${f.escopo===e?' selected':''}>${e}</option>`).join('')}</select></td>
      <td class="rotulo" style="font-size:10px">${f.tipo}</td>
      <td><button class="x" onclick="del('categorias','${f.id}')" aria-label="Remover">✕</button></td></tr>`).join('')
  ).join('')}
  </tbody></table>
  <p class="nota">Renomear a categoria aqui não renomeia nos lançamentos antigos, porque eles guardam o nome. Se renomear, ajuste os lançamentos pela aba Lançamentos.</p></div>
  <div class="cartao" style="margin-top:12px"><div class="formlinha">
    <div class="campo"><label>Nova categoria</label><input id="ctNome"></div>
    <div class="campo"><label>Dentro de</label><select id="ctPai">${matrizes('despesa').concat(matrizes('entrada')).map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select></div>
    <div class="campo"><label>Escopo</label><select id="ctEsc"><option value="empresa">Empresa</option><option value="pessoal">Pessoal</option><option value="ambos">Ambos</option></select></div>
    <button class="btn" onclick="novaCategoria()">Adicionar</button>
  </div></div>`;
}
async function subirLogo(file){
  if(!file)return;
  const nome=`logo-${Date.now()}.${(file.name.split('.').pop()||'png')}`;
  const {error}=await sb.storage.from('branding').upload(nome,file,{upsert:true});
  if(error)return toast('Erro ao subir: '+error.message+' (o bucket branding foi criado na migração v4?)',true);
  const {data}=sb.storage.from('branding').getPublicUrl(nome);
  document.getElementById('cLogo').value=data.publicUrl;
  await sb.from('config').update({logo_url:data.publicUrl}).eq('id',1);
  D.config.logo_url=data.publicUrl; marca(); toast('Logo atualizada.'); desenhar();
}
async function novoProduto(){
  const nome=document.getElementById('prNome').value.trim();
  if(!nome)return toast('Informe o nome do produto.',true);
  const {data,error}=await sb.from('produtos').insert({nome,cor:document.getElementById('prCor').value,
    ordem:D.produtos.length+1}).select().single();
  if(error)return toast('Erro: '+error.message,true);
  D.produtos.push(data);document.getElementById('prNome').value='';toast('Produto criado.');desenhar();
}
async function apagarProduto(id,contratos){
  if(contratos>0)return toast(`Esse produto tem ${contratos} contratos ativos. Marque como inativo em vez de apagar.`,true);
  del('produtos',id);
}
async function novaCategoria(){
  const nome=document.getElementById('ctNome').value.trim();
  const parent_id=document.getElementById('ctPai').value;
  if(!nome)return toast('Informe o nome.',true);
  const pai=D.categorias.find(c=>c.id===parent_id);
  const {data,error}=await sb.from('categorias').insert({nome,parent_id,tipo:pai?.tipo||'despesa',
    escopo:document.getElementById('ctEsc').value,matriz:false,ordem:99}).select().single();
  if(error)return toast('Erro: '+error.message,true);
  D.categorias.push(data);document.getElementById('ctNome').value='';toast('Categoria criada.');desenhar();
}
async function salvarConfig(){
  const r={negocio:document.getElementById('cNome').value.trim()||'Painel RHINO',
    razao_social:document.getElementById('cRazao').value.trim(),
    logo_url:document.getElementById('cLogo').value.trim()||null,
    cor_primaria:document.getElementById('cCor').value,cor_fundo:document.getElementById('cFundo').value,
    assinatura:document.getElementById('cAssin').value.trim(),
    caixa_empresa:+document.getElementById('cCaixa').value||0,
    meta_mensal:+document.getElementById('cMeta').value||0,
    aliquota:+document.getElementById('cAliq').value||0,
    base_declarada:+document.getElementById('cBase').value||0,
    repasse_meses:document.getElementById('cRepasse').value.trim()||'1,4,7,10',
    agente_url:document.getElementById('cAgente').value.trim()||null};
  const {error}=await sb.from('config').update(r).eq('id',1);
  if(error)return toast('Erro: '+error.message,true);
  D.config={...D.config,...r};marca();toast('Configurações salvas.');desenhar();
}

/* ================= GENÉRICOS ================= */
async function up(tabela,id,campo,valor){
  if(!id||id==='undefined'||id==='null')return toast('Registro sem vínculo, não dá para salvar.',true);
  const {error}=await sb.from(tabela).update({[campo]:valor}).eq('id',id);
  if(error)return toast('Erro ao salvar: '+error.message,true);
  const it=D[tabela]?.find(x=>x.id===id);if(it)it[campo]=valor;
  toast('Salvo.');desenhar();
}
const upNum=(t,i,c,v)=>up(t,i,c,+v||0);
async function del(tabela,id){
  if(!confirm('Remover? Isso não pode ser desfeito.'))return;
  const {error}=await sb.from(tabela).delete().eq('id',id);
  if(error)return toast('Erro ao remover: '+error.message,true);
  D[tabela]=D[tabela].filter(x=>x.id!==id);
  if(tabela==='mentorados')D.contratos=D.contratos.filter(c=>c.mentorado_id!==id);
  toast('Removido.');desenhar();
}
</script>
</body>
</html>
